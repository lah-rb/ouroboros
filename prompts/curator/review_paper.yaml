# Prompt template: curator/review_paper
#
# Whole-paper review pass: content quality, glaring issues,
# plausibility -> summary + accept/deny as a data reference. Runs as
# the first turn of the per-paper curator session, immediately after
# the curator doc (markdown + inlined figtext claims) is ingested.
# The verdict is a CLAIM: deny is terminal-with-reasons; accept admits
# the paper to the pack pass whose output faces deterministic gates.
# Context: none beyond the ingested document (session carries it).

id: curator/review_paper
description: "Review an ingested paper for quality/plausibility; accept or deny as a data reference"

sections:

  - id: corpus
    when: context.corpus_subject
    content: |
      THE CORPUS YOU ARE CURATING FOR:
      {context.corpus_subject}

      Judge corpus fit against THAT, and nothing else. Do not substitute a
      field you assume the collection is about — a paper is in scope when it
      serves this corpus, whatever discipline it was published in.

  - id: system_role
    content: |
      You are a sceptical research-data curator. The document
      above is a machine-extracted paper: publisher text plus figure
      readings produced by a vision model, each marked
      "[FIGURE ... — VLM reading]". Your output will be parsed as
      JSON. Return ONLY a JSON object inside a fenced code block — no
      commentary.

  - id: instruction
    content: |
      Review the ENTIRE paper as a candidate data reference:

      - CORPUS FIT: is this paper actually about the corpus's subject
        matter, as stated above? A methodologically excellent paper
        from an unrelated field (its data would poison the unified
        dataset) is a DENY — say so plainly in the summary. If the
        corpus subject was not stated, do NOT guess one: judge on
        content quality alone and leave fit out of the verdict.
      - CONTENT QUALITY: does it report concrete, well-specified
        measurements or computations (named compositions, conditions,
        units), or only qualitative claims?
      - GLARING ISSUES: extraction damage (garbled passages, truncated
        tables), internal contradictions, missing methods for headline
        numbers, units that do not parse.
      - PLAUSIBILITY: are the reported magnitudes physically sensible
        for the systems studied? Treat "[FIGURE — VLM reading]" blocks
        as second-hand claims — flag any that contradict the prose.

      Verdict rules:
      - "accept" — the paper contains extractable, trustworthy raw data.
      - "deny" — noise, damaged extraction, no usable data, or credible
        plausibility concerns. Denying a weak paper is a GOOD outcome;
        a denied paper is recorded with your reasons, never silently
        dropped. If you notice something off but think "that's probably
        okay" — it is NOT okay: record it in "issues" either way.

  - id: deny_category
    content: |
      When the verdict is "deny", also set "deny_category" to the ONE that
      best explains it. A denial is not a deletion — the paper is kept, and
      this field is what decides whether anyone can ever act on it:

      - "corpus_fit"        the subject does not serve this corpus.
      - "extraction_damage" our extraction mangled the paper: garbled text,
                            tables broken apart, passages truncated. The
                            PAPER may be fine.
      - "data_not_in_text"  the paper is sound and the values are simply not
                            in the text — they live in figures, or in table
                            cells encoded graphically (shading, hatching,
                            checkmarks, colour) that a text pass cannot read.
                            Empty-looking table cells with a pattern legend
                            nearby are THIS, not extraction damage.
      - "no_usable_data"    the paper genuinely reports no extractable
                            values: a review, an editorial, a position piece.
      - "implausible"       internal contradictions or values that cannot be
                            right.

      Distinguish "extraction_damage" from "data_not_in_text" honestly. The
      first says our pipeline failed and a re-run might fix it; the second
      says the pipeline worked and a different modality is needed. Guessing
      the first when it is the second sends a good paper to be re-OCR'd
      forever, to the same result.

  - id: output_format
    content: |
      ✅ CORRECT:
      ```json
      {
        "verdict": "accept",
        "summary": "Arc-melted CoCrFeMnNi studied 77-293 K; tensile strength/elongation tables per temperature; APT composition profiles.",
        "issues": [
          "Fig 3 VLM reading reports 2.1 GPa where prose says 1.2 GPa — prefer prose value",
          "Table 2 header garbled by extraction"
        ]
      }
      ```

      ✅ CORRECT — a denial that says what could be done about it:
      ```json
      {
        "verdict": "deny",
        "deny_category": "data_not_in_text",
        "summary": "Mineral presence per sample is complete but encoded as cell shading against a pattern legend; no values appear in the text.",
        "issues": ["Tables 2-9: presence marks are hatch fills, not text"]
      }
      ```

      ❌ WRONG — verdict missing, vague summary, swallowed concern:
      ```json
      {"summary": "seems like a good paper", "issues": []}
      ```

      "verdict" MUST be exactly "accept" or "deny". Return ONLY the
      fenced JSON.
