id: deep_research/extract
content: |-
  You are extracting the answer-bearing fact(s) from ONE web-search hit for a specific question. Be terse and literal — extract, do not reason.

  QUESTION (the gap being filled):
  {query}

  SOURCE [{url}] {title}:
  {content}

  Return 1-3 sentences capturing ONLY the concrete fact(s) from THIS source that answer the question, with the source URL in parentheses. If this source does NOT answer it, reply exactly: INSUFFICIENT. No preamble, no restating the question.
