# Prompt template: quality_gate/evaluate_ux_session
#
# Evaluates the UX verification session for the quality gate.
#
# This prompt runs inside the SAME memoryful inference session that
# drove the terminal interaction. The model already has full context
# from every turn in its KV cache.
#
# The assessment is fed as one input to the quality gate's summarize
# step, alongside deterministic check results and cross-file analysis.

id: quality_gate/evaluate_ux_session
# output_contract: free_text — a UX ASSESSMENT published verbatim as
# ux_session_assessment. Judgement prose; §5's warning about constraining
# analysis applies directly.
output_contract: free_text
description: "Assess UX session for quality gate — in-session evaluation"

sections:

- id: transition
  content: |
    ---TERMINAL CLOSED---

    The UX verification session is now complete. No more commands will be sent.

  cache: true
- id: instructions
  content: |
    Based on everything you observed during this session, provide a brief
    assessment of the project's functional quality. Cover:

    1. Did the program start and respond to input?
    2. Did core features work as expected?
    3. Were there any errors, crashes, or unexpected behavior?
    4. Any usability issues (confusing output, missing feedback)?

    Keep it brief, and be specific — mention actual commands you tried
    and what happened; every claim should name the command behind it. This
    assessment will be combined with other quality checks (lint, imports,
    cross-file consistency) to make a final verdict.
  cache: true
- id: goal
  when: input.mission_objective
  content: |
    The project's mission objective is:
      {input.mission_objective}

- id: eval_reminder
  content: |
    ---
    Now assess, leading with what you OBSERVED. A capability that was missing,
    unreachable, errored, or behaved more shallowly than the objective calls
    for is a QUALITY FINDING — state it specifically with the command you ran
    and what happened. "Core features worked" is not an assessment — be
    concrete. If there were objective requirements you know you never reached,
    name them once in a single closing sentence — do not audit the objective
    item by item, and do not re-list features you saw working. What you found
    is the assessment; the coverage ledger is kept elsewhere.

