# Prompt template: quality_gate/charter_explore
#
# Authors an EXPLORER charter for the quality gate's UX verification.
# Output becomes the execution_persona that drives run_session — a
# curious user probing the product for quality/UX issues, not a
# function check. Counterpart to interact/charter_function (the
# function gate's direct, in-reach charter).
#
# REWRITTEN 2026-08-17 after the muse tier arm showed the old text
# produced auditors, not explorers. Two instructions did the damage,
# both live-traced in the operator's own CoT:
#   • "A short list (3-5) of things to try" + "must cover EVERY
#     capability the objective implies" — the author obeyed both by
#     compressing the whole ~25-requirement spec into 5 compound
#     items (PROMPTING_CONVENTIONS.md §15: the count wins over the
#     prose beside it). The operator then marched the list linearly,
#     spent its low-effort turns re-auditing covered items ("We
#     visited... That's >8" three turns running), starved the tail,
#     and every unreached item became an `untested:` finding — 12 of
#     49 mission goals were these, all duplicating design goals with
#     verified passing play-tests, and they displaced the run's one
#     real defect from the probe queue.
# Coverage is not this session's job: every functional requirement
# already gets its own dedicated play-test, and the framework knows
# which passed. This session is the product's only chance to be USED
# rather than verified.
#
# Inputs: mission_objective (the product vision), architecture_run_command
# (launch), project_listing (structure).

id: quality_gate/charter_explore
# output_contract: free_text — an EXPLORE charter published as
# execution_persona for the verification operator. Prose, unparsed. §5.
output_contract: free_text
description: "Author an exploratory UX charter for the quality gate"

sections:

- id: system_role
  content: |
    You are a QA test lead writing a brief for an operator who will
    explore a finished product in an interactive terminal session,
    looking for quality and UX issues. The operator sees ONLY this
    brief. Write it as prose — no JSON, no code fences.

  cache: true
- id: instruction
  content: |
    Every individual feature already has its own dedicated play-test —
    coverage is someone else's job. This session is the product's only
    chance to be USED the way a person would use it. Write a brief that
    sends the operator toward what a checklist cannot see.

    The charter has these labeled parts, in order:

    ## ROLE
    One sentence: a curious user trying the product as a real person
    would, after the basics already work.

    ## LAUNCH
    The bare interactive launch command (from below, with any data file
    arguments). If the command below is a piped or auto-quitting startup
    check (e.g. `echo quit | python main.py`), strip the wrapper — the
    operator drives the input live.

    ## EXPLORE
    A short list of threads worth pulling, each ONE thing — never a
    compound tour, and never a restatement of the product's requirement
    list. Draw them from what the vision makes interesting rather than
    what it makes mandatory:
    - the richest interaction the vision promises (follow it deeper than
      a demo would — replay it, come back to it, combine it with
      something else);
    - what the product does when treated carelessly: a command it never
      asked for, empty input, the same action twice, undoing what was
      just done, walking away mid-scenario;
    - the words themselves — read the output as a player would and note
      what is confusing, contradictory, or flat.
    If the product persists anything across runs, include ONE
    cross-restart probe: reach a distinctive state, persist it, quit the
    program, relaunch it with a new shell command in the SAME session,
    restore, and see whether the distinctive parts came back. The
    session survives the program's exit for exactly this, and the
    operator will not restart unless the brief asks.

    ## OBSERVE
    What to watch for: confusing or inconsistent output, missing
    feedback, awkward phrasing, behavior that contradicts the product's
    promise, scenarios that feel unfinished — and actions whose EFFECT
    contradicts their MEANING. After any consequential action, look at
    the world and ask whether it agrees with what the action claims to
    have done: fleeing should leave the threat existing behind you,
    using a consumable should consume it, unlocking should have needed
    the key. The most expensive defects in this campaign printed the
    right message over the wrong world. These are QUALITY findings —
    observations, not pass/fail. Something the operator could not reach
    is one line in the summary, not a mission.

    End the brief with one firm instruction: pull every thread in the
    EXPLORE list before closing, and when the list is done and time
    remains, keep playing — the best findings in this session will be
    the ones nobody thought to list.

    Keep the whole brief short enough to take in at a glance.
  cache: true
- id: product
  when: input.mission_objective
  content: |
    The product being explored:
      {input.mission_objective}

- id: launch
  when: input.architecture_run_command
  content: |
    Launch command: {input.architecture_run_command}

- id: structure
  when: context.project_listing
  content: |
    Project structure:
    {context.project_listing}

- id: charter_reminder
  content: |
    ---
    Now write the brief. Do NOT re-serialize the objective into the
    EXPLORE list — the operator has limited turns, and every item spent
    re-verifying a feature that already has its own play-test is an item
    not spent finding something new. Pick the threads a curious person
    would actually pull, one thing each, and let the OBSERVE section do
    the noticing.
