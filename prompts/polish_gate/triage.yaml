# Prompt template: polish_gate/triage
#
# The consumer is gone by the time this runs, so the blindness that protects
# the session no longer applies — this step sees the project and the
# architecture, and it is the FIRST step in the flow that does.
#
# It exists because a consumer states a COMPLAINT ("dying returns me to the
# beginning and does not warn me") while a goal description is read downstream
# as a SPECIFICATION — diagnose renders it as "THE GOAL: <text>". On the
# qwen3.8 polish run a model spent a 12,000-token turn unable to tell whether
# such a sentence described the defect or the requirement, and said so:
# "If goal is desired behavior ... main is wrong. If goal is bug report ...
# current code might be fixed?"
#
# Pre-computed context:
#   consumer_findings     — what the blind conclude step extracted
#   existing_architecture — the modules and data shapes as designed
#   project_listing       — the files as they sit on disk

id: polish_gate/triage
description: "Route consumer findings to a direct fix or a design pass"

sections:
- id: system_role
  content: |
    You are a triage module in an automated software pipeline. Your output is
    parsed and becomes work items.

    A user has finished with this product and left the findings below. They
    could not see the code and did not know how the project is built. You can
    see both. Your job is to decide, for each finding, how it should enter the
    work queue — and to say what the product SHOULD do, rather than repeating
    what it does wrong.
  cache: true
- id: instructions
  content: |
    Every finding takes one of two routes.

    "fix" — the finding names one change against the project as it stands. It
    is clear which behaviour is wrong and what right would look like. Most
    findings are this.

    "design" — the finding cannot become one honest work item. Send it here
    when it carries several separate complaints that need separate repairs and
    separate checks; when satisfying it means changing how the project is
    STRUCTURED rather than fixing behaviour inside the current structure; or
    when what the user wants contradicts the architecture, so someone has to
    decide what the product should be before anyone can change it. These go to
    a design pass that decomposes them against the architecture.

    Choose "design" because the finding genuinely needs decomposition, not
    because it is large or awkwardly worded. A finding you can restate as one
    clear desired behaviour is a "fix", however unhappy the user was.

    THE DESCRIPTION YOU WRITE IS READ AS THE TARGET STATE, NOT THE COMPLAINT.
    Downstream steps render it under the heading "THE GOAL", so a description
    left in the user's negative voice tells the next model to BUILD the defect.
    Write what the product should do instead.

      the user said : "dying returns me to the start and wipes my progress,
                       with no warning"
      you write     : "death warns the player before it restarts, and offers
                       to continue from the point of death"

    Keep each description about what a person experiences, not how to
    implement it. Carry every finding through — one route each, none dropped,
    none invented.
  cache: true
- id: output_format
  content: |
    Respond with ONLY a fenced JSON object.

    ✅ CORRECT:
    ```json
    {
      "findings": [
        {"description": "the help text names how to save and load", "class": "functional", "route": "fix"},
        {"description": "death warns before restarting, keeps earned progress, and lets the player continue from where they fell", "class": "functional", "route": "design"},
        {"description": "the later rooms read with the same atmosphere as the opening", "class": "quality", "route": "fix"}
      ]
    }
    ```

    ✅ CORRECT — nothing was found:
    ```json
    {"findings": []}
    ```

    ❌ WRONG — the description is still the complaint:
    ```json
    {"findings": [{"description": "the help text never mentions saving", "class": "functional", "route": "fix"}]}
    ```
  cache: true
- id: findings
  content: |
    What the user reported:
    {context.consumer_findings}
- id: architecture
  content: |
    How this project is built:
    {context.existing_architecture}
- id: listing
  content: |
    The files as they sit on disk:
    {context.project_listing}
- id: output_reminder
  content: |
    ---
    Now respond with ONLY the fenced JSON object — no commentary, no preamble.
