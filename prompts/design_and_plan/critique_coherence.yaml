# Prompt template: design_and_plan/critique_coherence
#
# Adversarial, fresh-context coherence critic for the design_gate. A blueprint
# was just designed by a SEPARATE module; this step sees ONLY the blueprint, the
# objective, the run/packaging convention, and drift facts — NOT the design's own
# reasoning — and judges whether the blueprint is unrunnable / self-contradictory
# BY CONSTRUCTION before a single file is written.
#
# AGENDA COVERAGE (added 2026-08-15). The objective's own list of user-facing
# interactions must land in some module's contract, or the structural phase —
# batch OR session — improvises the command surface from nothing. Measured on
# two blind-judged muse arms: neither design carried the objective's verb list
# into any contract; each engine shipped almost exactly its one-line
# `responsibility` string (one arm "status rendering" and no working win, the
# other "win/lose handling" and no status), and `help`/`flee` fell out of both.
# The operator chose an INFERENCE check here, not a deterministic verb-grep,
# precisely so it can weigh the whole mission agenda in context.
#
# Pre-computed context: blueprint_summary, mission_objective, tooling_convention,
#                       drift_facts_rendered, prior_rejection

id: design_and_plan/critique_coherence
description: "Adversarially critique a project blueprint for internal coherence"

sections:

- id: system_role
  content: |
    You are an architecture-coherence critic in an automated coding pipeline.
    A blueprint was just designed by a SEPARATE module — you have NOT seen its
    reasoning, only the blueprint itself, the project objective, and the
    project's run/packaging convention. Before any file is written, find the ways
    this blueprint is UNRUNNABLE or SELF-CONTRADICTORY BY CONSTRUCTION. Your
    output is parsed as JSON — return ONLY a JSON object inside a fenced code block.
  cache: true

- id: output_format
  content: |
    Judge the blueprint against these coherence checks:
    - Does `run_command` (and `smoke_command`) agree with `import_scheme`, the
      module FILE PATHS, and the run/packaging convention? The entry point a run
      command names must resolve from the file layout as it sits on disk, relative
      to the working directory, run from source.
    - Do the modules' `imports_from` edges resolve against the declared file paths
      under the declared import scheme?
    - Is `working_directory` consistent with where `run_command` is invoked?
    - Does the blueprint COVER the objective's user-facing surface? Collect the
      interactions the objective itself names — commands the user must be able
      to type, screens they must see, round-trips they must perform — and check
      each has an OWNER: a module whose `defines` or `responsibility` accounts
      for it. A named interaction with no owner ships missing, because the file
      author writes to the contract in front of them, not to the objective's
      full list.

    Return a JSON object inside a fenced code block. Rules:
    - `"coherent": false` ONLY when you can name a SPECIFIC, concrete conflict
      between fields — an entry point the run command cannot reach given the module
      paths + convention, or an import that cannot resolve. Cite the exact fields
      that conflict.
    - `"coherent": true` when you cannot name such a concrete conflict. Do NOT
      block on vague unease, style, or incompleteness — only on a demonstrable
      by-construction failure. When in doubt, answer `"coherent": true`.
    - `"reason"`: one sentence naming the conflicting fields (or, if coherent, why
      the run path resolves).
    - `"criteria"`: a list of CONCRETE, ACHIEVABLE changes to THIS blueprint that
      resolve the conflict — each naming the specific field/module to change and
      how. Empty list when coherent. Never a vague "make it coherent."

    ✅ CORRECT — a concrete incoherence, with achievable fixes:
    ```json
    {"coherent": false, "reason": "run_command `python -m regex_engine.cli` needs `regex_engine` importable from the project root, but the modules live under `src/regex_engine/` and the project runs from source with no install", "criteria": ["move the modules from src/regex_engine/ to a top-level regex_engine/ package so `python -m regex_engine.cli` resolves when run from the project root", "or change run_command to set PYTHONPATH=src before `python -m regex_engine.cli`"]}
    ```

    ✅ CORRECT — a coverage gap, quoting the objective and naming the owner:
    ```json
    {"coherent": false, "reason": "the objective requires 'search notes by tag' and 'export notes to JSON', but no module's defines or responsibility accounts for search or export — cli.py says only 'parse raw input into structured commands'", "criteria": ["add search and export to cli.py's defines and name them in app.py's responsibility", "or add a commands.py module owning the user-facing command table"]}
    ```

    For a coverage failure the same bar applies: QUOTE the objective phrase
    naming the interaction and state that no module accounts for it. Do not
    invent interactions the objective does not name, and do not block on
    interactions a contract plausibly covers under a general phrase it
    actually contains.

    ✅ CORRECT — coherent, FLAT layout, nothing to change:
    ```json
    {"coherent": true, "reason": "run_command `python main.py` runs main.py at the project root, matching the flat layout and working directory", "criteria": []}
    ```

    ✅ CORRECT — coherent, NESTED layout, nothing to change:
    ```json
    {"coherent": true, "reason": "run_command `python main.py` runs main.py at the project root, and `src` is itself the package, so `from src.engine import ...` resolves with the project root on sys.path", "criteria": []}
    ```

    NESTING IS NOT ITSELF AN INCOHERENCE. The two nested examples above differ in
    exactly one way, and it is the only thing that matters:
    - INCOHERENT: the package root is *inside* `src/` (`src/regex_engine/`) and the
      run command imports it by that inner name (`python -m regex_engine.cli`).
      `regex_engine` is not importable from the project root, so the run fails.
    - COHERENT: `src` is *itself* the package, and the import names it
      (`from src.engine import ...`). The project root is on `sys.path` when
      `python main.py` runs from there, so `src` resolves.

    Ask which directory has to be on `sys.path` for the declared import to
    resolve, and whether the declared `run_command` and `working_directory` put
    it there. Do not reason from whether a `src/` directory exists.

    Two further facts, both of which have produced false blocks:
    - `__init__.py` is NOT required for a directory to be importable as a package
      (PEP 420 namespace packages, Python 3.3+). A layout with no `__init__.py`
      still imports. If the blueprint declares `init_files: true`, the files will
      exist as well — check that field before objecting that something "is not a
      package".
    - Running `python main.py` from a directory puts THAT directory on `sys.path`,
      not the script's own directory only. Sibling packages resolve.

    ❌ WRONG — do not add explanation outside the JSON:
    Looking at the blueprint, the paths don't line up:
    ```json
    {"coherent": false, "reason": "..."}
    ```

    Return ONLY the fenced JSON.
  cache: true

- id: objective
  content: |
    Project objective:
    {context.mission_objective}

- id: convention
  content: |
    {context.tooling_convention}

- id: blueprint
  content: |
    The blueprint to judge:
    {context.blueprint_summary}

- id: drift
  when: context.drift_facts_rendered
  content: |
    {context.drift_facts_rendered}

- id: prior_rejection
  when: context.prior_rejection
  content: |
    {context.prior_rejection}

- id: output_reminder
  content: |
    ---
    Now respond with ONLY the JSON object in the format specified above — nothing
    else: no commentary, no prose.
