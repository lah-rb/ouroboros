# Prompt template: design_and_plan/design_architecture
#
# Designs or reconciles project architecture.
# Mode 1 (initial): No existing architecture — design from scratch.
# Mode 2 (reconcile): Existing architecture — compare with reality, update.
#
# Pre-computed context keys:
#   project_file_list — formatted project manifest
#   existing_architecture — formatted current architecture (empty if mode 1)

id: design_and_plan/design_architecture
description: "Design or reconcile project architecture"

sections:

- id: system_role
  content: |
    You are a software architect module in an automated coding pipeline.
    Your output will be parsed by a JSON extractor. Return ONLY a JSON
    object inside a fenced code block — no explanation, no surrounding text.

  cache: true
- id: instructions
  content: |
    ## Design a Project Architecture

    Produce a SINGLE authoritative blueprint that defines:

    1. **Execution Convention**: How to run the project. Specify:
       - The `run_command`: the **plain command a user types to run the
         program** (e.g., `python main.py`). For an interactive program it
         launches and WAITS for input — testers and verification probes type
         into it. Do NOT pipe input or wrap it to auto-exit.
       - The `smoke_command`: a **non-interactive startup check** that verifies
         the program launches, all imports resolve, and initial setup works,
         then exits cleanly within a few seconds. It MUST NOT block waiting
         for user input. For programs that read stdin (games, REPLs, CLI tools),
         pipe minimal input so the process exits, e.g., `echo "quit" | python main.py`
         or `printf "\\n" | python main.py`. For web servers or daemons, use a
         command that starts and immediately stops, e.g., `python -c "from app import create_app; create_app()"`.
       - The import scheme: flat (`from models import X`), package
         (`from src.models import X`), or relative (`from .models import X`)
       - Whether `__init__.py` files are needed
       - The assumed working directory
       This is CRITICAL — every file created after this follows these conventions.

    2. **Directory Layout**: Flat or nested? Which directories and why?
       If files already exist, the layout MUST be compatible with them.

    3. **Module Responsibilities**: For each file, specify what it defines,
       what it imports from other project modules, and its public API.

    4. **Interface Contracts**: For each cross-module dependency,
       specify caller, callee, symbol name, and expected signature.

    5. **Data Shapes**: For data files (YAML, JSON, config) that the program
       reads at startup, specify the structure the code expects. This prevents
       code-data mismatches that cause runtime crashes. Only include **input
       data** — files that exist before the program runs (world definitions,
       config). Runtime output files (save files) belong in State Contracts
       below, not here.
       Each data shape MUST include an `example`: a literal MINIMAL VALID
       INSTANCE of the file as a string — one element per list, EVERY key
       at EVERY nesting level, exactly as the loader will read them. The
       example IS the contract: the pipeline mechanically diffs the real
       file against it, so a nested key the example doesn't show (or names
       differently) is reported as a violation. Prose cannot pin down
       nesting; the example can. Convention: a mapping with ARBITRARY keys
       — e.g. a code->display-name map like `currencies: {USD: US Dollar}` —
       declares a key PATTERN, so show exactly ONE representative entry even
       when the real file has several, and do NOT enumerate the actual keys.
       Listing two sample keys makes the checker treat the map as a FIXED
       object and false-flag every key you didn't list. A fixed object (a
       struct with a known, fixed field set) shows ALL of its keys.
       **Data file LOCATION is part of the contract**: `file` is the EXACT
       path, relative to the working directory the program runs from, where
       the file will exist. Code must open it by exactly this path — a bare
       filename means "beside the entry point". Decide the layout HERE, once:
       if you want a subdirectory, declare it in `file` (e.g.
       `data/decks.yaml`); code that invents a directory the design never
       declared (a `data/` or `assets/` prefix) will fail its checks and the
       program will not find its files.

    6. **State Contracts**: Enumerate the COMPLETE mutable state of the
       running program — every field that changes during a run, whether one
       module touches it or many — plus the schema of any state the program
       persists (save files). For each, pick ONE canonical representation
       and state it exactly — e.g. does a collection hold id strings or
       full objects? Every module must conform to it.
       Include:
       - Shared mutable state: the type of each field, exactly
         (e.g. "Deck.cards: list of card_id strings — never Card objects").
       - Persisted state: the full schema of what gets written and
         restored (e.g. save JSON: every key and its value type). If the
         program mutates state a save is supposed to capture (items moved
         between containers, entities defeated, dialogue progressed), that
         state MUST appear in the persisted schema — state that lives only
         on loaded objects silently resets on every load.
       - **Transfer dicts**: EVERY dict one module builds and another
         consumes — a loader's return value handed to an engine or state
         constructor, a config bundle passed between layers. Name both
         sides (e.g. "load_decks() return / StudyEngine.__init__ input"),
         set `owner` to the producer file, and `structure` to the EXACT
         top-level key set. This is the seam where independently-written
         producer and consumer disagree on required keys ("missing key"
         crashes at startup) unless the keys are written down here.
       - **Every field has exactly ONE owner.** `owner` names the single
         module allowed to define and reset that state's canonical form,
         even when only one module uses it today — an unowned field is the
         one a later edit mutates from the wrong place. If you cannot name
         one owner for a field, the design is not finished.
       Without this, each file's author guesses independently and the
       mismatches surface as runtime crashes that are expensive to trace.

    7. **Creation Order**: Dependency-sorted. Files with no project imports
       come first. Entry points come last.

    8. **Infrastructure files**: Do NOT include boilerplate or tooling files
       in `modules` or `creation_order`. These are files that exist to satisfy
       language or framework conventions but contain no project logic — package
       markers (`__init__.py`), empty re-export barrels (`mod.rs`, `index.ts`),
       directory placeholders (`.gitkeep`), or framework scaffolding. The
       pipeline creates these automatically from the `init_files` flag and
       directory layout. Only list files that contain meaningful logic, data
       definitions, or application entry points.

  cache: true
- id: output_format
  content: |-
    ✅ CORRECT:
    ```json
    {
      "execution": {
        "run_command": "python main.py",
        "smoke_command": "echo quit | python main.py",
        "import_scheme": "flat",
        "init_files": false,
        "working_directory": "project root"
      },
      "modules": [
        {
          "file": "models.py",
          "responsibility": "Data classes for decks, cards, review paths",
          "defines": ["Deck", "Card", "Choice"],
          "imports_from": {}
        },
        {
          "file": "engine.py",
          "responsibility": "Review session loop and card scheduling",
          "defines": ["StudyEngine"],
          "imports_from": {"models": ["Deck", "Card", "Choice"]}
        }
      ],
      "interfaces": [
        {
          "caller": "engine.py",
          "callee": "parser.py",
          "symbol": "parse_command",
          "signature": "parse_command(raw: str) -> Command"
        }
      ],
      "data_shapes": [
        {
          "file": "decks.yaml",
          "consumed_by": "loader.py",
          "structure": "decks: list of {id: str, title: str, ...}",
          "example": "decks:\n  - id: basics\n    title: Basics\n    description: Starter deck.\n    tags:\n      level: intro\n    cards:\n      - id: card_1\n        prompt: What is X?\n        choices:\n          - text: A definition\n            next_id: card_2\n"
        }
      ],
      "state_shapes": [
        {
          "name": "Deck.cards",
          "owner": "models.py",
          "consumed_by": "engine.py, loader.py",
          "structure": "list of card_id strings — never Card objects"
        },
        {
          "name": "progress file JSON",
          "owner": "engine.py",
          "consumed_by": "engine.py",
          "structure": "{current_deck_id: str, completed: [card_id], scores: {deck_id: int}}"
        },
        {
          "name": "load_decks() return / StudyEngine.__init__ input",
          "owner": "loader.py",
          "consumed_by": "engine.py, main.py",
          "structure": "{decks: {deck_id: Deck}, cards: {card_id: Card}} — exactly these top-level keys, nothing else required"
        },
        {
          "name": "StudyEngine.session_streak",
          "owner": "engine.py",
          "consumed_by": "engine.py",
          "structure": "int, consecutive correct answers this session — single-owner runtime state, listed so its reset rule (0 on wrong answer, 0 on deck switch) has one home"
        }
      ],
      "creation_order": ["models.py", "parser.py", "engine.py", "main.py"],
      "notes": "Brief notes on design rationale"
    }
    ```

    ❌ WRONG — do not add explanation before or after:
    Based on the mission objective, here is the architecture:
    ```json
    {"execution": {"run_command": "..."}, ...}
    ```
    I chose a flat import scheme because...

    ✅ CORRECT — only real project files in modules and creation_order:
    ```json
    "modules": [
      {"file": "models.py", "responsibility": "Data classes", ...},
      {"file": "engine.py", "responsibility": "Session loop", ...}
    ],
    "creation_order": ["models.py", "engine.py", "main.py"]
    ```

    ❌ WRONG — do not include infrastructure/boilerplate files as modules:
    ```json
    "modules": [
      {"file": "__init__.py", "responsibility": "Package marker", "defines": [], ...}
    ],
    "creation_order": ["models.py", "engine.py", "main.py"]
    ```
    These are created automatically — listing them causes pipeline errors.

    Return ONLY the fenced JSON.
  cache: true
- id: objective
  content: |
    ## Mission Objective
    {context.mission_objective}

- id: existing_architecture
  when: context.existing_architecture
  content: |
    ## Current Architecture (may need revision)
    {context.existing_architecture}

    Compare this blueprint against the actual files below. Identify any
    drift — files that don't match the blueprint, interfaces that have
    diverged, data shapes that don't agree. Produce an UPDATED architecture
    that reconciles the blueprint with reality.

# Only ever non-empty on a RECONCILE attempt: the coherence gate publishes
# its verdict here, and `ground_design_gate_verdict` clears it to "" on a
# pass, so design_initial never renders this section.
# IT WAS PUBLISHED AND READ BY NOTHING until 2026-08-05 — the gate would
# name a specific, actionable defect ("run_command `python main.py` is at
# the root, but `main.py` imports `engine`, which is at `src/engine.py`")
# and then hand the model a reconcile prompt that never mentioned it. Every
# reconcile attempt was blind, so a model could burn its whole attempt
# budget re-emitting the same defect and DNF at the design gate. Found on
# gemma-4-26b-a4b (tier_20260805-001206, 3/3 attempts, same complaint).
- id: gate_feedback
  when: context.design_gate_feedback
  content: |
    ## Coherence Defect Found In Your Previous Blueprint
    {context.design_gate_feedback}

    This is the SPECIFIC reason the previous blueprint was rejected. Fix
    THIS defect. Do not restate the same structure and expect a different
    verdict — if the run command and the import paths disagree, change one
    of them so they agree.

- id: repo_map
  when: context.repo_map_formatted
  content: |
    ## Existing Code Structure (AST-based)
    {context.repo_map_formatted}

- id: existing_files
  when: context.project_file_list
  content: |
    ## Existing Files
    {context.project_file_list}

- id: output_reminder
  content: |
    ---
    Now return ONLY the single fenced JSON blueprint defined under OUTPUT FORMAT
    above — the architecture object itself. Do NOT write files, `# File:` blocks,
    code, prose, or commands; the build steps that follow consume this blueprint.

