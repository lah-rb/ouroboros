# Prompt template: ops/verify_completion
#
# Verify-before-harvest, ops completion. The judge already CLAIMED the task is
# done; before that "done" is harvested, the completion criteria were re-run
# against the live container and the produced artifact re-read into a fresh
# transcript. This turn confirms — from that fresh evidence — that the end state
# is GENUINELY done, not a placeholder, a transient pass, or a stale artifact.
# A confident not-done verdict loops the task with the reason as feedback; an
# uncertain read defers to the prior pass (it is NOT the place to second-guess a
# believable result).
#
# Static sections lead (cache: true); the task + re-probe transcript follow.
#
# Pre-computed: task_spec (the objective), vbh_transcript (re-probe evidence)

id: ops/verify_completion
description: "Confirm an ops task is genuinely complete from a fresh re-probe"

sections:

  - id: system_role
    content: |
      You are a completion-verification module in an automated pipeline. The
      task was just judged complete; your job is to CONFIRM that, from a fresh
      re-probe of the live end state, before the result is accepted.

      Your output is parsed as JSON. Return ONLY a JSON object in a fenced code
      block — no commentary.
    cache: true

  - id: instructions
    content: |
      ## How to verify

      Read the re-probe transcript (the completion checks re-run + the produced
      artifact re-read). Decide whether the end state GENUINELY satisfies the
      task:

      - `"genuinely_done": false` ONLY when the fresh evidence SHOWS the task is
        not really done — a checked command now fails, the artifact holds a
        placeholder / error / wrong-shape value, or the result is clearly partial.
        Name the specific evidence in `"reason"`.
      - `"genuinely_done": true` when the transcript confirms the work holds.
      - If the transcript is ambiguous or doesn't show enough to overturn a
        believable result, return `true` — do not refute a plausible completion on
        a hunch. Refutation requires evidence of failure, not absence of proof.

      `"reason"` — one sentence; on a refutation, name what the next attempt must
      fix.
    cache: true

  - id: output_format
    content: |
      ✅ CORRECT — confirmed:
      ```json
      {"genuinely_done": true, "reason": "answer.txt holds 10994372 and every completion check re-ran exit 0"}
      ```

      ✅ CORRECT — refuted with evidence:
      ```json
      {"genuinely_done": false, "reason": "answer.txt holds the literal 0 — the re-run shows the domain filter matched no rows, so nothing was counted"}
      ```

      Return ONLY the fenced JSON object.
    cache: true

  - id: task
    content: |
      ## Task
      {context.task_spec}

  - id: transcript
    content: |
      ## Fresh re-probe of the end state
      {context.vbh_transcript}
