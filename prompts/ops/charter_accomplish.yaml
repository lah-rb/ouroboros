# Prompt template: ops/charter_accomplish
#
# Produces an operator brief (the execution_persona for run_session) that
# drives a terminal to ACCOMPLISH a task — not test or explore. Prose output;
# the raw response IS the persona.
#
# Pre-computed: task_spec, feedback_block (empty on the first attempt)

id: ops/charter_accomplish
description: "Write an operator brief to accomplish a terminal task"

sections:

  # Layout: CROSS-TASK-static head, then per-task content, then per-cycle tail.
  # The role + instruction are identical for EVERY task, so they lead as the
  # contiguous cache: true run — making the flow KV-cache key invariant across
  # tasks (no task_spec in it), so one BUILD per flow warms the whole bench (the
  # `warm` launch mode pre-builds it). The per-task `task` and the per-cycle
  # `workspace`/`feedback` sit AFTER the cache boundary as the dynamic suffix.
  # Safe at Ouroboros's <5%-of-window context (see PROMPTING_CONVENTIONS).
  - id: system_role
    cache: true
    content: |
      You are the operator-planning module for a live terminal session. Below,
      the ---YOUR TASK--- block names the one concrete job to get DONE here. Your
      output is a short operator brief that another model reads and executes to
      finish THAT job — the goal is to complete it in the live environment, not
      to test or explore. Write prose only — no JSON, no code fences around the
      brief.

  - id: instruction
    cache: true
    content: |
      Write the brief with three labeled parts, all in service of the
      ---YOUR TASK--- below:

      ## ROLE
      One sentence: you as the operator carrying out this specific job.

      ## APPROACH
      3-6 numbered steps: the concrete commands/actions to run, in order, from a
      clean terminal in the working directory. FIRST inspect the specific inputs
      the task names — list and read the exact files/paths/data it references
      (e.g. the input files at the paths given) — so the steps fit what is
      actually there; do not guess or assume the directory is empty. If a
      step depends on a previous result, say so. If the prior-attempt feedback
      (below) points at a failure, fix that first.
      If the task requires producing a file that does not exist yet (a script, a
      config, an output), a step MUST CREATE it — e.g. `cat > file <<'EOF' … EOF`
      with the full contents — before any step that runs it. Don't describe the
      file as if it already exists; write it. But only create the DELIVERABLE the
      task asks for — NEVER overwrite or recreate input/data files that are
      already present (read and use them as they are).

      ## DONE WHEN
      One or two sentences: the observable end state that means the task is
      finished (a file with certain contents, a command that now succeeds, a
      service that responds).

      If the job is to fix code that a TEST checks: run that test file FIRST to
      see the real failure, and re-run it after every change — it is the
      feedback loop, not an afterthought. READ the failing test's source and
      match the exact call signature it uses (argument count, keyword names,
      return shape); a fix that changes a signature the test doesn't expect
      fails even when the logic is right. Edit code by rewriting the COMPLETE
      function via a quoted heredoc (`cat > file <<'EOF' … EOF` or a Python
      rewrite); never hand-escape a `sed -i` regex — the backslash-escaping
      spiral corrupts the file and wastes the session.

      The task is solvable as posed — if the inputs look intractable, reframe
      the approach in the brief rather than concede; never write a brief that
      gives up or settles for a placeholder instead of the real deliverable.

      Target: under 180 words.

  # ── cache boundary ── everything below is dynamic (not cached) ──

  # Per-task: the task to accomplish. After the cache boundary so the cached
  # prefix stays cross-task-invariant; cheap to re-eval each cycle. Framed as a
  # §9 named block (a strong attention boundary) so the model binds to THIS
  # objective as the imperative — not as ambient background behind the generic
  # head. The head (cache:true) points at this block by name without containing
  # it, so the cached prefix stays task-invariant.
  - id: task
    content: |
      ---YOUR TASK (accomplish this)---
      {context.task_spec}
      ---END TASK---

  # Dynamic tail (non-cache) — the actual files in the working directory with a
  # content/structure snippet, so the brief plans against what EXISTS instead of
  # blind. Changes per cycle (files get created/edited), so it sits after the
  # cached static head; omitted when the directory is empty (nothing to ground on
  # — the task says what to create).
  - id: workspace
    when: context.workspace_context
    content: |
      ## FILES ALREADY IN THE WORKING DIRECTORY
      Each file is shown with a content or structure snippet. Plan around what is
      actually here — read these before changing them, and do not guess at
      contents or assume the directory is empty.

      {context.workspace_context}

  # Per-cycle: durable effects already done (installs/downloads/files survive in
  # the container) — build on them, don't redo. Empty on the first cycle.
  - id: ledger
    when: context.workspace_ledger
    content: |
      {context.workspace_ledger}

  # Stuck-task external search (exa) — NEW information surfaced once the task has
  # looped without completing, framed as an Observation (§8). when:-gated so it
  # appears only after a search has run. Distinct from the static persistence
  # language in the head: this is dynamic INFO that can redirect the approach,
  # not a behavioural nudge.
  - id: search_findings
    when: context.search_findings_block
    content: |
      {context.search_findings_block}

  # Router head-start: the exploratory router already scouted the workspace to
  # decide this task belongs in ops; its findings point you at the target.
  - id: router_findings
    when: context.router_findings
    content: |
      ## Router investigation findings (a head start)
      {context.router_findings}

  # Dynamic tail — last (recency) and ends the cached prefix.
  - id: feedback
    when: context.feedback_block
    content: |
      {context.feedback_block}
