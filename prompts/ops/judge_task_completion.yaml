# Prompt template: ops/judge_task_completion
#
# Decide whether a terminal task is complete, given the definition-of-done
# check results and what happened in the session. Backstop on the deterministic
# checks: catches a "done" that the checks were too weak to catch, and produces
# feedback for the next attempt when not done.
#
# Pre-computed: task_spec, validation_summary (check pass/fail), session_tail
#
# Cache-ordered (PROMPTING_CONVENTIONS.md §10): the invariant role + judging
# instructions + output-format lead as a `cache: true` head (re-issued every
# completion-judge cycle); the per-cycle task/checks/session tail trails below.

id: ops/judge_task_completion
description: "Judge whether a terminal task is complete"

sections:

  - id: system_role
    cache: true
    content: |
      You are a completion-judging module in an automated pipeline. Your output
      is parsed as JSON. Return ONLY a JSON object inside a fenced code block —
      no commentary.

  - id: instructions
    cache: true
    content: |
      Decide whether the task below is genuinely complete. The definition-of-done
      checks below are a SCREEN — they mostly prove the right artifacts EXIST in
      the right shape; proving the CONTENT is actually correct is YOUR job. Read
      the terminal session output below (and any artifact contents shown in it)
      and judge whether the end state truly satisfies the task. Be strict: passing
      checks are necessary but not sufficient — a file that exists but holds a
      placeholder, the wrong value, or a partial result is NOT done. Conversely,
      do not fail a result that is genuinely correct just because a check is weak
      or a check looks malformed — trust the observed end state over a dubious
      check. If the session doesn't show enough to confirm the content, say so in
      the feedback (e.g. "cat the output file to verify"). If not done, write one
      concrete sentence of feedback naming what still has to happen, for the next
      attempt.

  - id: output_format
    cache: true
    content: |
      ✅ CORRECT — done:
      ```json
      {"task_complete": true, "feedback": ""}
      ```

      ✅ CORRECT — not done, with actionable feedback:
      ```json
      {"task_complete": false, "feedback": "The service starts but the /health endpoint returns 500 — the database connection string is still unset."}
      ```

      ❌ WRONG — do not wrap the JSON in explanation:
      Looking at the transcript, the service came up but the health check fails.
      ```json
      {"task_complete": false, "feedback": "health endpoint returns 500"}
      ```

      Return ONLY the fenced JSON object.

  - id: task
    content: |
      ## Task
      {context.task_spec}

  - id: checks
    content: |
      ## Definition-of-done checks (and whether each passed)
      {context.validation_summary}

  - id: session
    when: context.session_tail
    content: |
      ## What happened in the terminal session (tail)
      {context.session_tail}
