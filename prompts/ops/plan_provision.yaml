# Prompt template: ops/plan_provision
#
# Plan the environment SETUP for a terminal task: the shell commands that
# install the tools/packages the task needs, so the work session runs in a
# ready environment (the session itself only runs and observes — it does not
# install). Output is parsed as the {"setup_actions": [...]} plan that
# execute_project_setup runs (each command goes through run_command, which the
# ops adapter routes into the task's container).
#
# Pre-computed: task_spec, feedback_block (the prior judge note, empty first run)

id: ops/plan_provision
description: "Plan install/setup commands to provision the env for a terminal task"

sections:

  - id: system_role
    content: |
      You are an environment-provisioning module in an automated pipeline. Your
      output is parsed as JSON. Return ONLY a JSON object inside a fenced code
      block — no commentary.

  - id: task
    content: |
      ## Task to be accomplished
      {context.task_spec}

  - id: feedback
    when: context.feedback_block
    content: |
      {context.feedback_block}

  - id: instructions
    content: |
      List the shell commands needed to PROVISION the environment for this task
      — installing the tools, packages, or runtimes it requires that may not be
      present. This is setup ONLY: do not solve the task, do not create the
      deliverable, do not run the tool — just make it available.

      Rules:
      - Plan the SMALLEST set of commands necessary. If the environment already
        has what's needed (common tools, or packages a prior step installed),
        return an empty list.
      - If the prior-attempt feedback names a missing tool/package, install it.
      - ONE command per action — do NOT chain with `&&`, `|`, or `;` (each
        command runs as argv, not through a shell).
      - For Python packages use `python3 -m pip install --break-system-packages
        <pkg>` (PEP-668 environments reject a bare `pip install`).
      - Assume the command runs in the working directory.

  - id: output_format
    content: |
      Return a JSON object with a "setup_actions" array. The example is from an
      UNRELATED task — it shows the SHAPE only; write actions for the real task
      (or an empty array if nothing is needed).

      ```json
      {
        "setup_actions": [
          {"type": "command", "command": ["python3", "-m", "pip", "install", "--break-system-packages", "requests"], "name": "install requests"}
        ]
      }
      ```

      Each action: `type` is "command", `command` is an argv array, `name` is a
      short label. Return ONLY the fenced JSON object.
