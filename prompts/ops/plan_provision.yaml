# Prompt template: ops/plan_provision
#
# Plan the environment SETUP for a terminal task: the shell commands that
# install the tools/packages the task needs, so the work session runs in a
# ready environment (the session itself only runs and observes — it does not
# install). Output is parsed as the {"setup_actions": [...]} plan that
# execute_project_setup runs (each command goes through run_command, which the
# ops adapter routes into the task's container).
#
# Pre-computed: task_spec, feedback_block (the prior judge note, empty first run)

id: ops/plan_provision
description: "Plan install/setup commands to provision the env for a terminal task"

sections:

  # Layout: CROSS-TASK-static head, then per-task content, then per-cycle tail.
  # The role + instructions + output_format are identical for EVERY task, so they
  # lead as the contiguous cache: true run — that makes the flow KV-cache key
  # invariant across tasks (it doesn't include task_spec), so one BUILD per flow
  # warms the whole bench (the `warm` launch mode pre-builds them; every task then
  # HITs). The per-task `task` and per-cycle `feedback` sit AFTER the cache
  # boundary as the dynamic suffix (cheap to re-eval; small). Safe at Ouroboros's
  # <5%-of-window context (see PROMPTING_CONVENTIONS).
  - id: system_role
    cache: true
    content: |
      You are an environment-provisioning module in an automated pipeline. Your
      output is parsed as JSON. Return ONLY a JSON object inside a fenced code
      block — no commentary.

  - id: instructions
    cache: true
    content: |
      List the shell commands needed to PROVISION the environment for the task
      below — installing the tools, packages, or runtimes it requires that may not
      be present. This is setup ONLY: do not solve the task, do not create the
      deliverable, do not run the tool — just make it available.

      Rules:
      - Plan the SMALLEST set of commands necessary. If the environment already
        has what's needed (common tools, or packages a prior step installed),
        return an empty list.
      - If the prior-attempt feedback (below) names a missing tool/package, install it.
      - ONE command per action — do NOT chain with `&&`, `|`, or `;` (each
        command runs as argv, not through a shell).
      - For Python packages use `python3 -m pip install --break-system-packages
        <pkg>` (PEP-668 environments reject a bare `pip install`).
      - Assume the command runs in the working directory.

  - id: output_format
    cache: true
    content: |
      Return a JSON object with a "setup_actions" array. The example is from an
      UNRELATED task — it shows the SHAPE only; write actions for the real task
      (or an empty array if nothing is needed).

      ✅ CORRECT:
      ```json
      {
        "setup_actions": [
          {"type": "command", "command": ["python3", "-m", "pip", "install", "--break-system-packages", "requests"], "name": "install requests"}
        ]
      }
      ```

      Each action: `type` is "command", `command` is an argv array, `name` is a
      short label.

      ❌ WRONG — do not explain the plan around the JSON:
      The task needs the requests library, so:
      ```json
      {"setup_actions": [{"type": "command", "command": ["pip", "install", "requests"], "name": "install requests"}]}
      ```

      Return ONLY the fenced JSON object.

  # ── cache boundary ── everything below is dynamic (not cached) ──

  # Per-task: the task spec. After the cache boundary so the cached prefix stays
  # cross-task-invariant; cheap to re-eval each cycle.
  - id: task
    content: |
      ## Task to be accomplished
      {context.task_spec}

  # Per-cycle: durable effects already done (installs/downloads survive in the
  # container) — don't re-provision them. Empty on the first cycle.
  - id: ledger
    when: context.workspace_ledger
    content: |
      {context.workspace_ledger}

  # Per-cycle: the prior judge note (empty first run) — last (recency slot).
  - id: feedback
    when: context.feedback_block
    content: |
      {context.feedback_block}

  - id: output_reminder
    content: |
      ---
      Now respond with ONLY the output in the format specified above — nothing
      else: no commentary, no files, no extra prose.
