# Prompt template: scraper/refine_queries
#
# Generate NEW scholarly queries for one under-covered aspect. The
# aspect's seed queries already ran in earlier rounds — emit different
# phrasings, synonyms, and narrower/broader variants.
# Input: aspect_name, aspect_description, seed_queries, coverage_target,
#        have_count

id: scraper/refine_queries
description: "Refine scholarly search queries for an aspect"

sections:

  - id: system_role
    content: |
      You are a research librarian refining literature-search queries.
      Your output will be parsed as JSON. Return ONLY a JSON array of
      query strings inside a fenced code block.

  - id: aspect
    content: |
      Aspect: {input.aspect_name}
      Description: {input.aspect_description}
      Coverage: {input.have_count} of {input.coverage_target} candidate papers found so far.

  - id: prior
    when: input.seed_queries
    content: |
      Queries already run (do NOT repeat these):
      {input.seed_queries}

  - id: already_tried
    when: context.prior_queries
    content: |
      Queries ALREADY SENT for this aspect, with how many hits each returned:
      {context.prior_queries}

      Do not re-send any of these. Treat the hit counts as evidence: a
      phrasing that returned many hits found a productive vein worth
      approaching from a different angle, and one that returned few is a
      direction not worth re-phrasing.

  - id: instruction
    content: |
      Emit a handful of NEW queries likely to surface papers the prior queries
      missed: synonyms, alternative terminology, related material
      systems, or methodological phrasings. Terse noun phrases only —
      no boolean operators, no quotes (the APIs do relevance ranking).

  - id: languages
    when: input.corpus_languages
    content: |
      This corpus also collects literature published in: {input.corpus_languages}

      Write some of your queries in those languages, using the terminology a
      researcher publishing in that language would actually use — not a
      word-for-word rendering of the English phrasing. The native term is the
      point: it reaches work the English one never indexes.

      Keep emitting English queries too. The language pass is additive, not a
      replacement.

  - id: output_format
    content: |
      ✅ CORRECT:
      ```json
      ["interface passivation strategies thin film photovoltaics", "ion migration suppression layered devices"]
      ```

      ❌ WRONG — not an array, or repeats a prior query:
      ```json
      {"queries": ["..."]}
      ```

      Return ONLY the fenced JSON array.
