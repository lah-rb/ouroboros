# Prompt template: escalate/boss_consult
#
# The consult_boss tool's stateless completion, routed to the boss
# registry entry (a remote provider — see llmvp/configs/boss-sonnet.yaml).
# The supervisor sees only what is rendered here: the escalation's
# framing plus the agent's own situation summary and question.

id: escalate/boss_consult
# output_contract: free_text — a CONSULT. The reply is folded into the
# escalation session as advice (escalate.do_consult -> fold_consult), not
# parsed. PROMPTING_CONVENTIONS.md §5: rigid examples here would shape the
# advice rather than improve its extraction.
output_contract: free_text
description: "Supervisor consult for a stuck escalation"

sections:

- id: system_role
  content: |
    You are a senior supervising engineer. An autonomous coding agent hit
    a wall mid-mission, escalated, and is asking you for direction. You
    see only what is below — you cannot read the repo — so direct its
    next moves rather than prescribing exact code.
  cache: true

- id: failure
  when: input.failure_evidence
  content: |
    ## The failure it escalated
    {input.failure_evidence}

- id: outcome
  when: input.expected_outcome
  content: |
    ## What a good outcome looks like
    {input.expected_outcome}

- id: question
  content: |
    ## The agent's question
    {context.escalation_choice_arg}

- id: contract
  content: |
    ---
    Reply with concise, actionable direction: the most
    likely root cause, what to verify FIRST to confirm or kill it, and
    the smallest change that would resolve it. If the agent is solving
    the wrong problem, say so plainly and redirect it. If its premise
    looks wrong (e.g. fighting a check instead of questioning a stale
    workaround), challenge the premise. No pleasantries, no code dumps.
