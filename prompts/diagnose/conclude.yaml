id: diagnose/conclude
content: |
  Based on the evidence gathered, produce the diagnosis.

  Return a JSON object inside a fenced code block with these fields:

    target_file — the file the change targets. Set this even if the file doesn't exist yet; file_ops will route to the create flow automatically when the path isn't on disk. Must be a real file in this project or a real new-file path — never a placeholder or unknown, and never blank. If the fix spans several files, name the file holding the primary symbol here and put the rest in related_symbols.

    target_symbol — function / method / class to modify or add. Use the qualified name for methods (e.g. `ClassName.method`). Omit only for whole-file operations (new data files, new config files).

    related_symbols — array of other symbols that must change alongside ``target_symbol`` to keep the contract consistent. Each entry is a qualified name. Use one of two forms:
      - File-qualified (preferred): `path/to/file.py:ClassName.method`. Always use this when the symbol lives in a different file from ``target_file`` — and prefer it generally so file_ops can locate it unambiguously.
      - Bare: `ClassName.method` or `function_name` — interpreted as a symbol in ``target_file``. Use this only when the symbol definitely lives in ``target_file``.
    Common cases: consumers of a method whose signature you're changing, callers of a renamed function, other methods that read the same attribute you're about to remove or rename, the upstream producer of a value the receiver is reporting as wrong-shaped. Leave as an empty array `[]` when the change is genuinely local to ``target_symbol``. List at most 6 symbols — if more would need to change, the refactor is too large to land in one patch and should be broken down.

    root_cause — why the test failed. Name the specific bug, missing feature, or contract mismatch in one or two sentences.

    change_spec — what needs to be true after the change. Concrete enough that the next step can write the fix directly. When ``related_symbols`` is non-empty, also describe the cross-symbol contract: what attribute name, signature, or return shape all the listed symbols will share after the change.

    expected_error — leave EMPTY in almost every case. Set it ONLY when the fix's success is that some input the code CURRENTLY accepts must instead be REJECTED by raising an exception (input validation, a guard clause). Then name that exception type exactly — e.g. `ValueError`, `TypeError`. The retest treats that exception appearing in the output as the PASS signal instead of a crash. If the fix makes code STOP raising, or is any other kind of change, leave this empty.

    kind — one of: `fix` (existing behavior is incorrect — wrong output, crash, exception, broken contract between symbols), `enhancement` (a feature the user expected is missing — a command verb the parser doesn't recognize, no orientation text where users expect one, no handler for input that should respond, missing field on a model class), `new_file` (a whole file needs to exist that currently doesn't), `module_fix` (a module-level line is missing or wrong in ``target_file`` — a missing import, a script's shebang, a `source`/`set` line; a name it uses is never imported, or the script lacks its interpreter line). Prefer `module_fix` over `fix` whenever the change is adding or correcting a module-level line such as an import. A module_fix may ALSO need a function or method body to change (e.g. an assignment inside `__init__` that pairs with the new module line): keep kind `module_fix`, name that symbol in ``target_symbol``, and describe the body change in ``change_spec`` — both edits are applied, module line first.

    module_statement — REQUIRED when kind is `module_fix`; omit otherwise. The exact literal line(s) to insert, exactly as they should appear in the file. Executable code only — never comments, instructions, or guidance (they would be inserted into the file verbatim). Any accompanying body change or explanation belongs in ``change_spec``, not here.
      ✅ "module_statement": "from commands import InventoryCommand"
      ✅ "module_statement": "#!/usr/bin/env bash"
      ❌ "module_statement": "add an import for InventoryCommand at the top"
      ❌ "module_statement": "ITEMS = {}\n# then assign ITEMS inside __init__" (guidance smuggled as comments — put it in change_spec)

    confidence — one of: `HIGH`, `MEDIUM`, `LOW`.

    recommended_flow — `file_ops` for code or data file changes (covers create, patch, add, rewrite internally); `project_ops` for environment or dependency fixes only (missing package, Python path, build tooling); `retest` for the narrow verdict described under ``test_guidance`` — the code is already correct and the test session simply never reached the behavior. Do NOT pick project_ops as a fallback when you're unsure — if you can't identify a target, pick file_ops with your best-evidence guess at target_file.

    test_guidance — REQUIRED when recommended_flow is `retest`; omit otherwise. `retest` is a high-bar verdict: it asserts the code is CORRECT and the failure is in how the previous session tested it. Choose it ONLY when BOTH hold:
      1. The symbols you traced already implement the required behavior correctly — you can point at the exact code path that produces the expected outcome.
      2. The session transcript shows that path was never exercised — the triggering action was never performed, was performed too few times, or was performed in the wrong place (e.g. the goal needs a monster defeated, the code marks defeat correctly after enough strikes, and the transcript shows the tester struck twice then wandered off).
    If ANY code or data change would genuinely improve the program — a missing command, missing feedback the tester needed to see progress, a wrong value, a crash — that is a `fix` or `enhancement`, NOT a retest. In particular, NEVER recommend changing the program to make it easier to test (lowering an enemy's health, shortening a route, skipping a requirement): the change stays in the program after the test passes, and a test that passes against modified behavior proves nothing about the real code. If the behavior is genuinely unreachable in a short session, that reachability is itself the bug — diagnose it.
    When retest applies, write ``test_guidance`` as short numbered steps the next tester can follow, using ONLY commands that exist in the program, with exact counts and locations computed from the code and data you traced — e.g. "1. go east  2. go east  3. go north  4. attack guard — repeat until it dies (25 HP at 10 damage = 3 attacks)  5. check status to confirm the defeat is recorded". For retest, still set target_file/target_symbol to the code you verified correct (nothing will be edited — this anchors the evidence), set kind to `fix`, and put your correctness argument in ``root_cause``.

  Shape reference — example values illustrate format and field shape only. They are NOT symbols in this project; produce real values for your diagnosis.

  ```json
  {
    "target_file": "src/handler.py",
    "target_symbol": "RequestHandler.dispatch",
    "related_symbols": ["src/router.py:Router.resolve", "make_envelope"],
    "root_cause": "Dispatch reads handler.route_table by attribute but Router.resolve writes routes as a dict keyed by name.",
    "change_spec": "Make RequestHandler.dispatch accept the dict shape Router.resolve produces, or change Router.resolve to expose a flat attribute. Pick whichever side has fewer callers.",
    "expected_error": "",
    "kind": "fix",
    "confidence": "HIGH",
    "recommended_flow": "file_ops"
  }
  ```
