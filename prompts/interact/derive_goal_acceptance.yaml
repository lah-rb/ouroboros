# Prompt template: interact/derive_goal_acceptance
#
# Per-goal grounded acceptance checks (ops definition-of-done port). Derived
# ONCE per functional/quality goal, right after the goal's first genuine PASS,
# grounded in that passing session's transcript. Each candidate is executed
# immediately against the just-passed state and DROPPED unless it already
# exits 0, so a malformed or mis-grounded check can never be armed. The stored
# check is a REGRESSION GUARD re-run on every later verification: a required
# failure vetoes a credulous goal_met; passing checks never certify the goal
# on their own.
#
# Pre-computed: session_tail.  Inputs: flow_directive (the goal directive).

id: interact/derive_goal_acceptance
description: "Derive per-goal acceptance checks grounded in the explored session"

sections:

  - id: system_role
    content: |
      You define ACCEPTANCE CHECKS for the goal in the ---GOAL--- block —
      shell checks that confirm its observable end-state, informed by the live
      session below. These are shell CHECKS (a "checks" array), NOT a command
      to run — never emit an action like {"action": ...}. Your output is
      parsed as JSON. Return ONLY a JSON object inside a fenced code block —
      no commentary.

  - id: goal
    content: |
      ---GOAL---
      {input.flow_directive}
      ---END GOAL---

  - id: exploration
    content: |
      ---WHAT THE SESSION HAS SHOWN (the live program's actual behavior)---
      {context.session_tail}
      ---END SESSION---

  - id: instructions
    content: |
      Produce checks that inspect OBSERVABLE END-STATE (files exist and are
      non-empty, an artifact the goal produces, an exit code, a port probe) —
      NOT the steps taken. Each check exits 0 iff a required condition holds.
      Prefer the smallest set of necessary, independent conditions (0-3), run
      in the working directory with standard tools.

      These checks are a SCREEN layered under a separate behavioral evaluator
      that judges the session itself — you do NOT have to prove the behavior
      correct, only pin the durable artifacts/state the goal requires. Seven
      rules keep the screen safe (a failing check VETOES an otherwise-passing
      evaluation, so a wrong check is the only way to harm a correct result):

      1. ROBUST PREDICATES ONLY: `test -f path`, `test -s path`,
         `test -x path`, an exit code, a port probe, or
         `grep -qF '<exact text>' path` ONLY to confirm content the program
         PRODUCES (an output/data/config file the goal says it writes), and
         only when the goal STATES that literal.
      2. NEVER RE-DERIVE THE PROGRAM'S OWN WORK inside a check and compare —
         a slightly-wrong re-derivation fails a correct result forever.
      3. A CHECK MUST BE ABLE TO FAIL IF THE GOAL IS UNMET. Never write a
         check that is true the moment the edit is made — it proves nothing.
         In particular, do NOT grep a SOURCE file for code you are adding or
         changing (e.g. `grep '.is_negative' module.py` after editing that
         module): the string is present by construction whether or not it
         works. If a check would still pass against a broken-but-present
         implementation, it is vacuous — drop it. Prefer a check that
         EXERCISES the behavior (run the code path / invoke the CLI and assert
         an observable outcome the bug would violate) over one that inspects
         the source.
      4. WHEN THE GOAL IS TO FIX A BEHAVIOR, TEST THAT SPECIFIC BEHAVIOR — not a
         generic health signal. Reproduce the exact case the goal describes and
         assert the corrected outcome; the check must FAIL on the unfixed code.
         A signal that stays green regardless of the fix — "it builds", "it
         imports", "the config validates", "an output file exists" — certifies
         nothing, and worse can pull the work toward satisfying the SIGNAL
         instead of fixing the bug (a `test -f out_html/index.html` check led an
         agent to build the whole docs tree rather than fix the code; `django
         check` passes on any valid project). This is the flip side of rule 1:
         `test -s <file>` is right when the goal's END STATE *is* that file,
         wrong when the goal is to change how code behaves — then run the code.
         ✅ goal "simplify(cos(x)**I) must not raise":
            {"command": "python -c \"from sympy import *; x=symbols('x'); simplify(cos(x)**I)\"", "description": "the reported input no longer raises (nonzero exit on the bug)"}
         ❌ generic health, green on a non-fix (and invites side-effects):
            {"command": "python -m sphinx -b html doc _build && test -f _build/index.html", "description": "docs build"}
      5. EXERCISE THE CODE UNDER REPAIR HONESTLY — public API, the way the
         bug report calls it, DEFAULT semantics, self-contained. A check that
         sidesteps or simulates the repaired path launders a broken fix into
         "complete". Before emitting a check, ask the counterfactual: WOULD
         THIS CHECK FAIL IF THE FIX WERE REVERTED? If not, it is rigged —
         drop it. Rigging patterns to never use:
         - a flag that skips the path under test (`check=False`,
           `verify=False`, `--no-validate` — when the bug lives in the
           skipped validation, the check passes on broken code);
         - monkeypatching or shadowing the code under test inside the check
           (patching `__new__` then asserting isinstance tests the patch,
           not the fix);
         - swallowing the outcome (`|| true`, `; exit 0` — the check
           literally cannot fail);
         - reaching the network (checks run hermetically; a connectivity
           error is indistinguishable from the bug).
         ✅ exercises the reported call with default validation ON:
            {"command": "python -c \"from sympy.combinatorics import DihedralGroup; from sympy.combinatorics.homomorphisms import homomorphism; D=DihedralGroup(3); homomorphism(D,D,D.generators,D.generators)\"", "description": "the reported homomorphism constructs (validation on; fails on the bug)"}
         ❌ same call rigged with check=False — skips the validation the bug
            lives in, so it passes whether or not the fix works:
            {"command": "python -c \"... homomorphism(D,D,D.generators,D.generators,check=False)\"", "description": "constructs"}
      6. EMIT ONLY SYNTACTICALLY-VALID, SELF-CONTAINED COMMANDS. Every check
         runs as `/bin/sh -c '<command>'`; a command that ERRORS — an
         unbalanced paren or quote in a `python -c`, a missing bracket, an
         uninstalled binary, an unset variable — exits non-zero and is scored
         EXACTLY like a failed assertion. A malformed check therefore vetoes a
         correct result, so a broken check is strictly worse than no check.
         Before emitting, mentally execute it: every paren/quote/bracket
         balanced, every referenced file and binary present in the working
         directory, no `<...>` placeholder left in. If you are not certain it
         parses and runs cleanly, drop it — {"checks": []} beats a check that
         cannot execute.
         ✅ balanced, self-contained:
            {"command": "python -c \"import json,sys; d=json.load(open('save.json')); sys.exit(0 if 'room' in d else 1)\"", "description": "the save file records the player's room"}
         ❌ unbalanced paren — SyntaxErrors, so it fails forever:
            {"command": "python -c \"import sys; sys.exit(0 if open('save.json').read() else 1\"", "description": "save exists"}
      7. GROUND EVERY OUTPUT ASSERTION IN THE SESSION BLOCK ABOVE, VERBATIM.
         When a check greps for or matches program output, copy the string
         EXACTLY as it appears in ---WHAT THE SESSION HAS SHOWN--- — same
         words, case, and punctuation. NEVER guess or paraphrase what the
         program "should" print: a `grep -qF 'You take the Book'` for wording
         the program never emitted fails forever and vetoes a correct result.
         If the exact text is not visible in the session block, do not assert
         on it — use a structural predicate (a file, an exit code) or drop the
         check.

      Most purely-behavioral goals (interactive flows, conversational
      output) have NO robust shell-checkable end-state — for those return
      {"checks": []}; adding nothing is correct and the evaluator judges
      alone. An empty array always beats a vacuous check.

  - id: output_format
    content: |
      Return a JSON object with a "checks" array. The example is from an
      UNRELATED goal — it shows the SHAPE only.

      ✅ CORRECT (the goal requires a save file to be produced):
      ```json
      {"checks": [{"command": "test -s saves/slot1.json", "description": "the save file exists and is non-empty"}]}
      ```

      ❌ WRONG — re-derives the answer inside the check:
      ```json
      {"checks": [{"command": "[ \"$(recompute)\" = \"$(cat out.txt)\" ]", "description": "value matches"}]}
      ```

      Return ONLY the fenced JSON object.
