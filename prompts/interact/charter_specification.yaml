id: interact/charter_specification
content: |
  Write a test charter — a self-contained tester brief — for the test
  objective above. The charter must contain five labeled parts:

  ## ROLE
  One sentence describing who the tester is playing in this session
  (e.g. "a user exploring a new TODO app for the first time").

  ## LAUNCH
  The exact shell command to start the program, drawn from the code
  structure and project files above. If data files are required
  arguments, include them.

  ## TEST STEPS
  A numbered short list (2-4 steps) of what the tester should try.
  Keep each step one action the tester takes — "type `help`", "add a
  todo labeled 'buy milk'", "quit cleanly with Ctrl-D." Steps are a
  GUIDE, not a checklist — the tester may stop early if the objective
  is clearly satisfied, or go beyond them if evidence is incomplete.

  ## PASS CRITERIA
  One or two sentences stating what observed behavior means the
  objective is satisfied. Be concrete about the specific output or
  interaction that proves it.

  ## FAIL CRITERIA
  One or two sentences stating what behavior means the product
  failed. Distinguish real failures from minor surface issues (a
  deprecation warning on stdout is not a failure).

  Target length: close to 250 words total. The banner tells the
  model this is prose output — write naturally, no JSON, no code
  fences around the whole brief.
