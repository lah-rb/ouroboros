id: interact/charter_function
content: |
  Write a test charter — a self-contained tester brief — that proves the
  ONE capability in the test objective above actually works. This is a
  FUNCTION gate: the job is to demonstrate the feature works once, not to
  explore the product or hunt for quality issues. Keep it tight and direct.

  The charter must contain these labeled parts, in order:

  ## ROLE
  One sentence: a tester verifying this specific capability works.

  ## LAUNCH
  The exact shell command to start the program, drawn from the code
  structure and project files above. If data files are required
  arguments, include them.

  ## TEST STEPS
  A numbered list, as short as the job allows, that exercises the capability by the
  shortest path. Critical rules:
  - Pick the SIMPLEST instance reachable from the start state. Use the
    world/data files above to choose a target that is already present in
    (or one move from) the starting location — do NOT send the tester on
    a multi-step navigation to reach a specific record.
  - Goal text may name a specific example, e.g. "(e.g., the spyglass)".
    That is an ILLUSTRATION, not a requirement. Test the capability with
    whatever instance is closest to hand; the named example does not have
    to be the one you use.
  - If reaching the target genuinely requires movement, write the exact
    route as explicit steps read from the program's own data file — the
    operator sees only this brief and
    cannot discover the map on its own.
  - Each step is one concrete action the tester types.
  - A session may span MULTIPLE RUNS of the program. The tester can quit it
    and relaunch it with a new shell command inside the same session — the
    framework holds the session open across the exit for exactly this. So
    when the capability under test is about state OUTLIVING the process
    (persistence, resume, reload, restart-after-end), the steps must cross
    that boundary: reach a distinctive state, persist it, exit the program,
    relaunch it, restore, and verify the distinctive parts came back. An
    in-process round trip only proves the restore path runs; a relaunch is
    what proves the state survived. Write the exit and the relaunch as their
    own numbered steps — the tester sees only this brief and will not
    attempt a restart the brief does not ask for.
  - If the test objective contains a TEST GUIDANCE block, it was written
    by a diagnosis that read the code, the data, AND the previous failed
    session — its steps are computed from ground truth you cannot see
    (e.g. exact hit counts from code-side damage values). Carry those
    steps into TEST STEPS essentially verbatim, keeping their counts and
    order. Guidance OVERRIDES the step-count cap and the simplest-instance
    rule above; expand to as many steps as the guidance needs.

  ## PASS CRITERIA
  One or two sentences: the capability is satisfied the moment it is
  observed doing ITS JOB once — the response AND the consequence the
  feature exists to produce (e.g. "examine returns a non-empty
  description for the item"; "after removing an entry, the listing no
  longer shows it and the place it was moved to does"). A command that
  prints its message while leaving the world in a state that defeats the
  feature's purpose has NOT passed — a cancel that deletes the record it
  was cancelling, a consumable that is never consumed, a key that opens
  nothing. Name the consequence the tester must see. Do not require
  exhaustive coverage.

  ## FAIL CRITERIA
  One or two sentences naming a real failure of THIS capability (command
  not recognized, error/traceback, wrong or empty output). A navigation
  detour, an unrelated rough edge, or a deprecation warning is NOT a
  failure of this capability — but anything that seems off along the way
  still goes in the tester's summary ("I noticed X but that's okay" is
  never okay: X gets written down, it just doesn't flip the verdict).

  ## CONSTRAINT
  State explicitly: "Complete every TEST STEP in order before ending the
  session — the test is not done until the final step's outcome has been
  observed." (Sessions have been ending after the first successful step;
  the charter must make completion mean ALL steps.)
  The tester VERIFIES; it does not edit. It cannot modify files — there is
  no editor and `apply_patch` does not exist in this environment (it silently
  does nothing). When a defect is found, the tester REPORTS it in the summary;
  fixing is a separate step's job. Do not include any file-editing action in
  the test steps.

  Keep it brief — a tester should take it in at a glance. The banner tells the model this
  is prose output — write naturally, no JSON, no code fences around the
  whole brief.
