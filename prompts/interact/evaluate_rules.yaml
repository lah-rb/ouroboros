id: interact/evaluate_rules
content: |
  Produce the verdict based on what the session actually observed.

  Use these rules:

  - Ground every judgment in the terminal evidence. If no output
    supports a claim, don't make the claim.
  - Judge ONLY the capability the objective names. Never require
    unrelated progress: a session that launches the program and
    directly exercises the named capability is complete evidence,
    however short it is. (A quit test that launches and quits cleanly
    is a PASS — "no gameplay happened first" is not a failure of
    quitting.)
  - "Exercised" means the capability did ITS JOB, not that it produced a
    response. Judge the feature in its intended ROLE: the message is not
    the mechanic. A cancel that prints "Cancelled" and deletes the very
    record it was cancelling has not demonstrated cancelling; an undo
    that reports success and changes nothing has not demonstrated
    undoing; a save that prints "Saved" but loses half the state on
    reload has not demonstrated saving. When the transcript shows the
    response, ask what the world should look like afterwards IF the
    feature did its job — and check the transcript for that too. (A
    shipped artifact passed three verification rounds on a command's
    message alone; the world-check would have failed every one.)
  - A reproduction sequence in the objective names ONE route to the
    behavior, not the only acceptable one. If the session exercised the
    same capability with a different instance — another item, room, or
    record — and it worked, that is a PASS; name the instance actually
    used in the summary. Failing a session because it dropped the
    oilskin coat instead of the rusted key sends the next step hunting
    for a defect the transcript already disproved, and the charter
    author is explicitly told to pick whatever instance is closest to
    hand. Hold to the exact sequence only when the objective ties the
    defect to that specific instance.
  - `goal_met: true` when the observed behavior is sufficient
    evidence that the objective was achieved — even if the session
    didn't run every planned step.
  - `goal_met: false` when the observed behavior directly contradicts
    the objective OR when there isn't enough evidence to tell.
  - `headline` is a one-line (~10-15 word) description of what
    happened. Write it so two attempts are easy to diff: name the
    specific failure mode concretely. "Forward movement works;
    backward movement hangs." "Startup crashes with
    ModuleNotFoundError on 'models'." Not "navigation has issues" or
    "something went wrong."
  - Be specific in the summary. "The program launched and accepted
    input; the expected greeting appeared" is useful. "It worked" is
    not.
  - Note issues, quality-of-life gaps, and things that just seem off —
    even when the objective itself is met. If you catch yourself
    thinking "I noticed X, but that's okay" — it is NOT okay: put X in
    the summary. A reply attributed to the wrong entity, an action
    that reports success without any observable change, a command
    accepted only with one exact phrasing, output that repeats or
    contradicts itself: these are findings, not background. The gate
    only ever sees what you write down.

  - When `goal_met` is false, the summary MUST state the unmet
    expectation as a CONTRAST — what the objective required the session
    to demonstrate, and what was observed in its place: "expected the
    displayed values to change after the update command; observed
    output identical to the pre-update state". Never report only that
    the session "was marked failed" or "did not pass": a verdict
    without its reason sends the next step hunting through code for a
    defect it cannot name. This line is the single most load-bearing
    sentence you write — the diagnosis seed carries it verbatim.

  If the session ended with an error or a crash that's itself a
  finding about the product, report it honestly — goal_met: false
  with the error described — rather than forcing a generous pass.
