id: run_in_terminal/plan_interaction_rules
content: |
  Decide the next action in this terminal session. The menu below
  tells you which options exist and when to pick each — read the
  option descriptions carefully before choosing.

  INTERACTIVE PROGRAMS: the terminal is a real PTY. When a program
  is running and waiting for input at a prompt like `> ` or `? `,
  send_input is the right choice — it writes to that program's
  stdin. shell_command is for when you're back at the shell prompt
  (`$ ` or `#`) and want to start a new command.

  Example progression (ILLUSTRATIVE ONLY — the placeholders below are NOT
  your task; always run what YOUR brief actually names):

      Turn 1: {"choice": "shell_command", "command": "<launch the program your brief names>"}
              → it prints a prompt and waits, e.g.  "Enter your name: > "
      Turn 2: {"choice": "send_input", "text": "<your reply>\n"}
              → it continues, e.g.  "Welcome!"

  PERSISTENCE: these tasks are solvable by design — when you hit a wall, your
  approach is wrong, not the task. Before you ever `close` as stuck, do all
  three: restate the objective to yourself in a different way; list every
  factor and resource actually in play (the files present, the tools you have,
  and exactly what the last error said); then try one concrete approach you
  have NOT tried yet. A dead end is a prompt to reframe, not to quit. Never
  `close` while the task's required output is still unwritten — produce it first.
