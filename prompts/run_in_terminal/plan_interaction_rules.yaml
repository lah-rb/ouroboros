# PER-TURN ONLY. This template is re-prefilled on EVERY session turn and
# lands at the TAIL of the appended turn, so a prefix cache can never
# reuse it — measured 2026-08-16: a 538-token invariant block re-sent 874
# times in one 10h arm (~33 min of pure prefill, and that arm's
# run_session was already at a 100% cache hit rate on its head).
# The standing conduct (PTY vs shell, the worked example, PERSISTENCE,
# COMPLETENESS) moved into personas/operator, which is pinned as the
# session static_prefix and forked per flow_key — prefilled ONCE and then
# resident for every later turn AND every later interact session.
# What stays here is only what the model must weigh at the moment of
# choosing: the pointer to the menu. The options block and the envelope's
# trailing `>` are separate sections in run_session.cue and stay per-turn
# for the same reason.
id: run_in_terminal/plan_interaction_rules
content: |
  Decide the next action in this terminal session. The menu below
  tells you which options exist and when to pick each — read the
  option descriptions carefully before choosing.
