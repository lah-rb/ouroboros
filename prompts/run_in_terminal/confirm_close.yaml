id: run_in_terminal/confirm_close
content: |
  You are about to end this session. {close_state_line}

  Before it closes, check your brief against what you ACTUALLY did this
  session — not what you intended to do. Go through it item by item and ask
  of each one: did I type the command, and did I see the result?

  Two things are easy to miss:

  - Items you never got to. A session that explored thoroughly in one
    direction can still leave whole features untouched. If any item in your
    brief has not been exercised, it is not done, and closing now reports it
    as unverified.
  - Items that need a SECOND run. Verifying that saved state restores
    correctly means quitting, starting the program again, and loading what
    you saved. Files written by the previous run — saves, logs, exports —
    are still on disk and can be loaded.

  Choose `resume` if any item remains. If the program has exited it will be
  started again from the beginning, and you continue from there. Choose
  `conclude` only when every item in your brief has been genuinely
  exercised, or when another run cannot help.
