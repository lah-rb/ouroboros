id: run_in_terminal/ask_relaunch
content: |
  The program has exited. Before the session is assessed, check your
  brief: have you worked through EVERY item in it? Some items can only
  be completed across program runs — for example, verifying that a
  saved state restores correctly requires relaunching and loading the
  save you just made.

  If any item in your brief still needs another program run, choose
  `relaunch` — the same launch command will be run again and you can
  continue from a fresh start (files written by the previous run, like
  saves, are still on disk). If you have completed every item, or
  another run cannot help, choose `conclude`.
