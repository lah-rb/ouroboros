id: project_ops/plan_setup_instruction
content: |
  Generate all configuration and setup files this project needs.
  Typical files for a well-structured project:

  - `pyproject.toml` (or `package.json`, `Cargo.toml`, etc.) — build
    metadata, dependencies, entry points
  - `README.md` — project description and usage
  - `.gitignore` — standard ignores for this language and toolchain
  - `src/__init__.py` or equivalent package markers — even empty files
    if the project layout requires them
  - any language-specific config the focus or task implies
    (`tsconfig.json`, `ruff.toml`, `.python-version`, etc.)

  Do NOT create source code files (`.py`, `.js`, `.rs`, etc.). This
  step is setup and configuration only. Source code is generated by a
  separate flow.

  Each file gets its own fenced code block. The first line inside each
  fence is a `# === FILE: <path> ===` comment identifying the file —
  the downstream writer scans for this marker to know where content
  goes.
