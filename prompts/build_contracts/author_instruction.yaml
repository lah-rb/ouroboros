# Prompt template: build_contracts/author_instruction
#
# Instruction section for the contract-authoring turn. Defines the
# stub-module output format (one fenced block per CODE file, FILE
# marker first line, typed stubs with DbC docstrings + doctests and
# `...` bodies). The worked example teaches FORM in a different domain
# (flashcard/quiz CLI — sanitation doctrine: examples never share the
# benchmark domain).

id: build_contracts/author_instruction
content: |
  Produce one CONTRACT STUB MODULE for EVERY code file in the blueprint
  (skip data files like .yaml/.json — those are built separately). For
  each file, output one fenced code block whose FIRST line is a FILE
  marker naming the exact path from the blueprint. Each block must be a
  syntactically valid Python module in which:

  - The module docstring states the module's responsibility in 1-2 lines.
  - The import block is COMPLETE and FINAL — implementers may not add
    imports, so include everything any symbol in the file will need.
  - Every top-level symbol the file must define appears as a typed stub
    in its final order: exact signature with type annotations, a
    docstring contract, and a `...` body. A class is ONE stub containing
    its attributes and method stubs (one implementer builds the whole
    class).
  - Every helper shared between symbols is declared as its own stub —
    implementers may not invent new module-level names.
  - Module-level WIRING that is not a def/class — the
    `if __name__ == "__main__": main()` guard, module-level constants,
    logger setup — must appear COMPLETE (not stubbed) in the module
    itself. Implementers each write ONE symbol body and never touch
    module scope, so anything you leave out of the module here will be
    absent from the finished file. An entry-point module without its
    `__main__` guard produces a program that does nothing.

  CRITICAL — the implementers are ISOLATED. Each one sees only its own
  symbol's contract, its module's stubs, and the SIGNATURES of imported
  modules. It never sees the objective, sibling implementations, or the
  wider design. So the contract must encode every cross-symbol decision:

  - ENTRY-POINT / DISPATCH symbols (a command loop, a request router,
    any function that routes input to handlers): the docstring must
    ENUMERATE the dispatch EXPLICITLY — each command/verb/route mapped to
    the exact callee symbol and its argument shape (e.g. `"go <dir>" ->
    move_player(state, dir)`). Prose like "dispatch to the appropriate
    handler" is NOT enough — the isolated worker cannot recover the
    command set from it and will stub the loop. You have the objective;
    the worker does not, so the full command vocabulary lives HERE.
  - The entry module's import block must be COMPLETE for the dispatch —
    if `main` calls combat/save/parser symbols, those modules MUST be
    imported in `main`'s stub (the worker cannot add the import).
  - ATTRIBUTE/METHOD DISCIPLINE: a symbol may access only attributes and
    methods that the target type's OWN contract declares. If `combat`
    reads `monster.attack`, then the `Monster`/`MonsterState` stub must
    declare an `attack` field. Do not reference a field on a type whose
    stub does not define it — that contradiction ships as a runtime
    crash the isolated workers cannot detect.
  - DATA SHAPE ACROSS MODULES: data passed between modules must have ONE
    declared shape. If a loader returns parsed OBJECTS (e.g.
    `list[Room]`), annotate that exactly and do not let a consumer treat
    it as raw dicts; if it returns raw dicts, annotate `dict`/`list[dict]`
    and the consumer must use `d["key"]`, not `d.attr`. Do NOT return a
    bare `dict` that a consumer then treats as an object with attributes
    — prefer a typed model (dataclass) for any structure that crosses a
    module boundary and is accessed by attribute. (Round-1 crash:
    `load_world` returned dicts while the engine did `room.id`.)

  Each docstring is a CONTRACT with this shape: one purpose line;
  Args/Returns with meaning, not just types; Raises with the exact
  conditions; and 1-3 doctest examples showing real input → output.
  Doctests must be SELF-CONTAINED (construct their own inputs, no file
  or network access) — they are executed verbatim against the assembled
  module as its acceptance test.

  ```python
  # === FILE: study_engine.py ===
  """Session engine: deals cards and scores answers."""

  from models import Card, Deck


  def score_answer(card: Card, answer: str) -> bool:
      """Return True when `answer` matches the card's back, ignoring case
      and surrounding whitespace.

      Args:
          card: The card being answered.
          answer: Raw user input.

      Returns:
          True on a match; False otherwise. Never raises on empty input.

      >>> score_answer(Card(front="2 + 2", back="4"), " 4 ")
      True
      >>> score_answer(Card(front="2 + 2", back="4"), "five")
      False
      """
      ...
  ```

  Output ONLY the fenced contract blocks — no prose between them.
