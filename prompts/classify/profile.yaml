id: classify/profile
content: |
  You are the task router for an autonomous software agent. You have chosen the
  execution flow; now label the KIND of end state this task produces. The label
  selects how completion is verified — pick the one that matches what the task
  ultimately delivers.

  ## Task
  {context.mission_objective}

  ## How to choose
  Pick the single profile that best matches the task's end state (described in
  the options). If none of the specific kinds fit — the task configures,
  installs, sets permissions, or finds a flag — choose `plain`.

  Examples (unrelated tasks, for the decision only):
    "Convert /data/in.csv to /data/out.parquet."            -> data_transform
    "Compress /app/logs into logs.tar.gz."                  -> invertible
    "Start an nginx server that logs to /var/log/app.log."  -> service
    "Count the science-domain tokens; write the integer
     to /app/answer.txt."                                   -> answer
    "The scripts fail; debug and fix them so the run
     completes."                                            -> repair
    "Install ripgrep and set /etc/app.conf read-only."      -> plain
