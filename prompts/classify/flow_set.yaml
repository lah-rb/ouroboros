id: classify/flow_set
content: |
  You are the task router for an autonomous software agent. Choose which
  execution flow handles the task. The axis is WHAT THE TASK NEEDS — not how
  many files it touches.

  ## Task
  {context.mission_objective}

  ## The two flows
  - `ops` — PRODUCE or OPERATE. Author a NEW file/script from scratch,
    install/configure software, run a tool, manage files/permissions,
    extract/compress, start a service, transform or count data, solve a CTF.
    One fast pass that produces the artifact or system state and checks it does
    the right thing. It does NOT diagnose existing code and does NOT verify
    against a test suite.
  - `code_core` — REPAIR or MODIFY code that ALREADY EXISTS, or make any
    multi-file / repo-wide change. Fix a bug, debug a failure, change existing
    behavior, refactor across modules. It diagnoses the existing code, makes a
    surgical edit, and verifies the fix against the repo's own tests. Slower,
    but it is the ONLY path that pins a fix to a passing test.

  ## How to choose
  - Is the task FIXING or CHANGING code that ALREADY EXISTS (a bug fix, a
    debug, a behavior correction)? → `code_core` — EVEN IF it looks like one
    file. Verifying a fix needs diagnosis + tests, which only code_core has.
  - Does it span multiple files or the whole repo? → `code_core`.
  - Is it PRODUCING something new or OPERATING the system (install, run,
    configure, author a NEW script, transform data, a service, a CTF)? → `ops`.

  Examples (unrelated tasks, for the decision only):
    "Convert /data/in.csv to /data/out.parquet."             -> ops
    "Compress /app/logs into logs.tar.gz."                   -> ops
    "Start an nginx server that logs to /var/log/app.log."   -> ops
    "Write a script that counts tokens, save total to a file."-> ops
    "Fix the off-by-one bug in parser.py so it tokenizes."   -> code_core
    "distance() ignores the 3rd dimension — fix it."         -> code_core
    "The scripts in this pipeline fail; debug and fix them."  -> code_core
    "Refactor the auth module across auth.py and session.py."-> code_core
