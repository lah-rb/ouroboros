readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "json-repair>=0.*",
    "jsonpath-ng>=1.6",
    "markdown-it-py>=3.0.0",
    "mcp>=1.0.0",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "ptyprocess>=0.7.0",
    "pydantic>=2.12.5",
    "pyte>=0.8.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18",
    "ruff>=0.15.6",
    "scipy>=1.17.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-language-pack>=1.8.1",
    "weasyprint>=68.1",
    "jedi>=0.20.0",
]
