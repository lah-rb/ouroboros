[project]
name = "ouroboros"
version = "0.1.0"
description = "Flow-driven autonomous coding agent backed by LLMVP local inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.3.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "json-repair>=0.*",
    # Mission-state CRDT engine (persistence/mission_doc.py, the only
    # importer). Pinned to the verified line: 1.13.x passed the convergence
    # rehearsal (counter sum / log union / LWW determinism).
    "loro>=1.13.2,<2",
    "jsonpath-ng>=1.6",
    "markdown-it-py>=3.0.0",
    "mcp>=1.0.0",
    "networkx>=3.6.1",
    "numpy>=2.4.3",
    "packaging>=24.0",
    "ptyprocess>=0.7.0",
    "pydantic>=2.12.5",
    "pyte>=0.8.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18",
    "ruff>=0.15.6",
    "tomlkit>=0.13",
    "scipy>=1.17.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-language-pack>=1.8.1",
    "weasyprint>=68.1",
    "jedi>=0.20.0",
    # The adaptive reasoning router (agent/reasoning_router.py) loads
    # models/reasoning_router_v1.joblib, whose artifact unpickles a
    # sklearn FeatureUnion + LogisticRegression — so BOTH are needed, and
    # both are CORE rather than an extra because that module runs on every
    # mission. They were undeclared: the import sits inside a try/except
    # with a negative cache, so their absence does not crash, it silently
    # drops the router back to a fixed policy and loses the measured
    # -42% decode/turn. A quiet capability loss is the worst kind to leave
    # undeclared, because nothing fails to tell you about it.
    "joblib>=1.5",
    "scikit-learn>=1.9",
    # PyMuPDF. The extractor toolchain has its own venv and imports fitz
    # there, but the TESTS for it import the tool by path and so need it in
    # whatever venv runs pytest. It was undeclared and merely happened to be
    # present on the development machine; porting to Linux surfaced that as
    # two collection errors and — worse — four tests that SKIPPED rather than
    # failed, including the truth-oracle suite guarding the extraction gate.
    # A silently-skipped test is a test that is not protecting anything.
    "pymupdf>=1.26",
]

[project.optional-dependencies]
# Bench-facing harness deps (adapters.swe). Heavy (datasets → pyarrow) and only
# needed to load SWE-bench instances + run the official evaluator, so kept out
# of the core install — the adapters.swe tests import-guard them. Install with
# `uv sync --extra swe`. (terminal_bench follows the same in-venv-not-core
# pattern for adapters.tb.)
swe = [
    "swebench>=3.0.0",
    "datasets>=2.0.0",
]
# adapters/tb — BOTH benchmark generations, and they are separate packages.
# `terminal-bench` is TB1 (BaseAgent/TmuxSession); `harbor` is TB2, imported by
# adapters/tb/harbor_agent.py and NOT pulled in by terminal-bench. Omitting it
# was the one genuine miss when this file was first written — a sync would have
# left TB2 uninstallable while every test that imports it silently skipped.
# terminal-bench's own metadata pulls litellm/openai/anthropic, so declaring it
# restores that whole subtree THROUGH THE RESOLVER rather than by hand.
tb = [
    "terminal-bench>=0.2.18",
    "harbor>=0.20.0",
]
# adapters/tau — the official tau-bench, which is NOT on PyPI. Pinned to the
# upstream commit the τ work was validated against (gold replay 6/6, reward
# 1.0). It was previously an editable install from a local clone; that clone
# is an UNMODIFIED checkout of this exact revision, so nothing is lost by
# resolving it here — and a fresh machine no longer needs a side-loaded repo.
tau = [
    "tau_bench",
]
# dev/ plotting scripts only (plot_swarm_perf, plot_run_throughput). Kept out
# of core because nothing the agent runs draws a chart.
plots = [
    "matplotlib>=3.11",
]

[tool.uv.sources]
tau_bench = { git = "https://github.com/sierra-research/tau-bench.git", rev = "59a200c6d575d595120f1cb70fea53cef0632f6b" }

[tool.black]
# Defaults, stated explicitly so the standard is a decision rather than
# whatever the installed black happens to do. A future black changing its
# default line length would otherwise reformat the tree silently.
line-length = 88
target-version = ["py312"]
