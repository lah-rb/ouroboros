# Gemma format schema — Google Gemma 4
#
# REWRITTEN 2026-07-22 for Gemma 4. The previous version modelled Gemma 3
# (<start_of_turn>/<end_of_turn> framing, "no system role — fold into the
# first user turn"), but gemma-4-31b.yaml was its ONLY consumer, so Gemma 4
# was being served with the wrong turn framing and no system turn at all.
# Gemma 3 is intentionally NOT carried forward (Gemma 4 supersedes it under
# Apache-2.0).
#
# Gemma 4 uses <|turn>/<turn|> framing, has a REAL system role, and expresses
# reasoning through a `thought` channel. Verified against the official
# chat_template.jinja + tokenizer_config.json for google/gemma-4-26B-A4B-it
# (banked at dev/gemma4_chat_template.jinja); a golden test in
# tests/test_config.py pins our rendering against that template.
#
# Official special tokens (tokenizer_config.json):
#   sot_token   "<|turn>"     eot_token "<turn|>"
#   soc_token   "<|channel>"  eoc_token "<channel|>"
#   think_token "<|think|>"   (input-side thinking ACTIVATION; see below)
#
# Template shape:
#   <bos><|turn>system\n[<|think|>\n]{system}<turn|>\n
#        <|turn>user\n{message}<turn|>\n
#        <|turn>model\n[<|channel>thought\n<channel|>]
#
# THINKING is activated by the presence of `<|think|>` at the top of the
# system turn (the official `enable_thinking` chat-template kwarg) — it is
# BINARY, with no graded levels. The reasoning.levels map at the bottom wires
# this to the adaptive head-swap via the padding trick (dev/gemma_pad_probe.py);
# gemma-4-31b.yaml serves `thinking: true`, so the default state is
# thinking-ON and the adaptive router's low level is the OFF toggle.

family: gemma
display_name: "Google Gemma 4"

tokens:
  msg_open: "<|turn>"
  msg_content: "\n"
  # Trailing newline matches the official template's "<turn|>\n<|turn>"
  # boundary; gen_stop stays the bare token (it is a stop SEQUENCE).
  msg_close: "<turn|>\n"
  gen_stop: "<turn|>"
  history_close: "<turn|>\n"

roles:
  system: "system"
  user: "user"
  assistant: "model"

thinking:
  # Gemma-4 emits its reasoning in a dedicated channel:
  #   <|channel>thought\n{content}<channel|>
  # With thinking disabled the model still emits the channel EMPTY (verified
  # live, dev/gemma_pad_probe.py), so declaring the close tag as the content
  # delimiter strips the preamble either way. NOTE: this is minimal handling
  # of Gemma-4's channel format — full multi-channel / tool-calling is a
  # follow-up.
  style: inline_tags
  open_tag: "<|channel>thought"
  close_tag: "<channel|>"
  prefill_closed_when_disabled: true

system_block:
  identity: ""
  cutoff: ""
  # Canonical default -> the ReasoningSpec map renders it as <|think|>, so
  # non-adaptive serving is thinking-ON. Only the router's "low" pads it out.
  reasoning_default: "medium"
  channel_directive: ""
  # The reasoning slot renders ABOVE the persona: Gemma-4 activates thinking
  # with `<|think|>` at the top of the system turn.
  template: "{reasoning_prefix}{persona}"
  reasoning_prefix: "{reasoning}\n"

traits:
  # Gemma 4 HAS a real system role (unlike Gemma 3, which folded system
  # content into the first user turn).
  fold_system_into_first_user: false
  supports_developer_role: false

generation:
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  repeat_penalty: 1.0

turn_transition:
  needs_close: true
  # Close the previous model turn before the next user turn. <turn|> is a
  # single special token, so the trailing newline matches Gemma-4's canonical
  # "<turn|>\n<|turn>" boundary cleanly.
  after_generation: "<turn|>\n"

# Gemma-4 is BIMODAL: thinking is activated by the PRESENCE of `<|think|>` in
# the system turn (official `enable_thinking` kwarg); there are no graded
# levels, so two canonical levels must collapse. The collapse STRADDLES the
# router's operating range: the trained router emits low/medium and (in
# practice) never high, so the original low+medium -> "off" mapping made
# adaptive a structural no-op — every routed turn rendered the same padding
# (discovered on the 2026-07-23 greenfield A/B, where both gemma arms were
# byte-identical thinking-OFF). medium+high -> `<|think|>` puts the toggle on
# the boundary the router actually exercises: low = off, medium/high = think.
# Default (reasoning_default: medium) is therefore thinking-ON.
#
# THE PADDING: Gemma's native toggle is an INSERT/DELETE, which would shift
# every downstream token and make the mid-session head splice illegal (it
# requires equal head lengths and refuses otherwise). So the off-state is
# PADDED to the same token length rather than being empty:
#
#     '<|think|>\n' -> [98, 107]      (2 tokens)
#     '  \n'        -> [138, 107]     (2 tokens)   <- padding
#
# The trailing newline is shared, so it is a ONE-token substitution: 98 -> 138.
# Two spaces (138) is deliberate — it sits in the same low-ID whitespace region
# as \n (107) and \n\n (108), i.e. a frequent, well-conditioned token, unlike a
# reserved/unused token whose near-random embedding is the classic glitch-token
# hazard. NOTE '\n\n' MERGES to ONE token (108) and would silently break parity.
#
# Validated live 2026-07-22 on gemma-4-31B-it-QAT (dev/gemma_pad_probe.py,
# 5 arms x 5 prompts): with the padding in the slot the model behaves as
# ABSENCE (empty thought channel, ~39 out-tokens) and NOT as `<|think|>` (real
# reasoning, ~131), with answers matching the canonical off-branch.
reasoning:
  levels:
    low: "  "
    medium: "<|think|>"
    high: "<|think|>"
