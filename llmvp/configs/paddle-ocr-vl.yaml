# PaddleOCR-VL-1.6 — the OCR reader, as a HOT SECONDARY (Phase 2b residency).
#
# WHAT THIS REPLACES. tools/pdf_extract/extract_batch.py has spawned its own
# `llama-server` per batch since the toolchain was written: ~84 spawns across
# the 2026-08-13 overnight scrape, each loading weights, serving two PDFs and
# dying. That works, but the OCR stage then lives outside LLMVP entirely —
# Ouroboros owns a server lifecycle, model choice is a constant in a tool, and
# nothing in the fleet's model management can see it.
#
# WHY IT IS SAFE TO BRING IN-PROCESS NOW. MULTI_MODEL_PLAN's P0.b parked local
# co-residency on a 2026-07-16 verdict of "concurrent == solo SUM, plus a
# greedy divergence". Re-measured 2026-08-13 on the current build, BOTH halves
# fell: the divergence was a probe artifact (KV accumulated across arms because
# the instance was never restored — it vanishes with a per-decode restore), and
# topology turned out not to be the variable at all. Same pair, same protocol:
# in-process 0.619, cross-process 0.575. Full record in
# dev/PARALLEL_LANES_2026-08-13.md §7d.
#
# WHAT ACTUALLY GOVERNS THROUGHPUT is the workload PAIR. Measured the same day:
# this model's OCR against muse's text decode overlaps at 0.342 — the best of
# every pair tried — because a compute-bound tenant fills the gaps a
# bandwidth-bound decoder leaves. Against muse's VISION it is 0.524, and two
# text decoders are ~0.6. So OCR belongs paired with the TEXT lane.
#
# ── VISION-ONLY ENTRY, deliberately ─────────────────────────────────
# Reachable only through POST /v1/vision (or visionCompletion) with
# `model: paddle-ocr-vl`. The TEXT path must not route here and cannot:
# run_completion builds its prompt from the ACTIVE config's tokenizer and
# static buffer, so a text request routed to a secondary would tokenize with
# the primary's tokenizer and prepend the primary's static head — silently
# wrong tokens, no error. Only the vision path is safe, because the mtmd
# handler builds the prompt from THIS model's own chat template.
#
# Driving it as a text decoder is also just meaningless: with no image
# attached it degenerated after 57 tokens (`cycle period 2 x 12`) in the
# 2026-08-13 pair probe. A vision model with nothing to look at has no work.
#
# family: paddleocr resolves PaddleOCRChatHandler via
# inference/vision_handlers._FAMILY_HANDLERS, matching general.architecture in
# the GGUF. There is no formats/paddleocr.yaml and none is needed —
# vision_text.stop_strings returns [] for a family it does not know, and this
# model's template closes on its own `</s>` (eos id 2), which llama.cpp honours
# natively. The template is a plain
# `User: <|IMAGE_START|><|IMAGE_PLACEHOLDER|><|IMAGE_END|>{text}\nAssistant:\n`.
#
# ── Budget ───────────────────────────────────────────────────────────
# weights 498 MB (Q8_0) + projector 882 MB + KV.
#
# THESE NUMBERS ARE PER DEVICE NOW, and on a discrete host that is the whole
# story. Measured 2026-08-15 on the 3090/3060 rig:
#
#   CUDA0  23.56 GiB total — muse holds 21.22 GiB of text (weights 18.30 +
#          projector 1.30 + n_ctx 32768 KV 1.62) and DECLARES a further
#          6.50 GiB of lazy vision KV it cannot afford there.
#   CUDA1  11.63 GiB total — empty, which is why this model is pinned to it.
#
# So CUDA0 has no room for an 882 MB projector, and mtmd offers no device
# index — only use_gpu, plus the MTMD_BACKEND_DEVICE getenv that clip.cpp
# resolves by backend name. vision_projector_device: "CUDA1" uses that to put
# the projector beside the weights on the 3060 — the difference between this
# model loading and the server dying (it OOMed CUDA0 twice before the
# governor could see the charge, and the CPU fallback cost 2.3x wall).
#
# n_ctx is small ON PURPOSE — the text pool is never used, so paying KV for it
# would be pure waste. vision_n_ctx is what OCR actually consumes, and 32768 is
# four times the `-c 8192` per slot the subprocess path was measured under
# (2026-08-12: numeric recall 0.935 / span 0.900 held at 1, 4 and 8 slots).

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 300

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "paddle-ocr-vl"
  family: "paddleocr"
  path: /home/lah-rb/models/PaddleOCR-VL-1.6.Q8_0.gguf
  mmproj_path: /home/lah-rb/models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
  # Text pool: minimal. This entry is never a text target.
  n_ctx: 4096
  # Vision: the window OCR crops actually land in.
  vision_n_ctx: 32768
  # 2, AND MEASURED TO BE THE RIGHT NUMBER — not a hedge any more.
  #
  # The old reason for 2 was an OOM: the preflight counted ONE vision context
  # instead of vision_pool_size, approved "1.49GB OK" for 4 x 32768, and then
  # died building the pool it had just approved. That governor bug is fixed
  # (llama_cpp_backend.py, "TIMES THE POOL WIDTH"), so the hazard is gone.
  #
  # Width was then swept on the real tool over real PDFs, iso-memory
  # (vision_n_ctx is per CONTEXT, so 2x32768, 4x16384 and 8x8192 all preflight
  # at 2.09 GB — verified byte-identical). Throughput on one workload:
  #
  #     2 x 32768 -> 11.26 pages/min      <- this config
  #     4 x 16384 -> 10.37 pages/min
  #     8 x  8192 -> 10.82 pages/min
  #
  # WIDTH BUYS NOTHING. An OCR request is ~80% FIXED per-request serving cost
  # (~92 ms that scales with neither image area, output length, prompt length
  # nor n_ctx); only ~14% is encode+decode+transport, and the fixed part does
  # not parallelize across contexts. Do not raise this expecting throughput —
  # raise DEFAULT_LANE_MAX_INFLIGHT["paddle"] with it and you get a deeper
  # queue and noisier telemetry. See dev/OCR_LANE_2026-08-29.md.
  vision_pool_size: 2
  # The projector cannot follow main_gpu — mtmd takes use_gpu, not a device —
  # so left alone it lands on CUDA0 where muse already sits (that OOM killed
  # the server twice). clip.cpp's MTMD_BACKEND_DEVICE escape hatch names a
  # backend directly, so the projector joins the weights on the 3060. The CPU
  # fallback was measured first and costs 2.3x wall (121.1 s vs 52.1 s on a
  # 10-page paper) — placement, not offload, is the fix.
  vision_projector_gpu: true
  vision_projector_device: "CUDA1"
  vision_image_roots:
    - "~/corpora"
    - "~/ouroboros-runs"
  n_gpu_layers: -1
  # 3060. The OCR lane gets its own device so it never contends with the
  # text lane — on the M1 that pair was the BEST available at 0.342; here
  # the device split makes it ~0.00.
  main_gpu: 1
  split_mode: none
  seed: -1
  verbose: false
  thinking_available: false
  thinking: "off"

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  # OCR answers are page/region transcriptions — bounded, and a runaway on a
  # dense figure costs the whole batch's wall time.
  max_tokens_default: 4096
  # THESE DEFAULTS ARE ALMOST NEVER CONSULTED, and knowing why is the whole
  # story of the "degenerate decode" class. paddlex pins `temperature: 0` in
  # every request it sends a llama-cpp-server backend (predictor.py:503), and
  # an explicit request value outranks any server default — so OCR decode was
  # GREEDY everywhere, on both machines, through both serving paths, whatever
  # this block said. Greedy orbits on loop-prone pages: microc.2018.01.004
  # repeated "both" 3,003 times BYTE-IDENTICALLY on the M1 and on the CUDA
  # rig. (llama-server read that page clean at the same greedy settings only
  # because its template-built prompt differs from the mtmd handler's —
  # luck, not robustness.)
  #
  # The effective control is therefore the CLIENT: extract_batch passes
  # --vl-temperature 0.8 / --vl-top-p 0.95 per predict() call — the lab's own
  # documented stochastic alternative to its greedy default. Validated
  # 2026-08-15: microc rep 3003 -> 20 with numeric/span 0.985/0.988, two
  # known-good papers within noise of their greedy rates. This default
  # matches, for any caller that sends nothing.
  temperature_default: 0.8
  top_p: 0.95
  top_k: 40
  min_p: 0.05
  presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: false

knowledge:
  tokens_bin: "./data/paddle-ocr-vl.tokens.bin"
  token_limit: 2048

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  decode_mode: "pool"

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: false
  directory: "./logs"
