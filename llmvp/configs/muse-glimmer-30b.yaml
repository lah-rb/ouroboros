# Muse-Glimmer-30B (Meta) — first intake, 2026-08-11
#
# Model card (READ, per reference.yaml step 2):
#   https://huggingface.co/meta-models/Muse-Glimmer-30B
#
# ── What the headers said (step 1) ──────────────────────────────────
#   arch=muse-glimmer  layers=52  n_head=32  n_kv_head=2  embd=6656
#   DENSE (experts=0)  trained ctx=131072  rope_freq_base=500000
#   weights 18.3 GiB   KV/token 52 KiB
#   attention.sliding_window = 2048, sliding_window_pattern = true
#
# The sliding window is the load-bearing one: this is an SWA family, so
# `swa_full: true` is REQUIRED or any pinned/forked prefix corrupts at the
# window boundary. Nothing but the GGUF headers tells you that.
#
# KV is 52 KiB/token — 26x gpt-oss's 2 KiB — but that header figure is the
# WHOLE cost, not a number to double. This config previously warned that
# swa_full allocates a full-size SWA cache alongside the non-SWA one and to
# "budget roughly double the naive arithmetic"; the probe measured
# kv_bytes_per_token_actual = 53248 with both caches live, i.e. exactly the
# header figure. n_ctx started conservative on that wrong arithmetic.
#
# MEASURED 2026-08-11 (--probe-context): ceiling 131072 = the full trained
# range, "nothing here limits it". One rung, 3/3 generations, KV 6656 MiB,
# peak wired 30.2GB against a 123.7GB budget — so the whole model at full
# context costs ~30GB and leaves room to co-reside. n_ctx and
# model_max_context both raised to the measured ceiling.
#
# ── Sampling (step 2) ───────────────────────────────────────────────
# CHOSEN: the card's single published profile — temperature 1.0, top_p 0.95,
# top_k 64.
# REJECTED: harmony's 1.0 / 1.0 / 0. Muse-Glimmer is harmony-SHAPED, and
# copying the neighbouring family's block would have silently changed the
# sampler on a model whose card specifies otherwise.
#
# ── Format (step 3) ─────────────────────────────────────────────────
# New family `muse-glimmer` (formats/muse-glimmer.yaml). Two traps, both
# closed there and verified by a golden test against the GGUF's own chat
# template:
#   * turns end on <|eot|> (200008), NOT the GGUF eos <|end_of_text|> (200001)
#   * <|eom|> (200007) closes the REASONING message and must never be a stop
# This section used to claim "fsm_labeller needs no edit — it derives shape
# from the format file". Half true, and the wrong half is what broke: it
# derived the SHAPE and not the VOCABULARY. See the defect note below. It is
# true NOW, for shape, vocabulary, recipient form and terminators alike.
#
# ── The empty-completion defect: FIXED 2026-08-11 ───────────────────
# Every completion through this config used to return "". It was never the
# model and never the prompt — it was EXTRACTION, and the earlier diagnosis
# recorded here was wrong on the facts. Keeping the correction visible
# because the wrong story cost most of a day.
#
# WHAT WAS ACTUALLY HAPPENING. Captured raw, with no stop strings and EOG
# reported rather than obeyed (dev/muse_raw_probe.py):
#
#   to=self<|message|>…347+596 = 943…<|eom|>
#   <|start|>assistant to=user<|message|>943<|eot|>
#
# The model opened `to=user`, answered 943, and terminated on <|eot|>
# correctly — a textbook turn. The server's 158-char raw was that exact
# string. What returned "" was `_strip_delimiter`.
#
# ROOT CAUSE — the FSM derived the channel SHAPE from this family's format
# yaml but not the channel VOCABULARY. core/featurizer.py hardcoded
# Harmony's words (analysis/final/tool/functions). This family's channels
# are a RECIPIENT in plain text — `to=self` / `to=user` — so no CHAN_* atom
# was ever emitted, `<|message|>` never completed a transition, the FSM sat
# in DELIM for the whole stream, and reasoning AND answer were both labelled
# D and dropped. Two more gaps fell out of the same root: <|eom|> and <|eot|>
# were in no marker table either, so no phase ever closed, `eot` leaked into
# content as a bare word, and the single_turn seal never fired against this
# model's post-answer orbit (it re-answers ~20x if you let it).
#
# The fix derives all three from formats/muse-glimmer.yaml, so the next
# family costs zero edits — which is what this file already claimed and did
# not yet deliver. See _channel_vocab / _recipient_form in core/featurizer.py
# and TestRecipientChannelFamily in tests/test_fsm_labeller.py.
#
# What was ruled out along the way, so nobody re-walks it: the model itself
# (its own template works, and so does LM Studio); stop tokens (<|eot|> and
# <|end_of_text|> are EOG, <|eom|> is not — audit clean); the developer role
# (genuinely wrong, this family has none, but fixing it changed nothing);
# message framing (golden test is byte-exact against the published
# template); persona content; sampling temperature; and the tools block —
# which was never injected at all, because prompt.tools_file defaults to
# None and no config in the fleet sets it. The "PRIME SUSPECT — tool
# rendering" theory recorded here was false on that last point alone.
#
# The probe that found this deserves a note of its own: --probe-context
# scored a rung on whether EXTRACTED text came back from a maxTokens:200
# completion, and this model spends 27-224 tokens reasoning before it opens
# the content channel. So the first probe scored a healthy 131072 rung as
# NO_OUTPUT at 30GB/123.7GB and would have walked every rung to a wrong
# ceiling. The health test now accepts "still generating at the cap" (155466c)
# — a fix that was owed to every heavy reasoner, not just this one.
#
# STILL OWED before this model carries a coding run:
#   1. A cache_compat_matrix cell for the ledger (step 8).
#   2. A batched-decode swarm check (1->4 streams) — the open question is
#      whether it can pull double duty as the vision model AND a text arm.
#   3. ATEM tool rendering + the dynamic `# Valid recipients:` line IF we
#      ever give this family tools. Not a blocker for plain text.
#
# Vision is a SEPARATE track and is NOT blocked by this: the mmproj works
# today through llama-cpp-python's mtmd path outside LLMVP, where it was
# the most faithful figure transcriber in the 2026-08-11 bake-off.
#
# ── Reasoning: the PREFILL dial works, the PER-REQUEST dial does not ─
# The card exposes low/medium/high/xhigh via a `Reasoning strength:` system
# line and recommends high/xhigh for agentic work.
#
# MEASURED 2026-08-11, two structured shapes (strict-JSON extraction and a
# one-word screening decision), 2 samples each:
#
#   per-request `reasoning:` override, prefix pinned high
#     json      low 302 tok · medium 227 · high 290
#     decision  low 155 tok · medium 182 · high 173
#   NON-MONOTONIC in both, reasoning fraction stuck at 88-94% regardless.
#   It is a SILENT NO-OP. The level lives in the `Reasoning strength:` line
#   inside the STATIC PREFIX, so a per-request override cannot move it
#   without reasoning_head_swap, which this config does not enable. The
#   prefill half of a dial is the half a model follows.
#
#   thinking_mode in the PREFIX (rebuild the tokens.bin to apply)
#     json      high 240-290 tok / 12-15s  ->  low 151-178 tok / 7.6-9.0s
#     decision  high 173-177 tok / 8.8s    ->  low 102-149 tok / 5.1-7.5s
#   ~35-40% fewer tokens per turn, IDENTICAL answers in every sample.
#
# SET TO low, deliberately against the card's high/xhigh recommendation,
# because the first workload is a literature SCRAPE: hundreds of short
# screening decisions where the model was spending ~90% of every turn
# thinking about a one-word answer. At 19.3 tok/s that overhead is the
# difference between a mission that finishes and one that agent_timeouts —
# our historical losses are inference VOLUME, not capability. Raise it back
# to high for coding or long-horizon agentic work, and REBUILD the prefix
# when you do; changing it per request will do nothing.
#
# Caveat on the evidence: two prompt shapes, not a full eval. Reasoning is
# still ~85-92% of output at low, so this trims the dial, it does not
# disable thinking.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "muse-glimmer-30b"
  family: "muse-glimmer"
  path: /home/lah-rb/models/muse-glimmer-30B-kquant-dynamic.gguf
  # SIZED TO THE CARD, not to the model's trained range. Computed from the
  # GGUF header rather than guessed: 52 layers x 2 KV heads x (128+128) x 2 B
  # = 52.0 KiB/token (lean — this is heavy GQA).
  #
  #     n_ctx 131072 -> 6.50 GiB KV + 18.3 weights + ~0.8 overhead = 25.6 GiB
  #     n_ctx  32768 -> 1.62 GiB KV                               = 20.7 GiB
  #
  # The 3090 has 24 GiB, so the M1's 131072 does not fit and llama.cpp fails
  # with "Failed to create llama context with model" — a message that names
  # neither memory nor the context size. model_max_context stays at the
  # trained 131072; stream_context_limit is min(n_ctx, that), so this caps the
  # POOL without lying about what the model can do.
  n_ctx: 32768
  probe_verified_weights_bytes: 19653957984
  probe_verified_n_ctx: 131072
  model_max_context: 131072
  n_gpu_layers: -1
  # 3090. Pinned, not split: dev/CUDA_SWARM_2026-08-14.md measured two
  # tenants sharing one device at serialization 1.043 (worse than serial)
  # and one tenant per device at 0.0011 (free). split_mode must be "none"
  # or LAYER split spreads the model over both cards and the pin is inert.
  main_gpu: 0
  split_mode: none
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: "per_request"
  thinking_mode: low
  # ARCHITECTURE-determined, not strategy-determined: sliding_window=2048.
  swa_full: true
  kv_unified: true
  resident_seq_cache: true
  context_refresh_drain_s: 300
  # VISION. muse was the most faithful figure transcriber in the 2026-08-11
  # bake-off (145/192). The projector is 1.40GB and binds the MODEL, not a
  # context, so it costs no second weight load — just a private single-seq
  # context that the pool never sees. Budget sweep 2026-08-12: no ceiling,
  # answers a dense figure in ~1500 tokens (3200 and 6400 both stop naturally).
  #
  # PROVEN THROUGH THE ENDPOINT 2026-08-12: the same 10 held-out figures and
  # the same question, served by POST /v1/vision, scored 155/192 against the
  # bake-off's recorded 145/192. Not a clean like-for-like (bigger budget, not
  # blind), but well inside the band — the endpoint assembles the prompt the
  # way the direct harness does.
  #
  # vision_n_ctx raised 8192 -> 131072, the model's trained ceiling, which is
  # the standing practice once a model has been proven on the framework. It is
  # LAZY: nothing is allocated until the first vision request, and the text
  # path never touches it. Once built it holds its own KV for the process
  # lifetime — ~7GB at this ceiling, on top of the text path's ~30GB against a
  # 123.7GB budget. Headroom for many images in one request, or a long
  # transcription turn, instead of one figure and a short answer.
  mmproj_path: /home/lah-rb/models/mmproj-kquant.gguf
  vision_n_ctx: 131072
  vision_image_roots:
    - "~/ouroboros-runs"
    - "~/corpora"

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 16384
  temperature_default: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: true

knowledge:
  tokens_bin: "./data/muse-glimmer-30b.tokens.bin"
  token_limit: 16384

resources:
  cpu_threads: 15
  jit_concurrency_limit: null

logging:
  enabled: true
  directory: "./logs"

tools: {}

# ── Ledger cell (reference.yaml step 8), 2026-08-11 ──────────────────
# dev/cache_compat_matrix.py --depth 16 --turn-tokens 900. ONE cell, not the
# multi-cell sweep gpt-oss carries, and run at 900-token turns — do NOT compare
# prefill_total_s against a cell run with the 5-token filler, which understates
# replay growth by ~56x. Compare the CURVE.
#
# The full resident stack engages and correctness holds:
#   fresh curve  [1415, 1080 x14, 20, 18]  — flat, growth 0.02
# Flat is the whole point: each turn re-prefills its OWN payload (1080 ≈ the
# 900-token turn plus framing) and not the accumulated history. Full replay
# would climb turn over turn — gpt-oss's B01 replay cell went 2567 -> 17394 and
# cost 207.7s against 22.4s resident.
#
# Needle recall held at depth 16 AND the early fact survived, so this is not
# plumbing that merely runs — it retains. Snapshot capture came back resident,
# and the fork was HOT at 20 fresh tokens / 2.9s.
probe_verified_cache:
  run_id: cells_20260811-221252
  A2:
    strategy: resident
    can_shift: True
    n_ctx_seq: 131072
    fresh_t2_last: [1080, 18]
    prefill_total_s: 84.3
    needle_at_depth: True
    # Extras this cell measured, kept because they are the resident claims:
    curve_growth: 0.02
    session_mode: resident-live
    strategy_matches_behaviour: True
    early_fact_ok: True
    snapshot_resident: True
    fork_mode: hot
    fork_fresh: 20
    fork_s: 2.9
    depth: 16
    turn_tokens: 900

# PRE-REGISTERED BEFORE THE FIRST ARM, per reference.yaml step 8 — the job of
# this expectation is to make a surprise legible, not to be right.
#
# GRINDER, expected mid. The reasoning: it is a DENSE 30B at 19.3 tok/s single
# stream, ~3x slower than gpt-oss, and it reasons heavily before answering
# (27-224 tokens on trivial prompts), so long contemplative chains are the
# expensive shape here. Its measured strength is fidelity — it read figures
# more faithfully than anything else in the bake-off, including three checks
# nothing else caught — which is a grinder virtue. If it lands contemplator
# instead, the thing to look at is whether the high reasoning dial is paying
# for itself; the swarm config note flags that as the first A/B.
#
# NEVER judged by me — blind subagent only, TIER_RUBRIC v2.1, verdicts to
# llmvp/configs/archive/TIER_JUDGEMENTS.md.
tier:
  league: grinder  # LOAD-BEARING — agent/tier/runner.py:config_league
  status: expected  # history: llmvp/configs/archive/TIER_JUDGEMENTS.md
