# Muse-Glimmer-30B (Meta) — first intake, 2026-08-11
#
# Model card (READ, per reference.yaml step 2):
#   https://huggingface.co/meta-models/Muse-Glimmer-30B
#
# ── What the headers said (step 1) ──────────────────────────────────
#   arch=muse-glimmer  layers=52  n_head=32  n_kv_head=2  embd=6656
#   DENSE (experts=0)  trained ctx=131072  rope_freq_base=500000
#   weights 18.3 GiB   KV/token 52 KiB
#   attention.sliding_window = 2048, sliding_window_pattern = true
#
# The sliding window is the load-bearing one: this is an SWA family, so
# `swa_full: true` is REQUIRED or any pinned/forked prefix corrupts at the
# window boundary. Nothing but the GGUF headers tells you that.
#
# KV IS EXPENSIVE HERE. 52 KiB/token is 26x gpt-oss's 2 KiB, and swa_full
# then allocates a full-size SWA cache ALONGSIDE the non-SWA one, so budget
# roughly double the naive arithmetic. n_ctx starts conservative on purpose;
# raise it only behind a real --probe-context measurement (step 6), never by
# hand-editing probe_verified_* to make a load succeed.
#
# ── Sampling (step 2) ───────────────────────────────────────────────
# CHOSEN: the card's single published profile — temperature 1.0, top_p 0.95,
# top_k 64.
# REJECTED: harmony's 1.0 / 1.0 / 0. Muse-Glimmer is harmony-SHAPED, and
# copying the neighbouring family's block would have silently changed the
# sampler on a model whose card specifies otherwise.
#
# ── Format (step 3) ─────────────────────────────────────────────────
# New family `muse-glimmer` (formats/muse-glimmer.yaml). fsm_labeller needs
# no edit — it derives shape from the format file. Two traps, both closed
# there and verified by a golden test against the GGUF's own chat template:
#   * turns end on <|eot|> (200008), NOT the GGUF eos <|end_of_text|> (200001)
#   * <|eom|> (200007) closes the REASONING message and must never be a stop
#
# ══════════════════════════════════════════════════════════════════
# NOT READY TO CODE. DO NOT PUT THIS MODEL IN A RUN YET.
# ══════════════════════════════════════════════════════════════════
# Status 2026-08-11: it LOADS clean (graph splits 2, resident granted,
# swa_full honoured) and it DECODES — but every completion through this
# config returns an EMPTY string, so it cannot execute a single flow step.
#
# The symptom: given the generation prompt `<|start|>assistant`, the model
# opens ` to=self<|message|>`, reasons, and then emits <|eot|> — ending the
# turn from inside the REASONING channel without ever opening the `to=user`
# content block. Extraction correctly strips reasoning, finds no content,
# and returns "".
#
# What has been RULED OUT, so nobody re-walks it:
#   * Not the model. Driven through its OWN chat template with a bare user
#     message it reaches `<|start|>assistant to=user<|message|>` correctly.
#     It also works in LM Studio (operator).
#   * Not a stop-token mixup. llama_vocab_is_eog: <|eot|> and
#     <|end_of_text|> are EOG, <|eom|> is NOT. stop_token_audit clean.
#   * Not the developer role. That WAS wrong — this family has no developer
#     role and SOUL.md was being framed in `<|start|>developer<|message|>` —
#     and fixing it did not restore output.
#   * Not the message framing. A golden test against the GGUF's own chat
#     template matches byte-for-byte for the system block and for the
#     reasoning+content assistant history.
#
# PRIME SUSPECT — tool rendering. This family renders tool definitions
# INSIDE the system message in its own ATEM form, and changes the
# `# Valid recipients:` line to list each tool namespace when tools are
# present. The renderer does neither: it injects the auto-generated
# tools.txt (~1.6k chars) in a shape the model was never trained on, while
# the recipients line still claims only "self" and "user" are valid. A
# model told its only valid recipients are self and user, holding a tool
# block it cannot address, ending the turn after reasoning is a coherent
# story for exactly this symptom.
#
# NEXT PROBE, in order:
#   1. DONE 2026-08-11 — neutral persona still returns EMPTY (107/205 tok
#      generated, no content). Prefix CONTENT is RULED OUT; the tools block
#      is still injected and is now the only remaining suspect.
#      system-prompt content has vetoed a byte-perfect dial before.
#   2. If that restores output, implement ATEM tool rendering + the
#      dynamic recipients line, then re-probe with tools on.
#   3. Only then --probe-context (n_ctx is a guess until measured) and a
#      cache_compat_matrix cell for the ledger.
#
# Vision is a SEPARATE track and is NOT blocked by this: the mmproj works
# today through llama-cpp-python's mtmd path outside LLMVP, where it was
# the most faithful figure transcriber in the 2026-08-11 bake-off.
#
# ── Reasoning ───────────────────────────────────────────────────────
# The card exposes low/medium/high/xhigh via a `Reasoning strength:` system
# line and recommends high/xhigh for agentic work, which is what we run.
# thinking_mode pins the resident head; per_request lets the router move it.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "muse-glimmer-30b"
  family: "muse-glimmer"
  path: /Users/lah-rb/.lmstudio/models/meta-models/Muse-Glimmer-30B-GGUF/muse-glimmer-30B-kquant-dynamic.gguf
  n_ctx: 65536
  model_max_context: 32768
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: "per_request"
  thinking_mode: high
  # ARCHITECTURE-determined, not strategy-determined: sliding_window=2048.
  swa_full: true
  kv_unified: true
  resident_seq_cache: true
  context_refresh_drain_s: 300

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 16384
  temperature_default: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: true

knowledge:
  tokens_bin: "./data/muse-glimmer-30b.tokens.bin"
  token_limit: 16384

resources:
  cpu_threads: 15
  jit_concurrency_limit: null

logging:
  enabled: true
  directory: "./logs"

tools: {}
