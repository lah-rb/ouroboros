# ── DISPOSITION (Luke, 2026-07-24): KEEP — long-horizon/tuning-gated ──
# The thinking RL does real work (competitive blueprint from a clean-parse
# design; healthy terminating CoT; churn is decisional, not verbal). But the
# deliberation tax is STRUCTURAL at mission scale: tuned rerun still
# hard-capped at 1/14 (rp1.05 helped probes 55-83%, not missions). Produced
# an artifact in BOTH standard windows (unlike Instruct). Use only with:
# (a) much longer windows than the 2h standard, or (b) significant tuning
# investment if interest becomes serious. Best-fit role: DESIGN SPECIALIST
# (architect in a heterogeneous fleet). Lever sweep + rp1.05 details below.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 65536
  max_aliases: 50
  introspection_enabled: true

model:
  name: "olmo-3.1-32b-think"
  # Dedicated family (2026-07-23 template audit): chatml framing PLUS the
  # no-functions capability declaration OLMo's template appends to every
  # system message — plain chatml served it slightly off-distribution.
  family: "olmo"
  path: /Users/lah-rb/.lmstudio/models/unsloth/Olmo-3.1-32B-Think-GGUF/Olmo-3.1-32B-Think-Q6_K.gguf
  # ── GGUF GEOMETRY (dev/gguf_geometry.py, headers, 2026-07-31) ──────
  # Geometrically identical to olmo-3.1-32b-instruct (same arch, same shapes,
  # 1.4 KB apart in file size); only the finetune differs.
  #
  #   arch=olmo2  layers=64  n_head=40  n_kv_head=8  head_dim=128  experts=0
  #   trained ctx 65536 (yarn x8 from an 8192 original)
  #   weights 26.4 GB decimal / 24.6 GiB, 1 shard
  #   KV/token 256 KiB  — EIGHT TIMES gemma-4-26b's 32 KiB on a 32B dense
  #                       model; the KV sizes this config, not the weights.
  #
  #     n_ctx    KV GB   total GB
  #      16384     4.3       30.7
  #      32768     8.6       35.0
  #      65536    17.2       43.6   <- THIS CONFIG
  #
  # WORTH KNOWING FOR THIS VARIANT SPECIFICALLY: as a reasoning model it
  # generates long. In tier_20260730-220500 it ran 109 MINUTES against a 20m
  # backstop and produced ZERO files, with one generation exceeding 12k tokens
  # and no guard firing — coherent-but-long, the shape the runaway detector is
  # blind to. A generous n_ctx is load-bearing here in a way it is not for the
  # instruct variant.
  probe_verified_weights_bytes: 26448495872
  # NO CONTEXT PROBE IS OWED (operator, 2026-07-31). n_ctx is already the GGUF's
  # own trained maximum, so there is no higher ceiling for `--probe-context` to
  # discover; it could only re-confirm a fit the arithmetic above already shows.
  # `probe_verified_n_ctx` is absent by DESIGN, not as a gap.
  #
  # This matters more here than on the instruct sibling: a reasoning model that
  # generates for 109 minutes wants every token of window it can get, and 65536
  # is all this one has. If long generations start truncating, the answer is
  # rope scaling past the trained limit — and THAT would need a real probe,
  # because measured KV/token has run up to 4x the formula on other models.
  n_ctx: 65536
  n_gpu_layers: -1
  seed: -1
  verbose: false
  resident_seq_cache: true
  kv_unified: true
  swa_full: true
  session_full_replay: true
  thinking: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 65536
  temperature_default: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  presence_penalty: 0.0
  # 1.05, NOT the model-card 1.0 — lever sweep 2026-07-23 (dev/
  # olmo_think_levers.py, results.jsonl): at rp 1.0 the decisional churn
  # ("Alternatively" x20 per think) ran 761-5,489 think-words per task and a
  # moderate coding task exhausted 8k tokens WITHOUT terminating; at 1.05
  # thinking dropped 55-83%, wall time halved, and all tasks terminated
  # correct (3/3 vs 2/3). Firmer 1.15+window was better still on decisions
  # but noisier on code; presence penalty INVERTED the difficulty-length
  # relationship (erratic). 1.05 preserves the right shape: tiny think on
  # trivial tasks, real think on hard ones.
  repeat_penalty: 1.05
  streaming_default: true

knowledge:
  tokens_bin: "./data/olmo-3.1-32b-think.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  status: not_yet_run
  expectation:
    registered: 2026-07-29
    tier: "3"
    stars: null
    basis: experience
    why: >
      Basic, and occasionally surprising. Long CoT and slow generation limit
      expectations to tier 3.
