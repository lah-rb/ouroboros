app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  # Enables the /v1/chat/completions REST shim (for the Terminus comparison
  # run; harmless for Ouroboros, which uses GraphQL).
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.6-35b-a3"
  family: "chatml"
  path: /Users/lah-rb/.lmstudio/models/noctrex/Qwen3.6-35B-A3B-MXFP4_MOE-GGUF/Qwen3.6-35B-A3B-MXFP4_MOE_BF16.gguf
  n_ctx: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attention: true
  batch_size: 512
  thinking: false
  # Re-prefill sessions from history (robust default; avoids the deep-session
  # save_state overflow). Sound for any model.
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # Higher base; flows scale temp DOWN per task (t*<1.0). Keeps task-scaled
  # temps out of the low-temp regime that worsens sparse-MoE repetition.
  temperature_default: 0.8
  # Sparse-MoE repetition mitigations (same posture as qwen3-next-coder).
  session_temp_floor: 0.5
  temperature_floor: 0.4
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.1
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.6-35b-a3.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
