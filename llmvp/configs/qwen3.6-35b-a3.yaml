# ── UNRANKED (2026-07-28). The tier-3 standing this carried was measured on
# the unsloth build; on APEX I-Balanced this is objectively a different model
# and its old placement no longer describes it. Re-earn a tier from a panel
# run on THIS quant.
#
# THE DEGENERATION NOTE THAT USED TO LIVE HERE IS GONE, and deliberately.
# It described a family paragraph-ORBIT — a turn-level deliberation loop above
# the token-level guards — that shaped this config's whole sampling stack. On
# APEX I-Balanced it did not appear: 36 generations, ZERO guard events of any
# kind (long-cycle, run-length, cycle-period), across the 2026-07-28 arm and
# its rerun. Fleet-wide the same held — 618 generations across all three qwen
# MoEs, not one degenerate turn. Switching to APEX I-Balanced appears to have
# resolved the fragility in this family.
#
# "Appears to" is the honest strength. It is an absence over ~600 generations,
# not a mechanism, and the sampling mitigations below were live the whole time
# — so this is quant AND stack, not quant alone. The guards stay armed and the
# vendor profile stays; if an orbit ever returns, the note comes back with the
# capture that proves it.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  # Enables the /v1/chat/completions REST shim (for the Terminus comparison
  # run; harmless for Ouroboros, which uses GraphQL).
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.6-35b-a3"
  family: "chatml"
  path: /Users/lah-rb/.lmstudio/models/mudler/Qwen3.6-35B-A3B-APEX-GGUF/Qwen3.6-35B-A3B-APEX-I-Balanced.gguf
  n_ctx: 262144
  # MEASURED 2026-07-29 (--probe-context): 20480 B/tok vs a 81920 formula (4.00x over — swa_full:false keeps the windowed
  # layers windowed, and the formula assumes a full cache on every layer).
  kv_bytes_per_token_measured: 20480
  probe_verified_weights_bytes: 25624957632
  probe_verified_n_ctx: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  # OFF 2026-07-30. It was `true` while `resident_seq_cache` is unset (false),
  # which since the M8 blob path was deleted means the flow cache has nothing
  # to pin onto: every request took the retired branch, incremented
  # flow_fallbacks, and served from the static base. The flag read as a feature
  # and bought nothing. Config validation now warns on this combination.
  #
  # Turning it ON is gated on measuring resident FIRST. This is the GDN-hybrid
  # substrate, and both siblings measured memory_can_shift=False with the flags
  # forced on (qwen3.5-122b-a10 cell RC2; qwen3.6-27b cell F5), so the expected
  # answer is an architecture refusal — but this model has never been measured
  # and the file should not pretend either way.
  flow_kv_cache: false
  kv_unified: true
  swa_full: true
  # Qwen3.6 is an ALWAYS-ON thinking model — it emits <think>…</think> every
  # turn and cannot be suppressed. With thinking:false LLMVP tried to gate the
  # reasoning off, so the model's unseparated thinking bled into the answer
  # (observed as multiple concatenated JSON objects per turn, 34% of session
  # turns — which broke the one-object menu contract). Enable thinking so the
  # <think> span is captured/stripped and the answer parses cleanly.
  thinking: true
  # Re-prefill sessions from history (robust default; avoids the deep-session
  # save_state overflow). Sound for any model.
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # GDN-hybrid loop posture (2026-07-22, dev/qwen3_loop_research.md): same
  # substrate as qwen3-next/qwen3.5, same paragraph-orbit risk. Qwen's
  # thinking-mode profiles bracket temp 0.6 (precise coding) to 1.0
  # (general); base 0.8 sits between, floors keep flow-scaled temps out of
  # the orbit band (every profile is >= 0.6; the orbit survives 0.5).
  temperature_default: 0.8
  session_temp_floor: 0.7
  temperature_floor: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  # Presence 0.0 = the vendor "precise coding" posture; the degen retry
  # escalates to the vendor recovery recipe (temp 1.0 + presence 1.5) only
  # on an actual abort (which the coherent-orbit guard now catches again).
  presence_penalty: 0.0
  repeat_penalty: 1.0
  penalty_last_n: 2048
  # DRY REMOVED 2026-07-22 (isolation test — see qwen3-next-coder config):
  # DRY converted the catchable coherent orbit into an uncatchable
  # noise-slot structural loop that blinds the distinct-ratio guard.
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.6-35b-a3.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  status: not_yet_run
  expectation:
    registered: 2026-07-29
    tier: "2"
    stars: null
    basis: experience
    why: >
      A fast, very verbose thinker that sits consistently under the rest of the
      qwen family — though its ability to batch might keep it around the 27b.
      Expected high tier 2.

      FAMILY: the qwen hybrid architecture makes advanced features — cache strategies, instance swarming — markedly harder to adapt than a plain transformer. Applies to every qwen arm.
