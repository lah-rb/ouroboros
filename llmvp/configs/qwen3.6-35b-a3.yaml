app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  # Enables the /v1/chat/completions REST shim (for the Terminus comparison
  # run; harmless for Ouroboros, which uses GraphQL).
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.6-35b-a3"
  family: "chatml"
  path: /Users/lah-rb/.lmstudio/models/noctrex/Qwen3.6-35B-A3B-MXFP4_MOE-GGUF/Qwen3.6-35B-A3B-MXFP4_MOE_BF16.gguf
  n_ctx: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flow_kv_cache: true
  kv_unified: true
  swa_full: true
  # Qwen3.6 is an ALWAYS-ON thinking model — it emits <think>…</think> every
  # turn and cannot be suppressed. With thinking:false LLMVP tried to gate the
  # reasoning off, so the model's unseparated thinking bled into the answer
  # (observed as multiple concatenated JSON objects per turn, 34% of session
  # turns — which broke the one-object menu contract). Enable thinking so the
  # <think> span is captured/stripped and the answer parses cleanly.
  thinking: true
  # Re-prefill sessions from history (robust default; avoids the deep-session
  # save_state overflow). Sound for any model.
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # GDN-hybrid loop posture (2026-07-22, dev/qwen3_loop_research.md): same
  # substrate as qwen3-next/qwen3.5, same paragraph-orbit risk. Qwen's
  # thinking-mode profiles bracket temp 0.6 (precise coding) to 1.0
  # (general); base 0.8 sits between, floors keep flow-scaled temps out of
  # the orbit band (every profile is >= 0.6; the orbit survives 0.5).
  temperature_default: 0.8
  session_temp_floor: 0.7
  temperature_floor: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  # Presence 0.0 = the vendor "precise coding" posture; DRY below is the
  # surgical orbit-breaker, and the degen retry escalates to the vendor
  # recovery recipe (temp 1.0 + presence 1.5) only on an actual abort.
  presence_penalty: 0.0
  repeat_penalty: 1.0
  penalty_last_n: 2048
  dry_multiplier: 0.8
  dry_base: 1.75
  dry_allowed_length: 2
  dry_penalty_last_n: -1
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.6-35b-a3.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
