# Degeneration-probe variant of qwen3.5-122b-a10 — n_ctx 262144 -> 131072.
#
# WHY. At 262144 this config computes to 83.46 GiB weights + 24.0 GiB KV =
# 107.5 GiB, against an unset kv_preflight_gb (default 100). The preflight
# would REFUSE the load and the arm would waste its slot without ever
# running. 131072 gives 83.46 + 12.0 = 95.5 GiB, inside the default guard
# and 6 GiB below the largest configuration we have run stable.
#
# A paragraph-orbit degeneration probe does not need a quarter-million
# tokens of context; the orbit appeared well inside 32k historically.
# The parent config is left untouched.
#
# ── GREENFIELD TIER 2 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# 3rd of 8: the most polished shell of the finals with genuinely working
# save/load — but unwinnable (dead dialogue, inert weakness, unbeatable boss
# math). NOTE: first run caught DEGENERATION (family paragraph-orbit); this
# standing is from the clean r2 rerun under the vendor-sampling stack.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.5-122b-a10-probe"
  family: "chatml"
  path: /Users/lah-rb/.lmstudio/models/mudler/Qwen3.5-122B-A10B-APEX-GGUF/Qwen3.5-122B-A10B-APEX-I-Balanced.gguf
  n_ctx: 131072
  kv_preflight_gb: 100
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # Vendor instruct-general profile (2026-07-22, dev/qwen3_loop_research.md):
  # the Qwen3.5 card's four official profiles are all temp >= 0.6, three of
  # four with presence_penalty 1.5-2.0. Instruct-general = temp 0.7,
  # top_p 0.8, top_k 20, presence 1.5. This model produced a 32.9k-token
  # deliberation orbit (runaway capture 20260722T182421) at our old
  # temp-0.5-band settings — same GDN-hybrid substrate as qwen3-next.
  temperature_default: 0.7
  temperature_floor: 0.7
  session_temp_floor: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.00
  # Vendor's documented "endless repetitions" mitigation. Only effective
  # with the widened window below (llama.cpp windows presence at
  # penalty_last_n, unlike vLLM's whole-sequence semantics).
  presence_penalty: 1.5
  repeat_penalty: 1.0
  penalty_last_n: 2048
  # DRY REMOVED 2026-07-22 (isolation test — see qwen3-next-coder config):
  # DRY converted the catchable coherent orbit into an uncatchable
  # noise-slot structural loop that blinds the distinct-ratio guard.
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.5-122b-a10.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
