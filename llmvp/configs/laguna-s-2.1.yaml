# Laguna-S-2.1 — APEX i-quality, THINKING ON (the CoT-enabled arm).
#
# REPOINTED 2026-08-02 (operator quant consolidation): the APEX i-quality
# is the only S quant kept — the unsloth IQ4_XS this config originally
# described, the unsloth UD-Q6_K, poolside Q4_K_M and bartowski Q6_K_L are
# all deleted from disk. Their configs are archived under configs/archive/
# with their score records intact. laguna-s-2.1-apex.yaml remains the
# thinking:OFF record for this same file; THIS config is the thinking:ON
# arm (with think-hold — see the THINKING LEVERS block below).
#
# KV GEOMETRY (STALE TABLE — IQ4_XS-era, kept as history; the LIVE numbers
# are in model: below, from the APEX probe recorded in laguna-s-2.1-apex.yaml.
# Family constants still true: 192 KB/token with swa_full, sliding_window 512.)
# (GGUF headers, 2026-07-26, computed BEFORE any load — the rule
# that exists because reboot #3 was precomputable):
#   48 layers, MoE 256 experts / 10 used, kv_heads 8, k=v=128,
#   per-layer heterogeneous head_count [48,72,72,72,48,72] x8,
#   sliding_window 512, 1,048,576 trained context,
#   weights 57.6 GB (IQ4_XS, 3 shards)  ->  192 KB/token with swa_full
#
#     n_ctx    KV GB    total    vs the REAL 113 GB wired limit
#      32768     6.4     64.0    very safe
#      65536    12.9     70.5    safe
#     131072    25.8     83.3    <- THIS CONFIG, ~30 GB headroom
#     262144    51.5    109.1    over the practical ceiling
#
# The most comfortable geometry profiled on this box (gpt-oss needs 100.6 GB
# for its 524k pool; mistral-medium needs 65k just to fit).
#
# sliding_window is 512, so WITHOUT swa_full most layers would hold 512 cells
# and KV would be trivial — but batched mode REQUIRES swa_full, so 192 KB/token
# is the figure that applies.
#
# EVERYTHING HERE IS UNVALIDATED. The numbers are arithmetic from headers and
# formats/laguna.yaml is read from the chat template, not observed. Before
# trusting either: a render probe, a thinking on/off probe, and
# dev/memguard_boot_probe.sh at this n_ctx. The tekken family shipped with
# `thinking: true` LYING for weeks because nobody rendered it.

# ── THE BATCH-STRUCTURAL RAMBLE (replicated 2026-07-30, 2/2) ─────────
# On the batch structural step (`generate_all_files`, 7 files) this config
# twice produced an enormous single generation and shipped NOTHING:
#
#     run 1   60,659 tok / 1,980s / 30.6 tok/s   -> 0 files
#     run 2   50,497 tok / 1,608s / 31.4 tok/s   -> 0 files
#
# Both were killed by the 1800s timed context refresh, which is an UNDECLARED
# ceiling on generation length — nobody set it for that purpose. The cost is
# ~33 min of exclusive GPU for zero output, and the refresh also wipes the
# flow band and demotes hot snapshots, so it degrades the NEXT arm too.
#
# IT IS RAMBLING, NOT LOOPING — and that distinction is why nothing caught it.
# The full 201,583-byte text was recovered (runaway capture on eviction, added
# the same day). It emitted 10 `# === FILE:` blocks for a 7-file task with
# main.py written THREE times, 111 ```python fences, a distinct/line ratio of
# 0.623 (a clean sibling run scores 0.84), and the tell: "This is correct."
# SEVENTEEN times. It was reasoning IN THE OPEN — hand-tracing boss-phase
# invulnerability and parser tokenization in prose, then re-emitting files.
#
# `thinking: false` here and there is no reasoning span, so this deliberation
# lands in the CONTENT channel where nothing budgets or strips it, and it is
# non-repetitive — so the repetition guard and the long-cycle guard both stay
# silent through 50k tokens. No guard we have can see it.
#
# DESIGN-CONDITIONED, not random: both runaways used the same design (33 goals
# / 7 structural files) — the second was a deliberate replay of the first's
# mission state into the batch path. A different design (40 goals) completed
# cleanly in 20 min with 10 files. So the trigger is the plan, not the model
# alone. OPEN: whether the other two quants ramble on their own designs — if
# they do not, this is quant-linked; if they do, it is the batch prompt shape.
#
# RESOLVED 2026-08-02: the mechanism behind all of this is now understood —
# laguna deliberates by trained agentic prior (tool-interleave transfer),
# and with thinking suppressed the deliberation lands untagged in CONTENT
# (the bartowski Q6_K_L dissections, configs/archive/). Answered: NOT
# quant-linked. The levers landed: no-execution-environment batch clause +
# salvage-on-abort (e59eb9e), polite refresh (f3e71fc), and THINKING ON
# with think-hold in this config — CoT now has a sanctioned channel that
# the budget/strip machinery can see, instead of leaking into content.

app:
  host: 0.0.0.0
  port: 8008
  log_level: info
  cors_origins:
  - '*'
  backend_timeout: 180
  openai_shim: true
graphql:
  max_query_depth: 10
  max_tokens: 234496
  max_aliases: 50
  introspection_enabled: true
model:
  name: Laguna-S-2.1
  family: laguna
  # QUANT CONSOLIDATION (operator, 2026-08-02): the APEX i-quality is the
  # only S quant kept (relatively balanced size/quality); the unsloth
  # IQ4_XS/UD-Q6_K, poolside Q4_K_M and bartowski Q6_K_L files are deleted
  # from disk. This base config now points at the APEX file with the APEX
  # measured geometry (probe run recorded in laguna-s-2.1-apex.yaml, which
  # remains as the thinking:off score record for the same file).
  path: /Users/lah-rb/.lmstudio/models/Myric/Laguna-S-2.1-APEX-GGUF/Laguna-S-2.1-APEX-i-quality.gguf
  n_ctx: 234496
  probe_verified_weights_bytes: 73932208768
  probe_verified_n_ctx: 234496
  kv_preflight_gb: 92
  model_max_context: 1048576
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  # ── THINKING LEVERS ───────────────────────────────────────────
  # THINKING ON (operator, 2026-08-02): the reasoning channel is enabled
  # via the new THINK-HOLD (formats/laguna.yaml force_open_hold_tokens 10,
  # inference/think_hold.py) — the S family shows the same advisory-opener
  # behavior as XS (closes the prefilled <think> under the agent persona;
  # one deflected close attempt yields clean, correct CoT). History: a
  # 2026-07-26 thinking-on attempt on the unsloth quant circled CoT to the
  # token cap (133k/125k chars, never closed) — that was pre-top_k-fix and
  # pre-hold, on a different quant; this run is the re-examination. If
  # circling recurs, the fork's reasoning_budget sampler is the next lever
  # (needs reasoning_start_in_prompt=True for prefill families).
  thinking_available: true
  thinking: "on"
  swa_full: true
  kv_unified: true
  flow_kv_cache: false
  session_full_replay: true
  resident_seq_cache: true
  context_refresh_drain_s: 300
prompt:
  persona_file: ./knowledge/SOUL.md
generation:
  # 32768 -> 65536 (2026-07-27). The old cap was set to bound runaway damage,
  # but the poolside run showed it also CUT LEGITIMATE WORK: the batch
  # structural step declared 12 files and was severed mid-fence inside
  # combat.py, and truncation was being read as success because the slice
  # counts what survived the cut, not what the model set out to write.
  #
  # NOT raised to n_ctx (131072) the way the poolside/APEX configs are. Those
  # sit at 65536 n_ctx, so "cap == window" bounds a runaway at 65536 either
  # way. Here the window is twice as large, and unsloth is the build whose
  # known failure mode IS runaway generation (two >100k-char pure-CoT episodes
  # that never emitted an answer). Matching the other arms' 65536 removes the
  # truncation defect while keeping the blast radius identical to theirs.
  max_tokens_default: 234496
  temperature_default: 1.0
  top_p: 1.0
  # VENDOR-MATCHED (generation_config.json, unsloth/Laguna-S-2.1): temperature
  # 1.0 and top_p 1.0 ARE correct for this model, but top_k is 20 — NOT 0.
  # top_k: 0 disables truncation entirely, so at temperature 1.0 the full
  # distribution tail is sampled. That value was inherited from the gpt-oss
  # config, where it is right (harmony wants unconstrained sampling at t=1.0)
  # and here it produced a 24,000-token thinking ramble on the first agent
  # design step (2026-07-26). formats/laguna.yaml already had top_k: 20; the
  # config silently overrode it.
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  # Vendor sets no repetition_penalty (i.e. 1.0); 1.05 also came from gpt-oss.
  repeat_penalty: 1.0
  # ARM C: ban laguna's native <tool_call> token (id 25). It emits tool calls
  # in ~20-40% of turns with NO tool syntax anywhere in the prompt and against
  # an explicit prohibition in SOUL.md; we do not support per-model tool
  # protocols, so those turns produce nothing usable.
  #
  # Token-19 (</think>) ban DROPPED 2026-08-02: thinking is ON now, and a
  # standing ban would fight both the model's own close AND the think-hold
  # mechanism (which bans 19 for only the first 10 tokens, then lets the
  # model close naturally). The old ban existed solely for thinking-off
  # separator-reproduction (see laguna-s-2.1-apex.yaml for that history).
  logit_bias: {25: -100.0}
  # REASONING BUDGET (2026-08-02, added after the first thinking turn):
  # think-hold got the model INTO genuine CoT, but the first design turn
  # then couldn't STOP — 89.5k chars of in-channel thought, zero </think>,
  # a ~3KB "this looks correct, now let me re-check X" cycle, guard-killed
  # at 24.5k tokens (the 2026-07-26 circling regression, now visible
  # inside the channel). The fork's budget sampler forces </think> at the
  # cap so the thought-so-far is KEPT and an answer follows.
  # start_in_prompt is REQUIRED here: laguna's opener is prefilled, so the
  # counter must start at token 0 (without it the sampler idles waiting
  # for <think> and the budget never applies).
  reasoning_budget: 8192
  reasoning_start: "<think>"
  reasoning_end: "</think>"
  reasoning_start_in_prompt: true
  session_temp_floor: 0.35
  streaming_default: true
knowledge:
  # MUST be regenerated for this model — knowledge is PRE-TOKENIZED, and
  # laguna uses a gpt2 tokenizer (vocab 100352) while gpt-oss uses harmony.
  # Feeding another model's tokens.bin is silent garbage, not an error.
  tokens_bin: ./data/laguna-s-2.1.tokens.bin
  token_limit: 32768
resources:
  decode_mode: batched
  cpu_threads: 15
  jit_concurrency_limit: null
tools:
  enabled: false
  max_iterations: 3
logging:
  enabled: true
  directory: ./logs

# ── TIER (doc-only) ──────────────────────────────────────────────────
