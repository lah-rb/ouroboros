# ── GREENFIELD TIER 1 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# UNANIMOUS CHAMPION of the 8-model blind panel: the only fully playable AND
# winnable artifact (both win paths verified live; real two-phase boss; honest
# defeat screen). Achieved with almost NO functional-phase checks — its run
# counter read 8/15, worst-looking of the finalists. Lone artifact flaw: save
# unwired (get_state undefined). Promotion candidate for boss/worker roles.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  # Enables the /v1/chat/completions REST shim (for the Terminus comparison
  # run; harmless for Ouroboros, which uses GraphQL).
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "step37-flash-196b-a11"
  family: "chatml"
  thinking: true
  thinking_mode: medium   # reasoning effort → "Reasoning: medium" system line

  path: /Users/lah-rb/.lmstudio/models/stepfun-ai/Step-3.7-Flash-GGUF/Step-3.7-flash-IQ4_XS-00001-of-00003.gguf
  # GEOMETRY (2026-07-24 header math): 180KB/token full-KV (45L x 8kvh x
  # 256d) on 105GB IQ4_XS weights — with swa_full the ABSOLUTE ceiling is
  # ~43k n_ctx at the 113.3GB wired limit. 32768 = 111GB total: nearly
  # right-sized, lives above the 100GB tripwire convention by design
  # (boot with OURO_KV_PREFLIGHT_GB=112). Full trained context (262144)
  # is reachable only with swa_full: false (window 512), at the cost of
  # resident-session soundness.
  n_ctx: 32768
  # Trained per-stream range (the swarm/model context split).
  model_max_context: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flow_kv_cache: false
  session_full_replay: true
  kv_unified: true
  swa_full: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 32768
  temperature_default: 0.6 # try 1.0 at some point
  # Degeneration fix (matches qwen3.6): step37 collapses to bare `<think>`
  # then empties at the low effective temps from t*0.1/t*0.2 steps
  # (0.6*0.1=0.06). Floor clamps every completion to 0.4; session floor
  # protects deep run_session turns. Without these step37 retried ~30x/run.
  session_temp_floor: 0.5
  temperature_floor: 0.4
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: true

knowledge:
  tokens_bin: "./data/step37-flash-196b-a11.yaml.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
