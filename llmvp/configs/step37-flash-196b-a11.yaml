# ── GREENFIELD TIER 1 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# UNANIMOUS CHAMPION of the 8-model blind panel: the only fully playable AND
# winnable artifact (both win paths verified live; real two-phase boss; honest
# defeat screen). Achieved with almost NO functional-phase checks — its run
# counter read 8/15, worst-looking of the finalists. Lone artifact flaw: save
# unwired (get_state undefined). Promotion candidate for boss/worker roles.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  # Enables the /v1/chat/completions REST shim (for the Terminus comparison
  # run; harmless for Ouroboros, which uses GraphQL).
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 138240
  max_aliases: 50
  introspection_enabled: true

model:
  name: "step37-flash-196b-a11"
  family: "chatml"
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # the family EXCEPTION (operator): per_request — the probe-measured gate (low omits the opener) + Reasoning-line depth dial IS its adaptive serving, correct before the redesign. Unrouted -> Reasoning: low, no opener; cue-flipped steps think at depth
  thinking_available: true
  thinking: "per_request"
  # ADAPTIVE THINKING (wired 2026-07-25, dev/step37_reasoning_probe.py):
  # thinking is prefill-GATED (router low omits the <think> opener via
  # chatml gate_levels) and the Reasoning line is the depth dial inside
  # an opened block. Ouroboros->step level collapse lives in
  # formats/chatml.yaml reasoning.levels (low=off, medium=step-low,
  # high=step-high). thinking_mode: medium = the default head renders
  # step-low; only the `high` head needs an extra pin.
  thinking_mode: medium
  reasoning_head_swap: true
  # Required by the head swap AND the per-turn session splice path
  # (silent no-op without it).
  #
  # OFF as of 2026-07-29 — this model CANNOT HAVE IT and asking costs a full
  # context build. The boot log is explicit:
  #
  #   🧩 resident_seq_cache requested but memory_can_shift=False
  #      (interleaved-SWA without swa_full, or recurrent memory)
  #   🧩 un-fragmenting: context was allocated with the resident seq band
  #      (n_seq_max=14) — rebuilding single-seq
  #   ggml_metal_free: deallocating
  #
  # So every boot allocated the 14-seq context, freed it, and rebuilt
  # single-seq. Harmless but not free, and the config read as though it got a
  # feature it never received. It also cost a day of analysis: the probe summed
  # both KV allocations and reported 360 KiB/token against a 180 KiB formula,
  # which looked like an architecture whose geometry we could not predict.
  #
  # NOTE this means reasoning_head_swap and the per-turn session splice above
  # are ALSO not getting what they declare they need — that dependency is real
  # and is deferred deliberately, not resolved by flipping this to false.
  resident_seq_cache: false

  path: /Users/lah-rb/.lmstudio/models/unsloth/Step-3.7-Flash-GGUF/Step-3.7-Flash-UD-IQ4_XS-00001-of-00003.gguf
  # GEOMETRY (2026-07-24 header math): 180KB/token full-KV (45L x 8kvh x
  # 256d) on 105GB IQ4_XS weights — with swa_full the ABSOLUTE ceiling is
  # ~43k n_ctx at the 113.3GB wired limit. 32768 = 111GB total: nearly
  # right-sized, lives above the 100GB tripwire convention by design.
  # Full trained context (262144) is reachable only with swa_full: false
  # (window 512), at the cost of resident-session soundness.
  # LOWERED 138240 -> 128000 on 2026-08-03. The 138240 was the measured
  # ceiling on 2026-07-29 and it was honest then — the weights never
  # changed (the stamp below still matches to the byte). THE BINARY
  # CHANGED: on b10243 this config OOM'd in the fleet smoke with
  # kIOGPUCommandBufferCallbackErrorOutOfMemory, and the re-probe found
  # 4.2GB of overhead above the formula that was not there before, moving
  # the ceiling 138240 -> 133120. This is the cleanest evidence we have
  # that a HARDWARE CEILING MOVES WITH THE BINARY, independent of model,
  # quant or config.
  #
  # 128000 rather than the 133120 ceiling, deliberately: this config's
  # previous setting WAS its ceiling exactly, and that is precisely why a
  # binary bump broke it outright instead of merely tightening it. 128000
  # passed at the lowest peak of any passing rung and leaves the margin
  # that a ceiling-hugging setting does not. 130048 also passed if the
  # extra 2k is ever wanted.
  #   ladder: 133120 PASS · 143360/138240/133120 refused once overhead was
  #           known · 128000 PASS · 130048 PASS · 132096 refused
  # KV 180 KiB/token x 128000 = 23.6GB + 95.3GB weights = 118.9GB.
  n_ctx: 128000
  probe_verified_weights_bytes: 95336010208
  probe_verified_n_ctx: 133120
  # Declared, not left to a launch-time env var. Until 2026-07-25 the
  # preflight measured only shard 1 of this 3-shard GGUF (46.5GB of 105GB),
  # so it computed 52.5GB and waved the config through — it passed the 100GB
  # default by ACCIDENT, not by fitting. With the shard sum fixed the real
  # 111.0GB is visible and needs a budget that admits it.
  kv_preflight_gb: 112
  # Trained per-stream range (the swarm/model context split).
  model_max_context: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flow_kv_cache: false
  session_full_replay: true
  kv_unified: true
  swa_full: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 138240
  temperature_default: 0.6 # try 1.0 at some point
  # Degeneration fix (matches qwen3.6): step37 collapses to bare `<think>`
  # then empties at the low effective temps from t*0.1/t*0.2 steps
  # (0.6*0.1=0.06). Floor clamps every completion to 0.4; session floor
  # protects deep run_session turns. Without these step37 retried ~30x/run.
  session_temp_floor: 0.5
  temperature_floor: 0.4
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: true

knowledge:
  tokens_bin: "./data/step37-flash-196b-a11.yaml.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  league: contemplator  # LOAD-BEARING — agent/tier/runner.py:config_league
  status: recorded  # history: llmvp/configs/archive/TIER_JUDGEMENTS.md
