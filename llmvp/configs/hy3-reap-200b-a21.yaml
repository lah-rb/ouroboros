# Hunyuan-3 REAP 200B-A21B (OpenMOSE IQ4_XS) — the largest model run here.
# A REAP prune of Tencent's Hy3 295B-A21B: expert count cut, active params kept.
#
# ── IT RUNS. MY ARITHMETIC SAID IT COULD NOT. ────────────────────────
# This header previously read "THIS CONFIG CANNOT BOOT AS WRITTEN". That was
# wrong, and the ladder (dev/hy3_ceiling_ladder.sh, 2026-07-28) proved it by
# loading and generating correct code at every rung tried:
#
#   n_ctx    KV allocated   bytes/token   weights+KV    result
#    2048        640 MiB      327,680      109.0 GB      OK
#    4096      1,280 MiB      327,680      109.6 GB      OK
#    8192      2,560 MiB      327,680      111.0 GB      OK
#   16384      5,120 MiB      327,680      113.7 GB      OK
#   24576      7,680 MiB      327,680      116.4 GB      OK  <- ABOVE the cap
#
# WHAT WAS RIGHT: the KV formula. Measured 327,680 B/token against a predicted
# 331,776 — a 0.988 ratio. Unlike gemma-4 there is no interleaved-SWA
# over-prediction to correct, so kv_bytes_per_token_measured is unnecessary
# here; the headers tell the truth for this architecture.
#
# WHAT WAS WRONG: treating iogpu.wired_limit_mb as a hard allocation ceiling.
# It bounds how much may be WIRED, not how much may be allocated. 24576 tokens
# computes to 116.4 GB against a 116 GB cap and served fine. A related
# observation from the wired-memory recorder: at idle the server shows ~2.5 GB
# wired against ~105 GB RSS — weights are not wired until Metal actually
# decodes, so load-time totals are not the number that matters.
#
# THE REAL CEILING IS STILL UNKNOWN, because the last rung passed. Everything
# above 24576 is unmeasured. Run the ladder further with
# dev/wired_mem_recorder.py alongside — it fsyncs every sample, so the last
# line survives a machine that does not.
#
# ── WHAT STILL LIMITS IT ─────────────────────────────────────────────
# Context, not memory. The batch structural turn is a ~5k prompt plus a
# 13,000-18,000 token generation (measured on laguna and qwen), and the static
# prefix is ~1.8k. At 24576 that fits ONE such turn with nothing spare, and
# under decode_mode: batched n_ctx budgets the SUM of live streams — which is
# why this config runs pool. Wiring type_k/type_v (exposed by the binding,
# unused by ModelConfig) would take KV to ~91 KiB/token at q4_0 and is a
# fleet-wide win worth having on its own merits.
#
# ── FAMILY ───────────────────────────────────────────────────────────
# formats/hunyuan3.yaml, written from this GGUF's own template. The first live
# generation exposed a real extraction bug — the `:opensource` suffix on the
# think tags leaked into CONTENT (`:opensource>def reverse_string(s)`, a
# SyntaxError as line 1). Fixed in core/fsm_labeller.py by deriving the tag
# tail from the spec; see TestSuffixedThinkTags.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 16384
  max_aliases: 50
  introspection_enabled: true

model:
  name: "hy3-reap-200b-a21"
  family: "hunyuan3"
  path: /Users/lah-rb/.lmstudio/models/OpenMOSE/Hy3-REAP-200B-21B-GGUF/Hy3-REAP-200B-GGUF-IQ4_XS-00001-of-00006.gguf
  # 32768 — the highest MEASURED-DECODABLE rung. Above this the model still
  # LOADS and reports healthy, then fails every decode with llama_decode -3
  # (49152 and 65536 both), and at 81920 the load itself rebooted the machine.
  # See the header for the full ladder.
  n_ctx: 32768
  # Trained range is 262144. Recorded because it is the model's real capability
  # and the gap to n_ctx is the whole story here.
  model_max_context: 262144
  # 122 admits 32768 (119.0 GB measured) and refuses the next step up. The
  # ladder raised this per rung to climb; that is exactly how the 81920 load
  # got through and rebooted the box. Do not raise it to make a load succeed.
  kv_preflight_gb: 122
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: false
  # thinking_mode is UNSET, deliberately. Our vocabulary (high/low/medium/none)
  # does not map onto Tencent's (no_think/low/high) — see the OPEN GAP note in
  # formats/hunyuan3.yaml. Unset makes the renderer fall back to the family's
  # reasoning_default, which is the literal `no_think` the template expects.
  # Setting it to `none` here would render `reasoning_effort:none`, which the
  # model's own template raises on.
  swa_full: false          # dense attention, 81 layers — no SWA to make full
  kv_unified: false
  session_full_replay: true
  resident_seq_cache: false

prompt:
  system_prompt: "You are a helpful assistant."

generation:
  max_tokens_default: 16384
  # Tencent's own (model card, 2026-07-28): temperature 0.9, top_p 1.0. Well
  # outside this fleet's usual 0.6-0.7 / 0.8-0.95 band — top_p 1.0 leaves the
  # distribution untruncated at a high temperature. Deliberately NOT normalised
  # toward the house style; on a REAP-pruned MoE the vendor's operating point is
  # the only calibrated reference available. top_k 0 = disabled, because the
  # card specifies none and 20 would truncate what 1.0 keeps.
  temperature_default: 0.9
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  # Both guards armed (null => enabled). Non-negotiable for a first run on a
  # pruned MoE — REAP's documented failure mode is agent decay, and the
  # long-cycle guard is what catches a paragraph-scale orbit at ~2k tokens with
  # the specimen dumped instead of at 49k with nothing.
  repetition_guard_enabled: null
  long_cycle_guard_enabled: null

knowledge:
  tokens_bin: ./data/hy3-reap-200b-a21.tokens.bin
  token_limit: 8192

resources:
  decode_mode: pool
  cpu_threads: 16

logging:
  enabled: true
  directory: ./logs
