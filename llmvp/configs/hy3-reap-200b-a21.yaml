# Hunyuan-3 REAP 200B-A21B (OpenMOSE IQ4_XS) — the largest model run here.
# A REAP prune of Tencent's Hy3 295B-A21B: expert count cut, active params kept.
#
# ── IT RUNS. MY ARITHMETIC SAID IT COULD NOT. ────────────────────────
# This header previously read "THIS CONFIG CANNOT BOOT AS WRITTEN". That was
# wrong, and the ladder (dev/hy3_ceiling_ladder.sh, 2026-07-28) proved it by
# loading and generating correct code at every rung tried:
#
#   n_ctx    KV allocated   bytes/token   weights+KV    result
#    2048        640 MiB      327,680      109.0 GB      OK
#    4096      1,280 MiB      327,680      109.6 GB      OK
#    8192      2,560 MiB      327,680      111.0 GB      OK
#   16384      5,120 MiB      327,680      113.7 GB      OK
#   24576      7,680 MiB      327,680      116.4 GB      OK  <- ABOVE the cap
#
# WHAT WAS RIGHT: the KV formula. Measured 327,680 B/token against a predicted
# 331,776 — a 0.988 ratio. Unlike gemma-4 there is no interleaved-SWA
# over-prediction to correct, so kv_bytes_per_token_measured is unnecessary
# here; the headers tell the truth for this architecture.
#
# WHAT WAS WRONG: treating iogpu.wired_limit_mb as a hard allocation ceiling.
# It bounds how much may be WIRED, not how much may be allocated. 24576 tokens
# computes to 116.4 GB against a 116 GB cap and served fine. A related
# observation from the wired-memory recorder: at idle the server shows ~2.5 GB
# wired against ~105 GB RSS — weights are not wired until Metal actually
# decodes, so load-time totals are not the number that matters.
#
# THE REAL CEILING IS STILL UNKNOWN, because the last rung passed. Everything
# above 24576 is unmeasured. Run the ladder further with
# dev/wired_mem_recorder.py alongside — it fsyncs every sample, so the last
# line survives a machine that does not.
#
# ── WHAT STILL LIMITS IT ─────────────────────────────────────────────
# Context, not memory. The batch structural turn is a ~5k prompt plus a
# 13,000-18,000 token generation (measured on laguna and qwen), and the static
# prefix is ~1.8k. At 24576 that fits ONE such turn with nothing spare, and
# under decode_mode: batched n_ctx budgets the SUM of live streams — which is
# why this config runs pool. Wiring type_k/type_v (exposed by the binding,
# unused by ModelConfig) would take KV to ~91 KiB/token at q4_0 and is a
# fleet-wide win worth having on its own merits.
#
# ── FAMILY ───────────────────────────────────────────────────────────
# formats/hunyuan3.yaml, written from this GGUF's own template. The first live
# generation exposed a real extraction bug — the `:opensource` suffix on the
# think tags leaked into CONTENT (`:opensource>def reverse_string(s)`, a
# SyntaxError as line 1). Fixed in core/fsm_labeller.py by deriving the tag
# tail from the spec; see TestSuffixedThinkTags.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "hy3-reap-200b-a21"
  family: "hunyuan3"
  path: /Users/lah-rb/.lmstudio/models/OpenMOSE/Hy3-REAP-200B-21B-GGUF/Hy3-REAP-200B-GGUF-IQ4_XS-00001-of-00006.gguf
  # 32768 by CHOICE, not by ceiling: 36864 is measured-decodable (below) and
  # the extra 12.5% buys nothing real — a batch structural turn is a ~5k
  # prompt plus a 13-18k generation, so one turn fits at either value and two
  # fit at neither. 32768 keeps ~1.2GB more headroom for the same capability.
  # (The older note here — "above this the model still LOADS and reports
  # healthy, then fails every decode with llama_decode -3 (49152 and 65536)"
  # — remains true of those rungs; the boundary is just further out than
  # 32768. At 81920 the load itself rebooted the machine.)
  n_ctx: 32768
  probe_verified_weights_bytes: 108278458240
  # MEASURED 2026-07-30 (run ctx_probe_20260730-125646): 36864 loads and
  # decodes 3/3 at 123.6GB peak wired. GUARD-BOUND — every failing rung was
  # an arithmetic refusal at the probe's 0.90-of-physical ceiling, so this is
  # a LOWER bound; the hardware boundary was never reached.
  #
  # A 26624 was briefly written here the same day and RETRACTED: it came from
  # a probe clamped to `iogpu.wired_limit_mb`, which is not a ceiling. Three
  # passing measurements cross it — 116.4GB (2026-07-28 ladder), 121.7GB and
  # 123.6GB (this probe) — against a 121.6GB "limit". PHYSICAL memory is what
  # kills this box; both recorded hard reboots ran it out of RAM outright.
  probe_verified_n_ctx: 36864
  # Trained range is 262144. Recorded because it is the model's real capability
  # and the gap to n_ctx is the whole story here.
  model_max_context: 262144
  # 122 admits 32768 (119.0 GB measured) and refuses the next step up. The
  # ladder raised this per rung to climb; that is exactly how the 81920 load
  # got through and rebooted the box. Do not raise it to make a load succeed.
  kv_preflight_gb: 122
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: false
  # thinking_mode is UNSET, deliberately. Our vocabulary (high/low/medium/none)
  # does not map onto Tencent's (no_think/low/high) — see the OPEN GAP note in
  # formats/hunyuan3.yaml. Unset makes the renderer fall back to the family's
  # reasoning_default, which is the literal `no_think` the template expects.
  # Setting it to `none` here would render `reasoning_effort:none`, which the
  # model's own template raises on.
  swa_full: false          # dense attention, 81 layers — no SWA to make full
  # FLIPPED 2026-07-30 per run cells_20260729-232251 (dev/caching/EXPERIMENT.md §Results): D2 = resident+unified is the
  # recipe — full 32,768 window (no /12 band division), flat ~1141 tok/turn
  # fresh, needle intact at depth 16. The sweep's decode failure was the
  # band division (32768/12=2730 < static 1793), NOT this model.
  kv_unified: true
  session_full_replay: true
  # FLIPPED 2026-07-30: replay cost 1,004.4s prefill per 16-turn realistic
  # session (17 min!) vs 129.4s resident = 7.8x. Slowest-prefill model in
  # the fleet = biggest absolute win (~875s/session). NOTE: prefill TIME
  # rises 6.2->9.7s/turn at flat token deltas — dense attention-depth tax;
  # token-flat is not time-flat on this architecture.
  resident_seq_cache: true
  # ADDED 2026-07-30: the stateless flow cache (M9 seq-ops band). Measured
  # on glm at realistic head sizes: HIT saves 3.51s/call = 49% of prefill
  # (corrected pilot, 11/11 hits). The 2026-06 ban hit the M8 save_state
  # BLOB implementation; this band shares none of that mechanism. Under
  # kv_unified the band divides nothing.
  flow_kv_cache: true

prompt:
  # WITHOUT THIS the static token buffer never builds. resolve_persona("default")
  # constructs PersonaConfig(persona_file=prompt.persona_file, ...) and an unset
  # value fails validation, so the server logs "Could not load static tokens"
  # and falls back to lightweight mode with NO system block at all.
  #
  # That is not cosmetic: the system block is where this family's reasoning dial
  # lives (<｜reasoning_mode:opensource｜>reasoning_effort:no_think). Without it
  # the model thought when the config said not to, spent all 1,200 tokens of its
  # budget deliberating, never closed the block, and returned empty content —
  # which read as three separate bugs before the cause was found (2026-07-28).
  persona_file: "./knowledge/SOUL.md"
  system_prompt: "You are a helpful assistant."

generation:
  max_tokens_default: 32768
  # Tencent's own (model card, 2026-07-28): temperature 0.9, top_p 1.0. Well
  # outside this fleet's usual 0.6-0.7 / 0.8-0.95 band — top_p 1.0 leaves the
  # distribution untruncated at a high temperature. Deliberately NOT normalised
  # toward the house style; on a REAP-pruned MoE the vendor's operating point is
  # the only calibrated reference available. top_k 0 = disabled, because the
  # card specifies none and 20 would truncate what 1.0 keeps.
  temperature_default: 0.9
  top_p: 1.0
  top_k: 0
  min_p: 0.0
  # Both guards armed (null => enabled). Non-negotiable for a first run on a
  # pruned MoE — REAP's documented failure mode is agent decay, and the
  # long-cycle guard is what catches a paragraph-scale orbit at ~2k tokens with
  # the specimen dumped instead of at 49k with nothing.
  repetition_guard_enabled: null
  long_cycle_guard_enabled: null

knowledge:
  tokens_bin: ./data/hy3-reap-200b-a21.tokens.bin
  token_limit: 8192

resources:
  decode_mode: pool
  cpu_threads: 16

logging:
  enabled: true
  directory: ./logs

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  status: judged
  expectation:
    registered: 2026-07-29
    tier: "1?"
    stars: null
    basis: experimental
    why: >
      EXPERIMENTAL, and the widest error bar in the field. IF the REAP prune did
      not severely damage model competence this should be the strongest model
      here. Tempering that: limited context, forced non-thinking, low speed,
      immature llama.cpp support, and REAP pedigree.
  result:
    judged: 2026-07-29
    run: tier_20260729-172119/staged/arm01
    # SCORED UNDER v1.1 AND NOT RECOMPUTED (operator decision 2026-07-29). v1.2
    # landed hours later and is the first amendment that moves scores: replayed
    # on these three ledgers it gives 3.1 = 7/5/9 instead of 0/0/6, totals
    # 58/53/62, median 58. Star band (3) and tier (1) are unchanged either way —
    # v1.2 only makes the tier unanimous instead of 2-of-3 — so nothing here is
    # misleading, but do not compare this 51 against a v1.2 number directly.
    rubric: TIER_RUBRIC v1.1
    v12_replay: {dim_3_1: [7, 5, 9], totals: [58, 53, 62], median: 58, stars: 3, tier: 1}
    judge_model: "claude-opus-5[1m]"
    stars: 3
    score: 51          # MEDIAN of three independent votes
    votes: [48, 51, 59]
    tier: 1            # 2-of-3 (48 = tier 2 side; 51 and 59 = tier 1 side)
    expectation: HIT
    # A FOURTH vote (54) was DISCARDED, not averaged in. The rubric's changelog
    # was shipping judges a past arm's exact total ("judged under v1.0 at
    # 54/100"), an anchor §6 deliberately dropped — and that vote returned
    # precisely 54. Coincidence and anchoring are indistinguishable from
    # outside, so the vote was voided and the packet builder fixed (it now
    # redacts score citations and scans the FINAL text for them). The same
    # packet also carried `Arm D-120b-a5-swarm-524k`: redact() replaced the
    # model head and left the config tail, which the identifier scan cannot
    # catch because the tail is not itself a listed token. Both fixed before
    # the three votes above were dispatched.
    verdict: >
      THE FIRST WINNABLE ARTIFACT OF THE CAMPAIGN. All three judges completed
      the game independently — full route to the Throne of Bone, both boss
      phases, the charm weakness firing, the victory screen — and all three also
      reached the defeat screen. Three of the four previously judged artifacts
      shipped a complete authored world that play could not reach; this one can
      be finished. Conformance 49-51 of 53.
      WHAT HELD IT AT 3-STAR IS ONE REPEATED SHAPE, not breadth of failure:
      everything is built and wired at all but one seam. `room_changes` is
      designed, populated, serialised AND deserialised, then never applied — so
      every resume duplicates carried items and destroys dropped ones. `quit` is
      in the enum, the verb map, the help text, the title screen and main.py's
      outcome branch — everything except one `elif` in dispatch, so the first
      command a player tries answers "Unknown command." and EOF is the only exit.
      `_look` is DEFINED TWICE in engine.py and the shadowed first copy is the
      better one — it printed `Exits:`, so the artifact's worst usability gap was
      written and then buried in the same file. The third promised monster is
      orphaned by a `Monster.room_id` the engine never reads (it fights correctly
      the instant a room names it). Name matching is implemented in five places
      and dead in all five because the caller passes `args[0]` and every name in
      the world is two words — the game refuses the names it prints.
      Robustness was the standout (8-9): ten malformed saves, 500-char input,
      emoji, shell metacharacters, three kinds of EOF — no traceback, no hang.
      Documentation was capped at 2-3 by five contradicted claims, worst being
      pyproject.toml asserting "PyYAML is used via the built-in yaml module
      (Python stdlib)" with requires = [] — in a clean venv it will not start.
    # ── PERFORMANCE (from the trace registers, not the server log) ──
    perf:
      wall_min: 130
      goals: "16/38 complete (paused at the 2h backstop)"
      files: 15
      py_fail: 0
      degenerations: 0
      decode_tok_s: "19.6-25.7 (slowest in the fleet)"
      prefill_s_of_wall: "2121 of 3486 = 60.8%"
      cache_hit_pct: 33.4
      cot_pct: 0.0        # first run under the new CoT-split metric
      cot_coverage: 0.0   # measured zero, not an absent measurement
    # ── HANDICAPS PRESENT IN THIS RUN (score is NOT clean) ──
    handicaps: >
      1. QUADRATIC SESSION COST. This arm ran full_replay (resident_seq_cache
      false), so every PTY turn re-prefilled the whole session. The worst
      diagnose_issue session spent 553s of prefill against 33s of decode (94.4%)
      and its 10th turn cost 93.2s of prefill for 28 tokens. Prefill was 60.8% of
      run wall and goal throughput fell ~5x between the first and second half
      hour. Peak context use was 16,066 of 32,768 (49%), so the halved per-seq
      window resident would need was never approached — see
      dev/CACHE_SWEEP_PLAN.md. A re-run with resident enabled is owed and this
      score is the BASELINE arm of that A/B.
      2. TRANSIENT-FLUSH CONTAMINATION (OPEN_TASKS 11d). The architecture
      declared transient_files ['save.json', '*.autosave.json']; the built code
      writes game_state.json, so the flush no-oped 22/22 times and 91% of
      play-tests resumed MID-GAME at an arbitrary room. One such eval resumed in
      Quiet Shrine, tried `go north` (invalid there), got the CORRECT refusal and
      filed a parser-failure report whose own summary states "the shrine only
      connects south". That false failure consumed 3 goal attempts and triggered
      the 586s diagnosis above, which concluded the code was fine.
      3. THE CONTAMINATION LEFT A MARK IN THE ARTIFACT. Two places in the tree
      carry a guard commented "so a `go <dir>` command can succeed and be
      observed by the harness" — harness-aware code written in response to our
      false failure. ALL THREE judges found it independently and flagged it
      unprompted; one called it the clearest statement of intent in the tree.
      The guarded code is unreachable (no room has zero connections).
    # ── INSTRUMENT FINDINGS (candidates for TIER_RUBRIC v1.2) ──
    instrument: >
      THE 3.1 FLOOR DESTROYS INFORMATION. Two of three votes floored 3.1 at 0/20
      and both said so unprompted: one summed to exactly -20 across nine root
      causes, the other to -24. A game that can be WON scores the same 0 as a
      program that never starts. Report the raw sum beside the floored score.
      THE PASS-LOCK BIASES HIGH. Vote 2 disclosed that its locked 6 was "the most
      generous defensible number": pass 1 characterised the save bug as item
      destruction (SILENT-WRONG, -4) and pass 2 revealed duplication, which is
      the rubric's own INVALIDATING wording (-6), and it declined to revise per
      section 9.1. It also left two confirmed-orphaned content rows unbilled for
      the same reason. Honouring the lock is correct; the rubric should say that
      a pass-2 recharacterisation gets RECORDED as a disclosure and that rejudges
      are told to expect it, which is exactly what this judge did unprompted.

