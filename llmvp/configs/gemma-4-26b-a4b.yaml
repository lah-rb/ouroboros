# Gemma-4 26B-A4B (unsloth UD-QAT) — the FIRST MoE gemma in the fleet.
#
# gemma-4-31b is dense; this one is 128 experts with 8 active, 4B live params on
# 26B total, at 14.2 GB. That makes it the cheapest model here by weights and a
# natural tournament entrant.
#
# ── KV IS MEASURED NOW, AND THE FORMULA WAS 22x OUT ──────────────────
# The header formula gives 480 KiB/token (30 layers x 8 kv-heads x 512 head-dim).
# The real figure is 21.2 KiB/token — 22.59x smaller — measured 2026-07-29 by
# `--probe-context`. gemma-4 interleaves sliding-window and full attention, the
# formula assumes swa_full gives every layer a full-size cache, and this config
# runs swa_full:false so the windowed layers stay windowed.
#
#   n_ctx     formula KV    MEASURED KV    weights+KV
#    65536       32.2 GB         1.4 GB       15.6 GB   (the old config value)
#   131072       64.4 GB         2.9 GB       17.1 GB
#   262144      128.7 GB         5.7 GB       19.9 GB   <- FULL TRAINED RANGE
#
# So nothing about memory constrains this model: its entire trained range costs
# 5.7 GB of KV on a 137 GB box. It was configured at a quarter of that against
# an estimate that was wrong by more than an order of magnitude.
#
# FAMILY: gemma, unchanged. The FSM treats gemma as NONE-shape via an explicit
# override (its template pre-supplies an empty closed thought block, so
# generation is pure content from the first token) — that is about the template,
# not the parameter count, so it carries over to the MoE unchanged.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "gemma-4-26b-a4b"
  family: "gemma"
  path: /Users/lah-rb/.lmstudio/models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
  # RAISED 65536 -> 262144 on 2026-07-29 from the measured ceiling
  # (probe_verified_n_ctx below). KV 21 KiB/token x 262144 = 5.7GB
  # + 14.2GB weights = 20.0GB resident at boot.
  # 262,144 surrendered for the flat session path — the nominal range cost
  # 271.7s/session of re-reading to actually exploit (B09).
  n_ctx: 65536
  probe_verified_n_ctx: 262144
  # RE-MEASURED 2026-07-30 under the FLIPPED flags (swa_full:true +
  # resident + kv_unified): 225280 B/tok (56320 MiB live KV at 262144,
  # --probe-context run ctx_probe_20260730-124104). The prior 21754 was
  # measured under swa_full:false — the measured-under-other-flags class;
  # the probe consumed it and under-predicted by 100GB (harmless here
  # only because the whole trained range fits: 14.2GB weights + 55GB KV).
  kv_bytes_per_token_measured: 225280
  probe_verified_weights_bytes: 14249047104
  # DERIVED, not measured — operator decision 2026-07-29, no retest.
  # The probe stopped at 246784 and it was OUR ARITHMETIC that stopped it: every
  # failing rung was `preflight_refused` against the 480 KiB/token formula, at a
  # phantom 107.5 GB. With the measured 21754 B/tok above, the full trained range
  # costs 5.7 GB of KV against 14.2 GB of weights — 19.9 GB total on a 137 GB
  # box. There is no memory question left to answer, so re-running the ladder to
  # walk it up 15k at a time would only re-measure the fix.
  # probe_verified_n_ctx was RETIRED earlier on 2026-07-30 (it had been
  # measured under swa_full:false) and then RE-MEASURED the same day under the
  # flipped flags — run ctx_probe_20260730-124104 passed the full trained range
  # 262144 at 14.2GB weights + 55GB KV. The value above is that re-measurement,
  # not the retired one.
  model_max_context: 262144
  # 50 against the PESSIMISTIC 46.5 GB. Deliberately sized on the formula rather
  # than a hoped-for measured value: a preflight tuned to an estimate we expect
  # to be wrong in our favour is not a guard.
  kv_preflight_gb: 50
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  # ── THE swa_full TRADE — DECIDED BY MEASUREMENT 2026-07-30 ──────────
  # The original doctrine here ("keep swa_full off, keep the cheap 21.2 KiB/tok
  # KV and the full 262,144 range, avoid the resident cache by running one
  # thinking level") was coherent — and Block C of the caching experiment
  # (run cells_20260729-232251, dev/caching/EXPERIMENT.md) measured its cost:
  #
  #     gemma-4-31b     swa_full: true    ->  880 KiB/token, ceiling 113664
  #     THIS CONFIG     swa_full: false   -> 21.2 KiB/token, ceiling 246784+
  #     THIS CONFIG     swa_full: true    -> ~430 KiB/token; 65,536 = 28.2 GB
  #                                          KV + 14.2 weights = 42.4 GB total
  #
  # What the cheap-KV doctrine actually bought was full_replay sessions: 271.7s
  # of prefill per 16-turn realistic session (B09) to make the big window
  # usable at all. resident+swa_full does the same session in 27.8s (C1) — a
  # 90% saving, which fired the PRE-REGISTERED decision rule (flip if >30%
  # saving AND servable n_ctx >= 32,768). The 262,144 nominal range is
  # surrendered: it was headroom the session path could not afford to read.
  #
  # Still true and still load-bearing: gemma-4 interleaves SWA and full
  # attention; without swa_full, pinned/forked prefixes corrupt at the window
  # boundary (llama_decode -3), which is why resident REQUIRES it here.
  # `thinking: true` stays — one reasoning level means no head swaps, so the
  # reasoning band stays out of n_seq_max.
  #
  # (Contrast step-3.7, which asks for resident_seq_cache WITHOUT swa_full and
  # silently gets neither — it builds the seq-band context, frees it, and
  # rebuilds single-seq every boot.)
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # per_request default (operator): unrouted -> padded head + pre-closed channel (resting off); medium/high -> <|think|> activation
  thinking_available: true
  thinking: "per_request"
  # RESTING HEAD = medium (2026-08-03 matrix finding): with the resting level
  # unset, per_request warmed the static head in the OFF padding — on 26b
  # (no head-swap) that killed per-request thinking outright, and on 31b it
  # was the fallback that turned the deduped `high` request silently off.
  # medium rests the head at <|think|> (the validated pre-redesign posture);
  # low requests still suppress via the padding head-swap (31b) and the
  # pre-closed genprompt (both).
  thinking_mode: medium
  swa_full: true
  kv_unified: true
  session_full_replay: true
  resident_seq_cache: true
  # ADDED 2026-07-30: the stateless flow cache (M9 seq-ops band). Measured
  # on glm at realistic head sizes: HIT saves 3.51s/call = 49% of prefill
  # (corrected pilot, 11/11 hits). The 2026-06 ban hit the M8 save_state
  # BLOB implementation; this band shares none of that mechanism. Under
  # kv_unified the band divides nothing.
  flow_kv_cache: true

prompt:
  persona_file: "./knowledge/SOUL.md"
  system_prompt: "You are a helpful assistant."

generation:
  max_tokens_default: 262144
  temperature_default: 1.0
  top_p: 0.95
  top_k: 64
  min_p: 0.0
  # WAS ABSENT (inheriting formats/schema.py's 1.0), so this model has run
  # vendor-neutral for its whole history — same as the sibling 31b's
  # explicit 1.0. The absence was never a bug; this line makes it a choice.
  #
  # IT DNF'd 2026-08-04 (tier_20260804-141701 arm 1): three consecutive
  # `design_initial` attempts died on long-cycle orbit — 16,384 then 6,144
  # tokens, ratios 0.054/0.095/0.038 — and the arm terminated after ZERO
  # cycles with zero files. Not a dial fault and not a format fault: the
  # captures show it opening its proper `<|channel>thought` head and
  # planning correctly, then looping its module list (entities/world/
  # parser/combat/state/engine/main, over and over) until the guard fired.
  # A clean model-level orbit, of the class where temperature floors are
  # known not to help.
  #
  # 1.05 IS THE OPERATOR'S OWN PRE-AUTHORIZED LEVER, extended here from
  # gemma-4-31b.yaml where it reads: "IF IT RECURS, bump this a tad — 1.05
  # first, 1.10 if that does not hold (operator, 2026-07-31)." That note
  # was written about 31b; applying it to the 26b sibling is an EXTENSION,
  # made because vendor guidance itself calls a penalty remedial once
  # repetition is actually observed, and it now has been, hard.
  # ⚠️ THIS CHANGES MEASUREMENT CONDITIONS. Any artifact from the re-run is
  # scored under a remedial penalty the rest of the fleet does not carry,
  # and must be read that way. If 1.05 does not hold, go to 1.10; if that
  # fails too, the honest record is DNF-under-vendor-sampling rather than a
  # third bump.
  repeat_penalty: 1.05
  repetition_guard_enabled: null
  long_cycle_guard_enabled: null

knowledge:
  tokens_bin: ./data/gemma-4-26b-a4b.tokens.bin
  token_limit: 32768

resources:
  decode_mode: pool
  cpu_threads: 16

logging:
  enabled: true
  directory: ./logs

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  # GRINDER (operator, 2026-08-03): added to the v2 create queue now that the
  # kinks are worked out — the gemma think-activation fix (ec5d54c: <|think|>
  # had served as literal bytes on every gemma run ever) plus the batched-mode
  # boot this config runs. NOTE the v1.2 register's 196 cyc/h for this arm is a
  # NON-THINK number; with thinking live the rate drops substantially (a hard
  # prompt burned a whole 6k budget inside one thought channel during
  # validation), so re-measure the league from THIS run rather than trusting
  # the old figure — it may prove a contemplator.
  league: grinder  # provisional — see the re-measure note above
  status: not_yet_run
  expectation:
    registered: 2026-07-29
    tier: "2-1"
    stars: null
    basis: benchmarks
    why: >
      EXPERIMENTAL — not from experience. Benchmarks indicate that in thinking
      mode it should land below gemma-4 dense thinking, but close to qwen3.6-27b.
      Its speed and extra context may prove advantageous in ways the benchmarks
      do not show.

# ── MEASURED CACHE BEHAVIOUR (doc-only; run cells_20260729-232251 (dev/caching/EXPERIMENT.md §Results)) ─
