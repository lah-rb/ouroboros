  run_id: cells_20260729-232251
  B09:
    strategy: full_replay
    can_shift: False
    n_ctx_seq: 262144
    fresh_t2_last: [2588, 17260]
    prefill_total_s: 271.7
    needle_at_depth: True
  C1:
    strategy: resident
    can_shift: True
    n_ctx_seq: 32768
