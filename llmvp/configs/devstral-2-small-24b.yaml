# ── GREENFIELD TIER 3 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# Respectable, largely compatible — the sweep's most PROLIFIC run (412
# inferences, 216/31 tok/s prefill/decode, 11/18 goals incl. 4 verified
# functional: the field's most). But throughput concentrated on the easy
# cluster: attack crashed the process (Room.monsters undefined), NPC rooms
# unreachable (one-way links), persistence never wired. Fast hands, weak seams.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 393216
  max_aliases: 50
  introspection_enabled: true

model:
  name: "devstral-2-small-24b"
  family: "tekken"
  # RESIDENT cache economics (dev/CACHE_STATE.md matrix): dense — measured full-stack 2026-07-02 (resident-live 8/16 tok turns, hot snapshot forks 0.3s).
  swa_full: true
  kv_unified: true
  resident_seq_cache: true
  path: /Users/lah-rb/.lmstudio/models/byteshape/Devstral-Small-2-24B-Instruct-2512-GGUF/Devstral-Small-2-24B-Instruct-2512-IQ4_XS-4.04bpw.gguf
  # RAISED 131072 -> 393216 on 2026-07-29 from the measured ceiling
  # (probe_verified_n_ctx below). KV 160 KiB/token x 393216 = 64.4GB
  # + 11.9GB weights = 76.3GB resident at boot.
  n_ctx: 393216
  probe_verified_weights_bytes: 11916774048
  probe_verified_n_ctx: 393216
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  thinking: false

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 393216
  temperature_default: 0.7
  top_p: 0.95
  top_k: 0
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.05
  streaming_default: true

knowledge:
  tokens_bin: "./data/devstral-2-small-24b.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
