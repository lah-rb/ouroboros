# =============================================================================
# LLMVP — Reference Configuration
# =============================================================================
# This file documents all available configuration options with their types,
# mandatory/optional status, and default values. Regenerated 2026-07-16
# against core/config.py (the pydantic schema is the source of truth; per
# README.LLM.md, config.py changes MUST be mirrored here).
#
# Usage:
#   - Copy this file and modify values for your deployment
#   - Remove optional fields to use their defaults
#   - Update active_config.txt to point to your config file
#
# =============================================================================
# SETTING UP A NEW MODEL — the procedure, in order
# =============================================================================
# Every step below exists because skipping it cost us something real. Do them
# in this order: geometry before allocation, the model card before the first
# run, the strategy before the features.
#
# ── 1. READ THE GGUF HEADERS BEFORE ALLOCATING ANYTHING ──────────────
#   python3 dev/gguf_geometry.py <file.gguf> --template
# Gives architecture, KV bytes/token, trained context, and the chat template.
# THREE MACHINE REBOOTS WERE PRECOMPUTABLE from these numbers. Note the
# attention class — it decides `swa_full` (step 4), and nothing else will tell
# you: SWA/iSWA (gpt-oss, gemma, laguna) NEED swa_full for any pinned prefix;
# MLA (glm) and dense (hy3) do not and are correct without it.
#
# ── 2. WEB-SEARCH THE MODEL CARD. THIS IS THE STEP THAT GETS SKIPPED ──
# Look up the vendor/community sampling profile before the first run, and put
# the URL in the config header. Vendors publish DIFFERENT PROFILES PER TASK
# SHAPE and the agentic one is rarely the headline.
#
# WHAT IT COST US: glm-4.7-flash's card gives three profiles; the agentic one
# (Terminal-Bench / SWE-bench shaped, which is what Ouroboros runs) is
# temp 0.7 / top_p 1.0 / max_new_tokens 16384. Its first arm ran temp 0.6,
# top_p 0.95, top_k 20 — a setting from nowhere, inside no published envelope,
# and the arm was not a measurement of the model. Copying another model's
# sampling block is the same mistake with extra steps: `logit_bias` ids are
# tokenizer-specific, and penalty windows that work on one family blind the
# degeneration guard on another.
# Record the profile you chose AND the one you rejected — a config that cannot
# say why it samples the way it does cannot be defended after a bad arm.
#
# ── 3. FAMILY / FORMAT ───────────────────────────────────────────────
# Does `family:` already exist in llmvp/formats/? If NOT, the new schema must
# ALSO be registered in core/fsm_labeller.py — olmo shipped unmapped once and
# `think>` residue corrupted the judged artifact. Verify the turn terminator
# is in the family's stop set: `dev/stop_token_audit.py` (a missing one burned
# 83 minutes of a glm arm).
#
# ── 4. CHOOSE THE STRATEGY, THEN STATE swa_full ──────────────────────
#   cache_strategy: replay | resident | batched      (see the shortcut below)
# Default to `resident` — it is the optimum for any model that supports it.
# Use `batched` only for concurrent fan-out; it BUYS concurrency by forfeiting
# the session flow-fork, the CoT strip, sampling overrides and the cold
# snapshot rebuild. Use `replay` only when the architecture refuses the others.
# Then set `swa_full` from step 1. The strategy will not set it for you, on
# purpose — it is architecture-determined and a strategy-level guess would be
# wrong for half this fleet.
#
# ── 5. BOOT ONCE AND READ THE VERDICT ────────────────────────────────
# `resident_seq_cache` is a REQUEST. Watch for:
#   🧩 session strategy: resident (resident_requested=True, memory_can_shift=True, …)
# If can_shift came back False the model is on full replay whatever the config
# says, and it can layer NO cache features — that is a model-selection fact,
# not a config bug. Hybrid-recurrent is not automatically disqualifying:
# qwen3-next (DeltaNet) grants it while the GDN qwens refuse.
#
# ── 6. PROBE THE CONTEXT CEILING ─────────────────────────────────────
#   .venv/bin/python api/main.py --probe-context <config>     (detached:
#   bash dev/probe_ctx.sh <config>)
# Writes back probe_verified_n_ctx + probe_verified_weights_bytes so the KV
# preflight stops guessing. Two rules: never hand-edit those to make a load
# succeed, and RE-PROBE after any flag change that moves the seq map — a
# ceiling measured under other flags is invalid (it OOMed the swarm once).
# NOTE the ceiling is a fraction of PHYSICAL memory; `iogpu.wired_limit_mb` is
# NOT a ceiling — four passing measurements have crossed it.
#
# ── 7. LAYER FEATURES, GUIDED BY THE STRATEGY ────────────────────────
# See dev/caching/FEATURE_MATRIX.md §2 for what each strategy supports and §3
# for what each feature buys. Load-bearing gotchas:
#   • flow_kv_cache needs resident — without it there is nothing to pin onto
#     and it counts a fallback per request (config validation now warns).
#   • reasoning_head_swap needs resident AND a family with reasoning levels.
#   • snapshots: capture and HOT fork work everywhere; the COLD rebuild raises
#     under batched.
#   • kv_unified: true unless you have a reason — under `false` the per-seq
#     window is n_ctx / n_seq_max, which is a /12 division with stock bands
#     and has silently amputated contexts three times.
#
# ── 8. RECORD WHAT YOU MEASURED ──────────────────────────────────────
# Run a session cell for the ledger so the model is comparable to the fleet:
#   uv run python dev/cache_compat_matrix.py --label <model> --depth 16 \
#       --turn-tokens 900
# Write the result back as a `probe_verified_cache:` block, and pre-register a
# `tier:` expectation BEFORE the first arm — its job is to make a surprise
# legible, not to be right.
# =============================================================================
#
# ── SHORTCUT: cache_strategy ─────────────────────────────────────────
# A top-level `cache_strategy:` names one of the three deployable shapes and
# expands to the flags it stands for, so a new model needs one decision
# instead of four spread across `model:` and `resources:`.
#
#   cache_strategy: replay     # resident_seq_cache false, full_replay,   pool
#   cache_strategy: resident   # resident + kv_unified,                   pool
#   cache_strategy: batched    # resident + kv_unified,                   batched
#
# It deliberately does NOT set `swa_full`: that is ARCHITECTURE-determined,
# not strategy-determined. MLA (glm) and dense (hy3) models run resident with
# swa_full FALSE and are correct; SWA/iSWA models (gemma, gpt-oss) require it
# TRUE or pinned prefixes corrupt at the window boundary. State it per model.
#
# Stating a flag that CONTRADICTS the strategy raises at load — two sources of
# truth for one decision is the shape that caused the defects this prevents.
# Like `resident_seq_cache`, it is a REQUEST: memory_can_shift() can refuse at
# load. Read the effective strategy from health, never from this key.
# See dev/caching/FEATURE_MATRIX.md.
#
# Legend:
#   [M] = Mandatory (must be provided)
#   [O] = Optional (has default value)
#   Type: str, int, float, bool, list, path, Optional[type]
# =============================================================================

# -----------------------------------------------------------------------------
# APP CONFIGURATION - FastAPI application settings
# -----------------------------------------------------------------------------
app:
  # [M] Type: str — network interface to bind to
  host: "0.0.0.0"
  # [M] Type: int — HTTP server port
  port: 8000
  # [M] Type: str — uvicorn log level (debug/info/warning/error)
  log_level: "info"
  # [O] Type: list[str] — CORS allowed origins. Default: ["*"]
  cors_origins: ["*"]
  # [O] Type: bool — expose the OpenAI-compatible REST shim (/v1/...) alongside
  # GraphQL. Needed by external harnesses (Terminus, tau-bench user sim).
  # Default: false
  openai_shim: false
  # [O] Type: int — seconds `--backend` waits for the pool to be ready.
  # Default: 120
  backend_timeout: 120

# -----------------------------------------------------------------------------
# GRAPHQL SECURITY - query limits (all [O])
# -----------------------------------------------------------------------------
graphql:
  max_query_depth: 10          # [O] int, default 10
  max_tokens: 2000             # [O] int — parser token limit, default 2000
  max_aliases: 50              # [O] int, default 50
  introspection_enabled: true  # [O] bool, default true

# -----------------------------------------------------------------------------
# MODEL - architecture, KV-cache strategy, reasoning machinery
# -----------------------------------------------------------------------------
model:
  # [M] Type: str — display name
  name: "gpt-oss-120b"
  # [M] Type: str — format schema family: "harmony" | "chatml" | "tekken"
  family: "harmony"
  # [M] Type: path — GGUF path
  path: "/path/to/model.gguf"
  # [M] Type: int — context size. NOTE: in batched decode_mode this is the
  # UNIFIED cell pool SHARED by all working seats — budget the SUM of
  # concurrent streams (e.g. two concurrent 26k-token rewrites + pinned
  # heads must fit; exhaustion evicts streams with "KV cell pool exhausted").
  n_ctx: 131072
  # [M] Type: int — layers on GPU (-1 = all)
  n_gpu_layers: -1
  # [M] Type: int — sampling seed (-1 = random)
  seed: -1
  # [M] Type: bool — llama.cpp verbose logging
  verbose: false

  # ── Memory budget & measured geometry ───────────────────────────────────
  # These four are what `--probe-context` WRITES BACK. Never hand-edit them to
  # make a load succeed: the guard exists because an allocation past physical
  # memory hard-reboots the machine before any error code is returned.
  #
  # [O] Type: int — per-STREAM ceiling, distinct from n_ctx. Under batched,
  # n_ctx is the shared pool while this bounds any single stream (the swarm
  # config declares n_ctx 589824 against model_max_context 131072, i.e. four
  # streams' worth). Default: unset = n_ctx.
  model_max_context: 131072
  # [O] Type: float — refuse a load whose predicted weights+KV exceeds this,
  # BEFORE Metal allocates. Set from the real usable budget, not from hope.
  # Default: unset = derived from physical memory.
  kv_preflight_gb: 106
  # [O] Type: int — MEASURED bytes/token, overriding the header formula. The
  # formula over-predicts badly on interleaved-SWA and MLA (measured 1.00x to
  # 22.59x across the fleet), so a config without this is guarded against an
  # estimate rather than a fact. Written by `--probe-context`.
  kv_bytes_per_token_measured: 71680
  # [O] Type: int — an n_ctx OBSERVED to load AND decode on this machine; the
  # preflight honours it over its own arithmetic. Bound to the weights it was
  # measured against (below) so a requant invalidates it rather than silently
  # outliving it. INVALIDATED by any flag change that moves the seq map —
  # re-probe rather than carrying it forward.
  probe_verified_n_ctx: 131072
  # [O] Type: int — weights size when probe_verified_n_ctx was measured.
  probe_verified_weights_bytes: 65369017728

  # ── RoPE / YaRN context extension ───────────────────────────────────────
  # Only set these when the model card specifies them. They are silent when
  # wrong: the model loads and degrades, it does not fail.
  # [O] Type: float — RoPE base frequency override. Default: unset (GGUF).
  rope_freq_base: null
  # [O] Type: float — RoPE frequency scale. Default: unset (GGUF).
  rope_freq_scale: null
  # [O] Type: str — "none" | "linear" | "yarn". Default: unset (GGUF).
  rope_scaling_type: null
  # [O] Type: int — YaRN: the model's ORIGINAL trained context, the value the
  # extension scales FROM. Default: unset.
  yarn_orig_ctx: null
  # [O] Type: float — YaRN extrapolation mix. Default: unset.
  yarn_ext_factor: null
  # [O] Type: float — YaRN attention magnitude scale. Default: unset.
  yarn_attn_factor: null
  # [O] Type: float — YaRN low correction dim. Default: unset.
  yarn_beta_fast: null
  # [O] Type: float — YaRN high correction dim. Default: unset.
  yarn_beta_slow: null

  # [O] Type: bool — prepend the family template's BOS. Some GGUF templates
  # already emit one; doubling it shifts every cached prefix by a token.
  # Default: unset = the family schema decides.
  template_bos: null

  # ── KV / attention knobs ────────────────────────────────────────────────
  # [O] Type: bool — keep FULL KV for sliding-window-attention layers.
  # REQUIRED for any pinned/forked prefix reuse (resident_seq_cache,
  # flow_kv_cache, save_state) on SWA models like gpt-oss: without it a
  # restored prefix is inconsistent at the SWA window boundary and decode
  # fails with code -3. Costs extra SWA-layer KV (pair with kv_unified).
  # Default: false
  swa_full: true
  # [O] Type: bool — single unified KV cell allocation (vs per-sequence);
  # pairs with swa_full to bound memory on unified-memory (Metal) hardware.
  # Required for decode_mode: batched. Default: false
  kv_unified: true
  # [O] Type: str — flash attention: "auto" | "on" | "off". Default: "auto"
  flash_attn_type: "auto"
  # [O] Type: int — logical prefill batch. Default: 2048 (the known-good
  # multi-seat shape; 512 made a shared slot fail deterministically at its
  # static boundary — see dev/archive/docs/CACHE_STATE.md)
  n_batch: 2048
  # [O] DEAD no-ops kept for config compatibility — silently ignored by the
  # binding (wrong kwarg names). Use flash_attn_type / n_batch above.
  # flash_attention: false
  # batch_size: 64

  # ── Speculative decoding ────────────────────────────────────────────────
  # [O] Type: bool — n-gram-map draft speculative decoding (lossless,
  # zero extra model). Forces logits_all=True (extra prefill cost) —
  # BENCHMARK before trusting on MoE/Metal. Default: false
  speculative: false
  speculative_ngram_size: 3   # [O] int, default 3
  speculative_num_pred: 10    # [O] int, default 10

  # ── Thinking / reasoning ────────────────────────────────────────────────
  # [O] Type: bool — does the MODEL support thinking at all (a fact about the
  # weights/template, not a policy). devstral: false, mistral-medium: true.
  # When false, every reasoning surface is suppressed and `thinking` is
  # forced to "off". Default: true
  thinking_available: true
  # [O] Type: str — the thinking POLICY, ternary (legacy bools coerce:
  # true->"on", false->"off").
  #   "on"          -> every request routes to the family's HIGHEST level
  #   "off"         -> every request routes to the LOWEST (None -> low)
  #   "per_request" -> request levels honored; no level -> LOW, never medium
  # Default: per_request
  thinking: "per_request"
  # [O] Type: Optional[str] — reasoning effort rendered into the system
  # block: "none" | "low" | "medium" | "high" | null (family default).
  # Inert for binary families (tekken). Default: null
  thinking_mode: "medium"
  # [O] Type: bool — per-request reasoning HEAD-SWAP (requires resident
  # cache active + a thinking family). Warmup pins a system head per level
  # on a reserved seq band; sessions install at turn 0 and SPLICE
  # mid-session; stateless completions swap the prompt head per request
  # (zero re-prefill). The default level reuses SEQ_STATIC. Actuator for
  # the adaptive-reasoning router (agent/reasoning_router.py).
  # Default: false
  reasoning_head_swap: true

  # ── Session-state strategy ──────────────────────────────────────────────
  # [O] Type: bool — sessions keep token history and FULLY RE-PREFILL each
  # turn from the pristine static snapshot (safe default: save_state is
  # unsound for hybrid/recurrent models and its blob overflows on deep
  # sessions of large models). false = opt-in save_state splice fast path.
  # Default: true
  session_full_replay: true
  # [O] Type: bool — RESIDENT in-context sequence cache: the static prefix
  # lives on its own seq, requests/sessions fork it via memory_seq_cp — KV
  # stays live, never serialized. Sidesteps save_state entirely; memoryful
  # sessions append instead of re-prefilling. REQUIRES memory_can_shift()
  # (swa_full on SWA models); the warm-up gate falls back to the legacy
  # path when unavailable. The production path. Default: false
  resident_seq_cache: true
  # [O] Type: bool — strip prior-turn CoT from resident sessions in-place
  # (truncate-and-replay the clean answer): harmony-compliant multi-turn
  # form + large context savings on deep thinking sessions. Validated on
  # gpt-oss/harmony; validate chatml before enabling there. Default: false
  resident_strip_reasoning: false
  # [O] Type: bool — turn-0 fork of [global static + flow head] for
  # sessions passing flow_key + static_prefix (reclaims cross-session
  # persona re-prefill, ~15% of wall on session-heavy runs). Pure no-op
  # unless the caller opts a session in. Default: true
  resident_session_flow_fork: true

  # ── Per-flow static-prefix KV cache (save_state based) ──────────────────
  # [O] Type: bool — pin per-flow static prefixes via save_state/load_state.
  # CAUTION: the 2026-06 re-enable regressed gpt-oss over long runs (subtle
  # KV corruption caught by a game_challenge stability test) — kept FALSE
  # in production; resident_seq_cache is the safe path. Default: false
  flow_kv_cache: false
  flow_kv_cache_max: 8   # [O] int — LRU bound, default 8

  # ── Session snapshots (ingest-once tier) ────────────────────────────────
  # [O] Type: int — reserved seq band for semi-permanent session snapshots
  # (sessionSnapshot mutation; later sessions fork at ~zero prefill until
  # purgeSnapshot). 0 disables the band. Snapshots share the n_ctx cell
  # budget; capture is capacity-checked and rejected loudly; windowing is
  # FORBIDDEN on snapshot-linked sessions. On models where resident is
  # inactive the snapshot degrades to token-history storage (same API).
  # Default: 2
  session_snapshot_max: 2
  # [O] Type: float — orphan-reaper sweep for crash-orphaned snapshots;
  # 0 disables (deliberate multi-day pins). Default: 7200.0
  session_snapshot_ttl_s: 7200.0

  # ── Proactive context refresh (anti-souring) ────────────────────────────
  # The process sours under sustained volume (outputs degrade to action
  # stubs). [O] Type: int — requests between OPPORTUNISTIC refreshes (fires
  # only when idle). Default: 75
  context_refresh_interval: 75
  # [O] Type: int — wall-clock CAP in seconds; fires even under load.
  # Default: 1800
  context_refresh_seconds: 1800
  # [O] Type: float — drain window for refreshing UNDER LOAD (batched mode).
  # 0 = legacy defer-while-busy (starves under continuous multi-mission
  # load). >0: admissions gate closes, in-flight work gets this long to
  # finish, stragglers force-clear (sessions expire via their normal
  # listener path; streams retire RETRIABLE — same client recovery as KV
  # eviction), then the context rebuilds in-process (~7s). Default: 0.0
  context_refresh_drain_s: 300.0

# -----------------------------------------------------------------------------
# PROMPT - persona / developer instructions
# -----------------------------------------------------------------------------
prompt:
  # [O] Type: Optional[path] — SOUL.md-equivalent persona source.
  # Default: null
  persona_file: "knowledge/SOUL.md"
  # [O] Type: Optional[path] — tools definition file. Default: null
  tools_file: null

# -----------------------------------------------------------------------------
# GENERATION - sampling defaults + degeneration guards
# -----------------------------------------------------------------------------
generation:
  # All sampling fields [O] Type: Optional — null defers to server defaults.
  max_tokens_default: null
  temperature_default: 0.7
  top_p: null
  top_k: null
  min_p: null
  presence_penalty: null
  repeat_penalty: null
  # [O] Type: Optional[float] — frequency penalty (llama.cpp penalty_freq),
  # scaled by how OFTEN a token appeared, where presence_penalty is flat.
  # Shares the penalty_last_n window below. Default: null => library default.
  penalty_freq: null
  # [O] Type: Optional[dict[int, float]] — per-token-id logit bias, e.g.
  # {19: -100.0} to ban a token outright. Ids are TOKENIZER-specific, so a
  # bias copied between models bans something unrelated — verify against the
  # model's own vocab. Default: null.
  logit_bias: null
  streaming_default: null

  # ── Degenerate-repetition guard (inference/repetition.py) ───────────────
  # [O] Type: Optional[bool] — abort turns that collapse into token-level
  # repetition instead of filling max_tokens (~1h hang class). null =>
  # ENABLED (set false per-config to disable).
  repetition_guard_enabled: null
  repetition_max_run: null           # [O] null => 48
  repetition_max_cycle_period: null  # [O] null => 8
  repetition_min_cycle_reps: null    # [O] null => 12
  # [O] Type: Optional[bool] — long-cycle guard (runaway_capture.py):
  # structural distinct-chunk check every ~2k tokens for paragraph-scale
  # loops the 8-token-cycle guard can't see; aborts via the same
  # DegenerateGenerationError path and dumps partials to
  # logs/runaway_captures/. null => ENABLED.
  long_cycle_guard_enabled: null

  # ── Temperature floors (repetition-attractor mitigation) ────────────────
  # [O] Type: Optional[float] — session turns at depth >=
  # session_temp_floor_after_turn sample at no less than this floor (deep
  # multi-turn sessions are repetition attractors; sparse MoEs earliest).
  # null => disabled.
  session_temp_floor: 0.35
  session_temp_floor_after_turn: null  # [O] null => 2 (third turn onward)
  # [O] Type: Optional[float] — global per-model floor for ANY request
  # (observed live runaways sat at effective temps 0.24-0.32; flow
  # multipliers drive temps as low as t*0.1). null => disabled.
  # NOTE (2026-07-22): floors stop token-level collapse but NOT
  # paragraph-scale deliberation orbits (those survive 0.5). For Qwen3
  # GDN-hybrid models set floors >= 0.7 — every official Qwen3 profile is
  # temp >= 0.6 (dev/qwen3_loop_research.md).
  temperature_floor: null

  # ── Long-period repetition breakers (dev/qwen3_loop_research.md) ────────
  # [O] Type: Optional[int] — shared lookback window for repeat/frequency/
  # presence penalties (llama.cpp penalty_last_n). null => library default
  # (64 tokens — blind to paragraph-scale cycles; the live qwen3 orbits
  # repeat at ~800 tokens). Set ~2048 on GDN-hybrid configs.
  penalty_last_n: null

  # ── Reasoning-budget controls (thinking families) ───────────────────────
  # [O] Type: Optional[int] — cap the tokens a model may spend inside its
  # thinking span before the harness intervenes. Guards the failure where one
  # 32k-token deliberation burns an hour-long leg. Default: null = uncapped.
  reasoning_budget: null
  # [O] Type: Optional[str] — the token/string that OPENS the thinking span,
  # when it differs from the family schema's. Default: null = family default.
  reasoning_start: null
  # [O] Type: Optional[str] — the token/string that CLOSES it. An unclosed
  # span is the failure that strips a response to empty, so these two are
  # worth stating explicitly on any new thinking family.
  reasoning_end: null
  # [O] Type: Optional[float] — DRY sampler multiplier (0/null = disabled,
  # sampler chain untouched). Purpose-built long-period repetition breaker:
  # penalty grows exponentially in matched-sequence length
  # (multiplier * base^(len - allowed_length)), so paragraph-scale verbatim
  # cycles are broken where windowed per-token penalties never fire.
  # Enable (~0.8) on Qwen3 GDN-hybrid configs.
  dry_multiplier: null
  dry_base: null            # [O] null => 1.75 (when DRY enabled)
  dry_allowed_length: null  # [O] null => 2 (when DRY enabled)
  dry_penalty_last_n: null  # [O] null => -1 (whole context; when DRY enabled)

  # ── Degeneration retry (core/session_manager.py) ────────────────────────
  # [O] Type: Optional[bool] — when a SESSION turn aborts via
  # DegenerateGenerationError, the purge machinery restores pre-turn state;
  # with this enabled the turn is re-driven ONCE at the vendor recovery
  # recipe below before the error surfaces. null => disabled.
  degen_retry_enabled: null
  degen_retry_temperature: null       # [O] null => 1.0
  degen_retry_presence_penalty: null  # [O] null => 1.5

# -----------------------------------------------------------------------------
# KNOWLEDGE - compiled static token stream
# -----------------------------------------------------------------------------
knowledge:
  # [M] Type: path — compiled static tokens for the default persona
  # (auto-built from prompt.persona_file when missing/stale)
  tokens_bin: "data/model-name.tokens.bin"
  # [M] Type: int — token budget for the static stream
  token_limit: 4096

# -----------------------------------------------------------------------------
# RESOURCES - concurrency architecture
# -----------------------------------------------------------------------------
resources:
  # [M] Type: int — CPU threads for llama.cpp
  cpu_threads: 16
  # [M] Type: int — pool slots (decode_mode: pool) or working SEATS sharing
  # one context (decode_mode: batched)
  max_concurrent_requests: 3
  # [O] Type: str — "pool" (default; N independent contexts — decode across
  # contexts never overlaps usefully on Metal: one shared MTLCommandQueue)
  # | "batched" (ONE context, one llama_decode per step carrying a token
  # per active stream — the llama-server slot pattern and the only
  # aggregate-throughput shape on Metal; gpt-oss-120b measured 60.6→93.3
  # tok/s aggregate at 1→4 streams). Batched REQUIRES resident_seq_cache +
  # swa_full + kv_unified and a non-hybrid model (validated at load).
  decode_mode: "batched"
  # [O] Type: Optional[int] — max prompt tokens fed per step while other
  # streams decode (prefill/decode interleave). Lower = snappier live-decode
  # latency while a long prompt joins; higher = faster prompt ingestion.
  # null => model.n_batch.
  batched_prefill_chunk: null
  # [O] Type: Optional[int] — JIT pool scaling limit. null = pre-allocate
  # all slots at startup.
  jit_concurrency_limit: null
  # [O] Type: Optional[list[str]] — persona per slot (index = slot; length
  # must equal max_concurrent_requests). Names must exist in the root
  # `personas` map or be "default". null => every slot carries the default
  # persona.
  slot_personas: null
  # [O] Type: int — max seconds a request waits on the scaling gate
  # (acquire + generation start) during a JIT scale-up/down. Deliberately
  # larger than backend_timeout (a waiter must outlive drain + N warm-ups).
  # Default: 600
  scale_wait_timeout: 600
  # [O] Type: int — min idle seconds before the scaler may reap a JIT
  # instance (one per tick, LRU first). Default: 600
  instance_idle_ttl: 600
  # [O] Type: int — min seconds after a batch scale-up before any reap
  # (belt-and-braces on top of instance_idle_ttl). Default: 300
  scale_down_cooldown: 300

# -----------------------------------------------------------------------------
# PERSONAS - named alternate static heads (multi-persona pooling)
# -----------------------------------------------------------------------------
# [O] Type: map[str, PersonaConfig] — "default" is implicit
# (prompt.persona_file / knowledge.tokens_bin). A persona is a STATIC HEAD,
# not a config: family/stops/temperature stay global per-process; what
# differs is the persona text compiled into the static token stream. Assign
# to slots via resources.slot_personas (pool) — in batched mode any seat
# serves any persona and sessions pin seats. Absent map => single-persona
# behavior (all pre-persona configs remain valid).
personas: {}
#  user_sim:
#    persona_file: "knowledge/USER_SIM.md"          # [M] path — SOUL source
#    tokens_bin: "data/model-user_sim.tokens.bin"   # [M] path (auto-built)
#    n_ctx: null   # [O] per-slot context size (pool only); null => model.n_ctx

# -----------------------------------------------------------------------------
# TOOLS - tool-augmented inference (all [O])
# -----------------------------------------------------------------------------
tools:
  enabled: false      # [O] bool, default false
  max_iterations: 3   # [O] int, default 3

# -----------------------------------------------------------------------------
# LOGGING - interaction logging (all [O])
# -----------------------------------------------------------------------------
logging:
  enabled: true            # [O] bool, default false
  directory: "./logs"      # [O] path — interactions.jsonl etc., default ./logs


# ══════════════════════════════════════════════════════════════════════
# REMOTE PROVIDER ENTRIES (documentation only — live entries are STANDALONE
# top-level configs/*.yaml files by design: model_registry scans that glob
# and detects provider entries by shape, so they cannot live inside this
# reference file. Current live entries: boss-claude.yaml, boss-sonnet.yaml,
# boss-lmstudio.yaml.)
#
# Shape (MULTI_MODEL_PLAN Phase 3):
#   provider: claude_cli | openai_compat   # adapter selection
#   model: <provider-side model id>        # addressed per-request via the
#                                          # completion `model` field
#   system_file: <path>                    # [O] raw text sent as the system
#                                          # prompt — the persona equivalent,
#                                          # since a remote entry has no
#                                          # tokens_bin
#   claude_bin: claude                     # [O] claude_cli only: binary
#                                          # override (tests point at a fake)
#   base_url: http://host:1234/v1          # [O] openai_compat only, INCLUDING
#                                          # the /v1 suffix
#   api_key_env: MY_PROVIDER_KEY           # [O] openai_compat only: the ENV
#                                          # VAR NAME holding the key — never
#                                          # the key itself
#   temperature_default / max_tokens_default / timeout_s: request defaults
#                                          # (0.7 / 1024 / 300.0)
# Provider entries are ALWAYS available and never swapModel targets; auth
# lives with the provider (claude CLI login / server-side key).
#
# NONE of the cache strategy above applies to a remote entry: no KV sessions,
# no resident cache, no reasoning head-swap. It is chat/completion only.
# ══════════════════════════════════════════════════════════════════════
