# ── DISPOSITION (2026-07-24): GATE-BLOCKED, kept for family reference ──
# Failed the design coherence gate 2/2 (8 min per attempt, zero artifacts) —
# same terminal class as archived mistral-small-4, different character:
# attempt 1 was a REAL blueprint API inconsistency (gate correct); attempt 2
# was an apparent FALSE-POSITIVE self-rejection (judged its own valid
# flat-layout blueprint incoherent — the grounding judge is the serving
# model). Contrast with Think (artifacts both windows): the thinking RL does
# real work on this lineage. Before any retry: serve the design gate's
# grounding from a stronger judge (e.g. a5) — see MORNING_REPORT 2026-07-24.
# OLMo 3.1 32B INSTRUCT — the no-think sibling, added 2026-07-23 for the
# family A/B vs the Think variant. GGUF template verified: same olmo2 arch,
# same functions declaration (family: olmo covers it), NO <think> opener —
# thinking: false, and the labeller's chatml start-phase handles pure
# content. All other settings mirror the Think config deliberately (Luke:
# "same config to keep it even"), including the lever-sweep repeat_penalty
# 1.05.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 65536
  max_aliases: 50
  introspection_enabled: true

model:
  name: "olmo-3.1-32b-instruct"
  # Dedicated family (2026-07-23 template audit): chatml framing PLUS the
  # no-functions capability declaration OLMo's template appends to every
  # system message — plain chatml served it slightly off-distribution.
  family: "olmo"
  path: /Users/lah-rb/.lmstudio/models/unsloth/Olmo-3.1-32B-Instruct-GGUF/Olmo-3.1-32B-Instruct-Q6_K.gguf
  # ── GGUF GEOMETRY (dev/gguf_geometry.py, headers, 2026-07-31) ──────
  # This pair was the ONLY fleet config with no probe fields at all — it was
  # onboarded before the "setting up a new model" procedure existed, and step 1
  # of that procedure (read the headers before anything else) was never done.
  # olmo has form here: it also shipped unregistered in fsm_labeller, which let
  # `think>` residue corrupt a judged artifact.
  #
  #   arch=olmo2  layers=64  n_head=40  n_kv_head=8  head_dim=128  experts=0
  #   trained ctx 65536 (yarn x8 from an 8192 original)
  #   weights 26.4 GB decimal / 24.6 GiB, 1 shard
  #   KV/token 256 KiB  — EIGHT TIMES gemma-4-26b's 32 KiB, on a 32B dense
  #                       model. The KV, not the weights, is what sizes this.
  #
  #     n_ctx    KV GB   total GB
  #      16384     4.3       30.7
  #      32768     8.6       35.0
  #      65536    17.2       43.6   <- THIS CONFIG
  #
  # Binds the (still owed) context verification to these exact weights: if the
  # file is requantised this no longer describes the model and the preflight
  # correctly falls back to the formula.
  probe_verified_weights_bytes: 26448497312
  # NO CONTEXT PROBE IS OWED (operator, 2026-07-31). `--probe-context` exists to
  # find the highest n_ctx a model will actually hold, and there is nothing above
  # this one to find: the GGUF's trained context IS 65536 and n_ctx is already
  # set to it. A probe could only re-confirm a fit the header arithmetic already
  # shows with 84 GB of headroom.
  #
  # `probe_verified_n_ctx` therefore stays absent by DESIGN, not as a gap — it
  # would assert a verified ceiling where the ceiling is the model's own trained
  # limit. Re-probe only if n_ctx is ever pushed past 65536 by rope scaling, at
  # which point the measured KV/token matters (it has run up to 4x the formula
  # elsewhere: gemma-4-26b measured 225,280 B/tok against a 21,754 estimate).
  n_ctx: 65536
  n_gpu_layers: -1
  seed: -1
  verbose: false
  resident_seq_cache: true
  kv_unified: true
  swa_full: true
  session_full_replay: true
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # the non-think model variant: thinking UNAVAILABLE
  thinking_available: false
  thinking: "off"

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 65536
  temperature_default: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  presence_penalty: 0.0
  # 1.05, NOT the model-card 1.0 — lever sweep 2026-07-23 (dev/
  # olmo_think_levers.py, results.jsonl): at rp 1.0 the decisional churn
  # ("Alternatively" x20 per think) ran 761-5,489 think-words per task and a
  # moderate coding task exhausted 8k tokens WITHOUT terminating; at 1.05
  # thinking dropped 55-83%, wall time halved, and all tasks terminated
  # correct (3/3 vs 2/3). Firmer 1.15+window was better still on decisions
  # but noisier on code; presence penalty INVERTED the difficulty-length
  # relationship (erratic). 1.05 preserves the right shape: tiny think on
  # trivial tasks, real think on hard ones.
  repeat_penalty: 1.05
  streaming_default: true

knowledge:
  tokens_bin: "./data/olmo-3.1-32b-instruct.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  league: contemplator  # LOAD-BEARING — agent/tier/runner.py:config_league
  status: recorded  # history: llmvp/configs/archive/TIER_JUDGEMENTS.md
