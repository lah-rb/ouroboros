# ── GREENFIELD TIER 2 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# 3rd of 8: the most polished shell of the finals with genuinely working
# save/load — but unwinnable (dead dialogue, inert weakness, unbeatable boss
# math). That standing was measured on the unsloth Q6_K build and is carried
# here pending re-ranking, since this config now serves APEX I-Balanced.
#
# The current quant has its own, better evidence: 42/50 in the 2026-07-28 blind
# panel, and the judge FINISHED the game — three wins in five attempts, through
# both boss phases, using the weakness item and a mid-fight heal, then
# restarting from the defeat screen. That is the first winnable artifact any
# panel here has produced.
#
# THE DEGENERATION NOTE THAT USED TO LIVE HERE IS GONE, and deliberately. It
# recorded that the FIRST run on this model caught a family paragraph-orbit and
# that the tier standing came from a clean rerun. On APEX I-Balanced there was
# nothing to caveat: 134 generations, ZERO guard events, longest 12,570 tokens.
# Fleet-wide, 618 generations across all three qwen MoEs with not one
# degenerate turn. Switching to APEX I-Balanced appears to have resolved the
# fragility in this family.
#
# "Appears to" is the honest strength. It is an absence over ~600 generations,
# not a mechanism, and the sampling mitigations below were live the whole time
# — so this is quant AND stack, not quant alone. The guards stay armed and the
# vendor profile stays; if an orbit ever returns, the note comes back with the
# capture that proves it.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.5-122b-a10"
  family: "chatml"
  path: /Users/lah-rb/.lmstudio/models/mudler/Qwen3.5-122B-A10B-APEX-GGUF/Qwen3.5-122B-A10B-APEX-I-Balanced.gguf
  # 131072, not the trained 262144: at 262144 this computes to 107.5 GiB
  # (83.5 weights + 24.0 KV at 96 KiB/token) and the 100 GiB preflight refuses
  # the load — so 262144 was a config that could not serve. 131072 lands at
  # 95.5 GiB. Nothing is given up: the 2026-07-28 arm ran the whole hour here
  # with a largest generation of 12,570 tokens and zero truncation events, so
  # the bigger window would not have bound. Raising it again means declaring
  # kv_preflight_gb with it (poolside proves ~109 GiB is stable on this box).
  n_ctx: 131072
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # Vendor instruct-general profile (2026-07-22, dev/qwen3_loop_research.md):
  # the Qwen3.5 card's four official profiles are all temp >= 0.6, three of
  # four with presence_penalty 1.5-2.0. Instruct-general = temp 0.7,
  # top_p 0.8, top_k 20, presence 1.5. This model produced a 32.9k-token
  # deliberation orbit (runaway capture 20260722T182421) at our old
  # temp-0.5-band settings — same GDN-hybrid substrate as qwen3-next.
  temperature_default: 0.7
  temperature_floor: 0.7
  session_temp_floor: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.00
  # Vendor's documented "endless repetitions" mitigation. Only effective
  # with the widened window below (llama.cpp windows presence at
  # penalty_last_n, unlike vLLM's whole-sequence semantics).
  presence_penalty: 1.5
  repeat_penalty: 1.0
  penalty_last_n: 2048
  # DRY REMOVED 2026-07-22 (isolation test — see qwen3-next-coder config):
  # DRY converted the catchable coherent orbit into an uncatchable
  # noise-slot structural loop that blinds the distinct-ratio guard.
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.5-122b-a10.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
