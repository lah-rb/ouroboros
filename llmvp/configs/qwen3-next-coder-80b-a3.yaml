# ── UNRANKED (2026-07-28). The tier-3 standing this carried was measured on
# the unsloth build; on APEX I-Balanced this is objectively a different model
# and its old placement no longer describes it. Re-earn a tier from a panel
# run on THIS quant.
#
# THE DEGENERATION NOTE THAT USED TO LIVE HERE IS GONE, and deliberately.
# It warned of a GDN-hybrid deliberation-orbit propensity — the failure this
# model has been held back by for longer than any other in the fleet, and the
# one the long-cycle guard was built for after a 130k-token menu-turn loop.
# On APEX I-Balanced it did not appear: **448 generations** in one hour, ZERO
# guard events, median 23 tokens, p90 226, longest 7,046 — the tightest
# distribution of any model we have measured. Fleet-wide, 618 generations
# across all three qwen MoEs with not one degenerate turn. Switching to APEX
# I-Balanced appears to have resolved the fragility in this family.
#
# "Appears to" is the honest strength. It is an absence over ~600 generations,
# not a mechanism, and the sampling mitigations below were live the whole time
# — so this is quant AND stack, not quant alone. The guards stay armed and the
# vendor profile stays; if an orbit ever returns, the note comes back with the
# capture that proves it.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3-next-coder-80b-a3"
  family: "chatml"
  # RESIDENT cache economics (dev/CACHE_STATE.md matrix): hybrid DeltaNet — measured full-stack 2026-07-02 (append-only residency + seq_cp forks are SAFE on the hybrid; it is per-turn state SURGERY that corrupts recurrent state).
  #
  # RE-VALIDATED 2026-07-30 at realistic depth (cell RC3, below). This was the
  # one resident claim in the fleet with contradicting family evidence and no
  # measurement: its GDN siblings qwen3.5-122b (RC2) and qwen3.6-27b (F5) both
  # measure memory_can_shift=False even with the flags forced on, and the
  # qwen3.5 header generalizes that to "the recurrent component blocks seq ops
  # regardless of SWA flags". THAT GENERALIZATION IS TOO BROAD — it does not
  # hold here. This model grants can_shift, runs flat to depth 16, keeps the
  # needle, and hot-forks a snapshot. Hybrid-recurrent is NOT by itself
  # disqualifying; the DeltaNet variant differs from the GDN ones.
  swa_full: true
  kv_unified: true
  resident_seq_cache: true
  path: /Users/lah-rb/.lmstudio/models/mudler/Qwen3-Coder-Next-APEX-GGUF/Qwen3-Coder-Next-APEX-I-Balanced.gguf
  n_ctx: 262144
  # MEASURED 2026-07-29 (--probe-context): 24576 B/tok vs a 98304 formula (4.00x over — swa_full:false keeps the windowed
  # layers windowed, and the formula assumes a full cache on every layer).
  kv_bytes_per_token_measured: 24576
  probe_verified_weights_bytes: 58392963072
  probe_verified_n_ctx: 262144
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  thinking: false
  # Hybrid recurrent state: per-turn save/load splicing is unsound
  # (upstream llama.cpp #22384) — sessions re-prefill from history.
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # Vendor profile (2026-07-22, dev/qwen3_loop_research.md): the official
  # Qwen3-Coder-Next card documents exactly temp=1.0, top_p=0.95, top_k=40
  # (Unsloth adds min_p=0.01, repeat penalty disabled). We previously ran
  # temp 0.8-scaled-down + top_k 20 — below every official profile, in the
  # deliberation-orbit band (the 33k-token conclude-turn runaway sampled at
  # 0.50). Flows still scale temp DOWN per task; the floors below keep the
  # scaled values out of the danger basement.
  temperature_default: 1.0
  session_temp_floor: 0.7
  # 0.7 (was 0.4): the paragraph-orbit failure survives 0.5 — every Qwen3
  # official profile is temp >= 0.6, so 0.4 was someone else's basement.
  temperature_floor: 0.7
  top_p: 0.95
  top_k: 40
  min_p: 0.01
  presence_penalty: 0.0
  # 1.0: the vendor coder-next card disables repeat penalty; the old 1.1
  # couldn't see the ~800-token orbit through the 64-token window anyway.
  repeat_penalty: 1.0
  # Widened penalty window (llama.cpp default 64 tok is blind to the
  # ~800-token orbit) — gives the degen-retry recipe's presence bump teeth.
  penalty_last_n: 2048
  # DRY REMOVED 2026-07-22 (isolation test): DRY broke the *verbatim* orbit
  # but the model re-looped the STRUCTURE with a variable slot injecting
  # random tokens (`quantum foam`, `mitochondrial disruptor sequencing`) to
  # dodge DRY's penalty — high token diversity that BLINDS the distinct-ratio
  # long-cycle guard, so it ran uncaught to the 33k watchdog ceiling (0/14
  # goals; runaway_captures 20260722T205315/210745). DRY-off restores the
  # coherent orbit that the guard CAN catch → degen retry can then fire.
  # Parked prereq before re-enabling: does DRY's window even see replayed
  # transcript tokens under session_full_replay, or start empty each turn?
  # (dev/qwen3_loop_research.md open question — flagged, shipped past.)
  # On a degenerate turn abort (repetition/long-cycle guard), purge and
  # re-drive the turn once at the vendor recovery recipe.
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3-next-coder-80b-a3.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  status: not_yet_run
  expectation:
    registered: 2026-07-29
    tier: "2-1"
    stars: null
    basis: experience
    why: >
      The default in early Ouroboros development, superseded by gpt-oss for its
      more tractable CoT. Widely regarded as the best native non-thinking coding
      model. Fast and reliable with outstanding attendance to context; depth of
      reasoning limited by only 3B active parameters and no thinking. Expected
      high tier 2 / low tier 1.
    outcome: hit
    outcome_note: >
      HIT, at the pessimistic end. Predicted "high tier 2 / low tier 1"; scored
      49 — one point under the tier-1 line, with votes 45/49/51 straddling it.
      The reasoning was also right about the mechanism: fast and reliable with
      good context attendance (11 files, 0 py_fail, 0 degenerations, all Python
      parses), and the failure is a depth-of-reasoning one rather than a
      throughput one.

  judged:
    run: tier_20260731-050209 arm12 · staged/arm12
    judge_model: claude-opus-5[1m]
    votes: [45, 49, 51]
    total: 49              # MEDIAN of three independent blind judgements
    stars: 3               # 41-60 band
    tier: 2                # §5: the side taken by >=2 of 3 (two votes <50)
    rubric: TIER_RUBRIC v1.2
    record: dev/blind_panel/RESULTS_tier_2026-07-31.md
    run_shape: 121 min (backstop) · 11 files · 6 py_ok · 0 py_fail · 0 degen · 11/33 goals

    # Dimensions are judge 2's vector — a judge whose total equals the recorded
    # median. Stars: score/max as a percentage through the §2 band table
    # (0-20=1, 21-40=2, 41-60=3, 61-80=4, 81-100=5), inclusive at the top.
    dimensions:
      no_broken_functions: {score: 5, max: 20, stars: 2}
      robustness:          {score: 7, max: 10, stars: 4}
      ux:                  {score: 4, max: 10, stars: 2}
      conformance:         {score: 9, max: 10, stars: 5}   # 46/53
      ambition:            {score: 3, max: 10, stars: 2}
      creativity:          {score: 5, max: 10, stars: 3}
      org_project:         {score: 3, max: 5,  stars: 3}
      org_logic:           {score: 3, max: 5,  stars: 3}
      reusability:         {score: 8, max: 10, stars: 4}
      documentation:       {score: 2, max: 10, stars: 1}

    decisive_defect: >
      THE GAME BOOTS INTO A SEALED ROOM. `world.yaml` declares
      `start_room: storage_room`, and that room has `exits: {}` with nothing
      linking to it. Every direction word, abbreviation and phrasing is refused
      — judges tried up/down/in/out, bare n/s/e/w, walk/move/go to, enter, leave
      and ~60 movement attempts between them. From the shipped entry point the
      reachable game is two items in a closet: 8 of 9 rooms, both NPCs, all
      three monsters, the lair, the weapon, the armour and both terminal states
      are unreachable.
      THE ARTIFACT CARRIES THE EVIDENCE AGAINST ITSELF: a stray
      `player_state.json` at the tree root, referenced by no code, reads
      `location: mossy_clearing` — the real hub — and `storage_room` is the only
      one-line description among eight richly written ones. A one-line data fix
      separates a closed closet from a substantially working game.

    second_decisive: >
      Fixing that line would not make it completable. There is NO WIN CONDITION
      ANYWHERE — `grep -riE 'victor|congratul|you win'` returns nothing, there is
      no boss entity in code or data, and the room the world calls "Boss's Lair"
      is guarded by a SECOND PLACEMENT of a regular monster. All three judges
      killed that occupant and got "You defeated Spectral Hunter!" and a prompt.

    shared_mutable_monsters: >
      A defect class new to this sweep, found in pass 2 by two judges
      independently: Monster objects are world-level SINGLETONS and
      `spectral_hunter` is placed in TWO rooms. Verified in play — three hits on
      the grove Hunter left the lair occupant at Health 26/35. Killing the grove
      one would leave the "boss" dead on arrival.

    equipment_is_inert: >
      Measured by ALL THREE judges as a controlled A/B, with identical numbers:
      3 damage dealt and 8 taken, with and without the Rusted Cutlass
      (attack_bonus 3) and Leather Jerkin (defense_bonus 2) equipped.
      `total_attack()` reads `equipment.get("weapon_bonus")` from a dict that
      only ever holds {"weapon", "armor"}, so the authored bonuses are dead.
      The weakness path is dead too: it compares the equipped WEAPON id against
      `monster.weakness`, while the Moonpetal Amulet is `type: key_item` and
      `_handle_equip` refuses to equip one. The healing potion is the only item
      in the game that does anything. SEVENTH consecutive artifact whose
      weakness item is miswired.

    unmet_requirements: [17, 32, 33, 34, 37, 39, 42]  # no flee anywhere; all
                                                      # three monsters run one
                                                      # identical combat script
                                                      # differing by one integer;
                                                      # no boss entity; no phase
                                                      # data or logic; no win
                                                      # path; no restart on
                                                      # defeat; save omits room
                                                      # contents and monster HP

    hygiene_note: >
      `save`/`load` do no path sanitisation (`f"{save_dir}/{filename}"` plus
      mkdir(parents=True)), so `save ../../x` would write and create directories
      outside the workspace. All three judges contained the probe to their own
      scratch and reported what it WOULD do rather than aiming it anywhere real.


      FAMILY: the qwen hybrid architecture makes advanced features — cache strategies, instance swarming — markedly harder to adapt than a plain transformer. Applies to every qwen arm.

