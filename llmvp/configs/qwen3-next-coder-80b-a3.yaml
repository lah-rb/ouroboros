app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3-next-coder-80b-a3"
  family: "chatml"
  # RESIDENT cache economics (dev/CACHE_STATE.md matrix): hybrid DeltaNet — measured full-stack 2026-07-02 (append-only residency + seq_cp forks are SAFE on the hybrid; it is per-turn state SURGERY that corrupts recurrent state).
  swa_full: true
  kv_unified: true
  resident_seq_cache: true
  path: /Users/lah-rb/.lmstudio/models/noctrex/Qwen3-Coder-Next-MXFP4_MOE-GGUF/Qwen3-Coder-Next-MXFP4_MOE_BF16.gguf
  n_ctx: 262144
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  flash_attention: true
  batch_size: 512
  thinking: false
  # Hybrid recurrent state: per-turn save/load splicing is unsound
  # (upstream llama.cpp #22384) — sessions re-prefill from history.
  session_full_replay: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 262144
  # 0.8 base (raised from 0.6): flows scale temp DOWN per task via t*<1.0, so a
  # higher base keeps task-scaled temps out of the low-temp regime that worsens
  # this model's repetition looping (see repeat_penalty below).
  temperature_default: 0.8
  # This model hits the session repetition attractor earliest (sparse
  # MoE). The floor targets deep session turns specifically — the
  # surgical version of the global temperature bumps used before.
  session_temp_floor: 0.5
  # Refuse to sample below 0.4 for ANY request — every live runaway
  # sat in the 0.24-0.32 band the flow multipliers produce.
  temperature_floor: 0.4
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  presence_penalty: 0.0
  # 1.1 (from 1.0/off): Qwen's documented mitigation for Qwen3-Next's
  # long-context repetition/endless-generation (unclamped Gated-DeltaNet decay,
  # unfixed upstream in llama.cpp). Light touch — higher hurts coding quality.
  repeat_penalty: 1.1
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3-next-coder-80b-a3.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
