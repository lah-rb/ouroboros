# GLM-4.7-Flash (Zhipu) — mudler APEX I-Balanced.
#
# THE SURPRISE IS THE ATTENTION. The GGUF reports arch=deepseek2, not a glm
# arch: this model uses MLA (multi-head latent attention) — n_kv_head 1 with
# head_dim 576 — so KV costs 106 KiB/token against laguna's 192, hy3's 324 and
# gemma-4-26B's formula figure of 480. Combined with 22.1 GB of weights that
# makes it the roomiest model in the fleet by a wide margin:
#
#   n_ctx    KV GB   weights+KV
#    65536     7.1        29.1
#   131072    14.2        36.2   <- THIS CONFIG
#   202752    22.0        44.1   full trained range, still trivial here
#
# 131072 is chosen for comparability with the rest of the fleet rather than
# because anything forces it. The trained range is 202752 and there is room for
# all of it; raise n_ctx, graphql.max_tokens and generation.max_tokens_default
# together if a run wants it.
#
# FAMILY: formats/glm4.yaml, new for this model. Two things to know — the
# document prefix is [gMASK]<sop> and [gMASK] is ALSO the BOS id (154822), so
# exactly one emitter is allowed or the model sees it twice; and thinking-off is
# a bare prefilled </think>, laguna's close-only mechanic rather than an omitted
# opener.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 202752
  max_aliases: 50
  introspection_enabled: true

model:
  name: "glm-4.7-flash"
  family: "glm4"
  path: /Users/lah-rb/.lmstudio/models/mudler/GLM-4.7-Flash-APEX-GGUF/GLM-4.7-Flash-APEX-I-Balanced.gguf
  # RAISED 131072 -> 202752 on 2026-07-29 from the measured ceiling
  # (probe_verified_n_ctx below). KV 53 KiB/token x 202752 = 11.0GB
  # + 22.1GB weights = 33.0GB resident at boot.
  n_ctx: 202752
  # MEASURED 2026-07-29 (--probe-context): 54144 B/tok vs a 108288 formula (2.00x over — swa_full:false keeps the windowed
  # layers windowed, and the formula assumes a full cache on every layer).
  kv_bytes_per_token_measured: 54144
  probe_verified_weights_bytes: 22051833184
  probe_verified_n_ctx: 202752
  model_max_context: 202752
  # 40 against a computed 36.2 GB. Generous because there is nothing to guard
  # against at this size — the point of the number is that it still refuses a
  # run-away n_ctx, not that it is tight.
  kv_preflight_gb: 40
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # same treatment as qwen3.6 (operator)
  thinking_available: true
  thinking: "on"
  swa_full: false
  # FLIPPED 2026-07-30 per run cells_20260729-232251 (dev/caching/EXPERIMENT.md §Results): B08 measured resident+unified
  # flat (9 tok/turn fresh, needles intact, full 202,752 window undivided).
  kv_unified: true
  session_full_replay: true
  # FLIPPED 2026-07-30: replay cost 521.4s of prefill per 16-turn realistic
  # session vs 65.1s resident+unified = 8.2x. MLA needs no swa_full (measured).
  resident_seq_cache: true
  # ADDED 2026-07-30: the stateless flow cache (M9 seq-ops band). Measured
  # on glm at realistic head sizes: HIT saves 3.51s/call = 49% of prefill
  # (corrected pilot, 11/11 hits). The 2026-06 ban hit the M8 save_state
  # BLOB implementation; this band shares none of that mechanism. Under
  # kv_unified the band divides nothing.
  flow_kv_cache: true

prompt:
  persona_file: "./knowledge/SOUL.md"
  system_prompt: "You are a helpful assistant."

generation:
  # ── ZHIPU'S OWN AGENTIC SETTINGS (zai-org/GLM-4.7-Flash card) ───────
  # The card gives THREE profiles, and the one that matters here is the agentic
  # one — Ouroboros work is Terminal-Bench/SWE-bench shaped, not chat:
  #
  #   general              temp 1.0  top_p 0.95  max_new_tokens 131072
  #   Terminal Bench /     temp 0.7  top_p 1.0   max_new_tokens  16384   <- THIS
  #     SWE-bench Verified
  #   tau^2-Bench          temp 0.0              max_new_tokens  16384
  #
  # WHAT THE 2026-07-29 ARM ACTUALLY RAN: temp 0.6, top_p 0.95, top_k 20, and a
  # 131072 budget — the GENERAL profile's ceiling, 8x the agentic one. It
  # generated 70,687 tokens on one build_structure step before being killed at
  # 83 minutes, i.e. 4.3x the vendor's agentic maximum. That arm was neither a
  # fair test of the model nor a clean reproduction of llama.cpp #19613
  # ("continues to re-think and refine code after thinking block"), because it
  # was never inside the envelope the vendor documents for this kind of work.
  #
  # ── AND WE RUN MAXIMIZED ANYWAY, DELIBERATELY ───────────────────────
  # 16384 is the vendor's agentic recommendation and we are NOT using it. The
  # fleet runs max_tokens at the per-stream ceiling, and a model that abuses
  # that is signal worth seeing rather than masking. THIS IS THE MODEL TO WATCH.
  #
  # THE CAVEAT THAT MATTERS: the degeneration guards do NOT cover this failure.
  # On 2026-07-29 GLM generated 70,687 tokens on one build_structure step and
  # the long-cycle guard stayed SILENT across ~35 windows — correctly, because
  # the output was never repetitive. It kept writing coherent new text. Both
  # guards we own detect REPETITION; this model's failure mode is CONTINUATION,
  # and there is nothing behind it. Compare llama.cpp #19613, "continues to
  # re-think and refine code after thinking block", still open.
  #
  # So the only real bound here is the arm's wall-clock backstop. The cost of
  # being wrong is one tier arm, which is a price knowingly accepted; it is not
  # a risk the guards are quietly absorbing.
  max_tokens_default: 202752
  temperature_default: 0.7
  # ── QWEN-STYLE TEMPERATURE FLOOR (2026-07-29) ───────────────────────
  # Floor == default, so no flow multiplier can pull sampling below it. This is
  # the qwen3.5-122b pattern (0.7/0.7/0.7), adopted here for a measured reason.
  #
  # The 2026-07-29 arm looped in the architecture-coherence critic — the capture
  # is self-interrogation cycling every ~3.8KB ("Is there any ambiguity in X?"
  # -> "Result: Coherent." -> "Wait, let me re-read...") — and its meta records
  # temperature 0.06999999999999999. That is 0.7 x the 0.1 flow multiplier: BELOW
  # the 0.24-0.32 band every previously observed runaway sat in, and the lowest
  # effective temperature recorded on this machine today.
  #
  # TWO FAILURES, ONE PLAUSIBLE CAUSE. The same arm also produced a
  # non-repetitive 29,022-token generation the long-cycle guard could not see.
  # At an effective 0.07 the sampler is near-greedy, so if EOS is never the
  # argmax the model has no path to stopping — which would make the runaway a
  # SAMPLING artifact rather than the model ignoring its stop token. That is a
  # hypothesis this floor tests directly: if the continuation stops too, low
  # temperature was the trigger for both.
  temperature_floor: 0.7
  session_temp_floor: 0.7
  top_p: 1.0
  # DELIBERATELY UNSET. The card specifies no top_k for any profile; the old
  # value of 20 was a conservative MoE guess of ours, and a top_k that tight is
  # a real constraint on a model the vendor evaluates without one.
  top_k: 0
  min_p: 0.0
  repetition_guard_enabled: null
  long_cycle_guard_enabled: null
  # NOT WIRED: the card also asks for "Preserved Thinking" mode on multi-turn
  # agentic tasks (reasoning retained across turns). We strip reasoning between
  # turns, so this is a known divergence from the recommended setup rather than
  # an oversight — worth revisiting if GLM proves admissible.

knowledge:
  tokens_bin: ./data/glm-4.7-flash.tokens.bin
  token_limit: 32768

resources:
  decode_mode: pool
  cpu_threads: 16

logging:
  enabled: true
  directory: ./logs

