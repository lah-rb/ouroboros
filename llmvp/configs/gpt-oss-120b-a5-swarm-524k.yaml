# PRODUCTION SWARM CONFIG — gpt-oss-120b-a5, shared cell pool 524288.
#
# MEASURED CEILING LADDER (2026-07-26, dev/memguard_boot_probe.sh, steady
# wired with nothing else running). The REAL wired limit on this box is
# `sysctl iogpu.wired_limit_mb` = **113 GB**, not the 116 that several docs
# and configs assumed:
#
#     n_ctx    predicted   measured   under 113
#     393216      94.4       91.1      21.9 GB   (the old production value)
#     524288     104.0      100.6      12.4 GB   <- THIS CONFIG
#     589824     108.7      105.2       7.8 GB   tested READY, reasonable for
#                                                batch work where nothing else
#                                                runs; 5% more pool, 4.6 GB
#                                                less headroom
#     655360     113.7      109.9       3.1 GB   boots, but leaves 0.8 GB FREE
#                                                on a 128 GB box — not viable
#
# Marginal cost measured at 71.7 KB/token against 72.0 predicted — the model
# is exact; the constant -3.4 GB offset is fixed, not drift. 720896 would land
# ~114.6 and is above the limit.
#
# WHY 524288 AND NOT HIGHER: 393216 was conservative by ~33%, and the earlier
# "BREACH" verdict on 524k was an artifact of a probe ceiling set at 100 GB —
# it measured 100.6, missing by 0.6 GB against a guard 12 GB below the real
# limit. 589824 is genuinely fine for a dedicated batch run; it is not the
# default because 7.8 GB of headroom has to absorb the agent process, Python,
# editors and any Docker VM, and at 655360 that budget is already spent.
#
# CONTRACT-SWARM config (BATCHED): gpt-oss-120b-a5 for the contract-swarm
# structural runs — n=symbols concurrent worker completions
# (swarm_generate_symbols fans out one stateless completion per symbol,
# uncapped: EOS ends generation, max_tokens_default is the ramble
# ceiling) plus the mission's own session traffic.
#
# Budget math (kv_unified: n_ctx is the SHARED cell pool across ALL
# working seats; cells are consumed per ACTUAL token — max_tokens never
# reserves anything — measured 2026-07-20, dev/serving_perf_reference.md):
# the client-side pool-fit gate in swarm_generate_symbols admits the full
# n=symbols fan-out only when estimated read context + generation margin
# fits 80% of n_ctx, and waves otherwise, so W=32 is an admission
# ceiling, not a promise of 32 huge streams. n_ctx 131072 = the
# known-good single-context footprint on this box (swa_full KV ≈ 9.2G;
# see the gameab config's wired-ceiling math). Aggregate decode rises
# monotonically with stream count (56→89 tok/s at N=1→6; ~200 at N=64);
# early-EOS workers release cells + decode share back to the big ones.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 131072
  max_aliases: 50
  introspection_enabled: true

model:
  name: "gpt-oss-120b-a5"
  family: "harmony"
  path: /Users/lah-rb/.lmstudio/models/unsloth/gpt-oss-120b-GGUF/gpt-oss-120b-F16.gguf
  # RAISED 524288 -> 744448 on 2026-07-29 from the measured ceiling
  # (probe_verified_n_ctx below). KV 72 KiB/token x 744448 = 54.9GB
  # + 65.4GB weights = 120.3GB resident at boot.
  # 2026-07-30 BOOT-FAILURE POST-MORTEM (measured end-to-end): 744,448 was
  # probe-verified at n_seq_max=131 and served this morning at 133 — but at
  # the 141-seq layout (+8 flow band) it Metal-OOMs at the FIRST DECODE
  # even on a `sudo purge`d box with 118 GB free (status 5, pos 0). The
  # page-cache theory is falsified; the band seqs genuinely tipped the
  # knife-edge, so the 744448 record is invalid under the current map.
  # 524,288@141 boots (measured same day). 589,824@141 is the bisect rung —
  # every earlier attempt at it died at the formula preflight, never
  # reaching Metal, so it was UNTESTED until now.
  n_ctx: 589824
  probe_verified_weights_bytes: 65369017728
  # 2026-07-26 ladder measured rung (105.2 GB steady wired, old seq
  # layout); live-validating under the 141-seq map 2026-07-30.
  probe_verified_n_ctx: 589824
  # Refuse arithmetically-impossible loads before Metal allocates. Set from
  # the REAL wired limit (113 GB) minus working headroom, not the 116 that
  # was assumed before it was checked.
  kv_preflight_gb: 106
  # model max context (trained per-stream range) vs n_ctx (the swarm
  # max context: the shared KV cell pool). No single stream may exceed
  # this, however large the pool. (2026-07-24 context-ladder split.)
  model_max_context: 131072
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: true
  thinking_mode: medium
  swa_full: true
  kv_unified: true
  # FLIPPED 2026-07-30: the batched flow band shipped (BUILD = range-copy
  # off a completed stream's seat on the decode thread; HIT = whole-seq
  # install via the control inbox). The 2026-06 revert hit the M8 blob
  # implementation; this shares none of it. Under kv_unified the band
  # adds 8 seq ids and divides nothing. Measured payout at realistic head
  # sizes: 3.51s/call = 49% of prefill (glm pilot; gpt-oss prefill is
  # faster so the absolute saving is smaller, the fraction similar).
  flow_kv_cache: true
  session_full_replay: true
  resident_seq_cache: true
  context_refresh_drain_s: 300
  reasoning_head_swap: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  # Ample default — design_and_plan and the contract author run at high/
  # medium reasoning and must not be starved (a low default silently cut
  # the architecture generation to an EMPTY response: gpt-oss burns the
  # budget on CoT before emitting content). Swarm WORKERS carry no
  # override, so this default is also their ceiling — it only binds on a
  # ramble (EOS ends honest work), and the worker layer names that
  # failure honestly instead of retrying it.
  max_tokens_default: 32768
  temperature_default: 1.0
  top_p: 1.0
  top_k: 0
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.05
  session_temp_floor: 0.35
  streaming_default: true

knowledge:
  tokens_bin: "./data/gpt-oss-120b-a5.tokens.bin"
  token_limit: 32768

resources:
  decode_mode: "batched"
  cpu_threads: 15
  # W: admission ceiling for the n=symbols fan-out (engine proven to 64
  # streams). The client-side pool-fit gate is the real load governor.
  # UNCAPPED (field omitted) as of 2026-07-26 — resolves to the measured-safe
  # default of 128 working seats. The old explicit 32 was costing ~40% of
  # achievable throughput (144.7 tok/s at N=32 vs 202.5 at N=64, ladder in
  # dev/decode_ceiling/). Seats are nearly free; the REAL limiter is pool
  # cells, enforced by the swarm pool-fit gate against estimated context.
  # Set an explicit value to pin the width for a controlled A/B or a
  # latency-bounded workload.
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER RECORD (doc-only; see DOC_ONLY_KEYS in core/config.py) ──────
# Two halves, never merged: `judged` came from a blind judge who saw only a
# stripped artifact and a redacted rubric; `observed` from the operator who
# watched the run. A judge must never see `observed` (TIER_RUBRIC §7), so it
# stays a sibling key rather than a note nested inside the judgement.
# SCORED TWICE, two rounds apart. The CURRENT record is `judged_2026_07_31`
# below; the 2026-07-29 block that follows it is kept as history, not replaced.
# (This is the same config measured again, not a variant — the "one config, one
# score" rule is about VARIANTS, which get their own file via `extends:`.)
#
# 54/100 under v1.0, then 53/100 under v1.2, on the same config in different
# rounds against different rubric versions. One point apart. That is the
# strongest reproducibility evidence the instrument has produced.
tier:
  status: recorded
  rubric: TIER_RUBRIC v1.2        # CURRENT score; the v1.0 record is below
  stars: 3                        # 41-60 band; 53/100
  tier: 1                         # >= 50

  judged_2026_07_31:
    run: tier_20260731-050209 arm04 · staged/arm04
    judge_model: claude-opus-5[1m]
    total: 53
    record: dev/blind_panel/RESULTS_tier_2026-07-31.md
    dimensions:
      no_broken_functions: {score: 6, max: 20, stars: 2}
      robustness:          {score: 6, max: 10, stars: 3}
      ux:                  {score: 7, max: 10, stars: 4}
      conformance:         {score: 9, max: 10, stars: 5}   # 49/53
      ambition:            {score: 4, max: 10, stars: 2}
      creativity:          {score: 5, max: 10, stars: 3}
      org_project:         {score: 2, max: 5,  stars: 2}
      org_logic:           {score: 3, max: 5,  stars: 3}
      reusability:         {score: 9, max: 10, stars: 5}
      documentation:       {score: 2, max: 10, stars: 1}

    decisive_defect: >
      THE WIN IS UNEARNED. Victory in FOUR commands from a cold start,
      bare-handed: `go north` x3 then `attack ancient dragon`. Weapon, armour,
      potion, hidden weakness item, both guard monsters and both NPC hint
      chains are all optional decoration — nothing gates the lair.
      COMPOUNDED BY THE PHASE SYSTEM: the phase-2 transition sets
      `monster.behavior = "enraged"`, but the monster-turn dispatch handles only
      aggressive/defensive/coward — so "the dragon roars, entering a furious
      second phase" is the moment the boss STOPS ATTACKING. Death is unreachable
      too: the whole world deals ~68 damage against 100 starting HP.

    the_duplicate_tree: >
      Ships a parallel `src/` implementation — ~1000 lines of incompatible
      duplicate modules under the same names as the live ones. It cannot run:
      `python3 src/main.py` and `python3 -m src.main` both traceback, and there
      is no `src/loader.py` or `src/save_system.py`. It inflated this arm's file
      count to 18 (vs 14 for the pool arm) and was the reason the operator's
      first read called this the strongest run of the sweep. It was the LARGEST.

    counters_inverted_again: >
      18 files / 13 py_ok / 29-of-34 goals against the pool arm's 14 / 7 /
      25-of-35 — and scored SEVEN POINTS LOWER (53 vs 60). Fifth consecutive
      round in which goal counters have inverted against blind play.

    strategy_note: >
      S3 vs the S2 pool arm (60/100) is CONFOUNDED: arm04 was also the first
      arm on vendor-correct sampling (top_k 0 no-limit; arms 01-03 were served
      40). S3 and post-fix sampling moved together. What can be said is that the
      extra output did not buy quality, and much of it was dead weight.

    unmet_requirements: [29, 32, 39, 51]   # 2 regular monsters (the data's
                                           # third IS the boss); no distinct
                                           # behaviours (aggressive/defensive
                                           # dispatch identically, `coward` is
                                           # assigned to nobody); no restart on
                                           # death; no dialogue branching

  # ── PRIOR ROUND, 2026-07-29, under TIER_RUBRIC v1.0 — HISTORY ───────
  # Kept unrevised. Its decisive defect is the same FAMILY as the 07-31 one and
  # the pair is the point: this model's recurring weak spot is WIN GATING.
  #   2026-07-27  no win condition existed anywhere in the tree
  #   2026-07-29  win by FLEEING, six commands from a cold start
  #   2026-07-31  win unearned, four commands from a cold start
  # Three consecutive rounds, same seam class, and the pool sibling the same day
  # (60/100) got the gating RIGHT while collapsing the set-piece instead.
  prior_2026_07_29:
    rubric: TIER_RUBRIC v1.0        # v1.1 amended after; see its changelog
    stars: 3                        # ★★★  54/100
    tier: 1                         # >= 50

  # 3★ is the 40-59 rejudge band, which normally costs two more independent
  # judgements. WAIVED BY OPERATOR on the strength of tens-to-hundreds of
  # millions of tokens run through this model while building the framework —
  # the score matched the pre-registered expectation ("a moderately scoring
  # tier 1") and there is no genuine uncertainty about where it sits. Recorded
  # as an override, not as a settled 3-vote result: a later reader must be able
  # to see that no rejudge happened.
  rejudge: waived_by_operator

  # PRE-REGISTERED, and stated BEFORE the judge ran (2026-07-29, in session).
  # Recorded after the fact only because the expectation mechanism was written
  # later the same day; the wording is the operator's, unchanged.
  #
  # IT HIT. Predicted "a moderately scoring tier 1"; judged 54/100 — tier 1 by
  # two points, and about as mid-band as the scale allows. First live use of the
  # only drift detector left after anchors were dropped, and it agreed.
  expectation:
    registered: 2026-07-29
    tier: "1"
    stars: 3
    basis: experience
    outcome: hit
    why: >
      A moderately scoring tier 1. Notes expected to cover its general
      flexibility in adapting to new features, its reliability under framework
      faults, and its speed. Basis is tens to hundreds of millions of tokens run
      through this model while developing the framework.

  judged:
    run: tier_20260729-010118 arm 4 · staged/arm04
    judge_model: claude-opus-5[1m]
    total: 54
    # Per-dimension stars are score/max banded per §2 (see below) — different maxima
    # BANDS (rubric §2, inclusive at the top): 0-20=1, 21-40=2, 41-60=3,
    # 61-80=4, 81-100=5. So 40%% is 2 stars, 60%% is 3, 80%% is 4.
    # normalised so the SHAPE reads at a glance, which is the whole point of
    # abstracting to stars.
    dimensions:
      no_broken_functions: {score: 7,  max: 20, stars: 2}
      robustness:          {score: 4,  max: 10, stars: 2}
      ux:                  {score: 6,  max: 10, stars: 3}
      conformance:         {score: 9,  max: 10, stars: 5}   # 49/53 requirements
      ambition:            {score: 5,  max: 10, stars: 3}
      creativity:          {score: 5,  max: 10, stars: 3}
      org_project:         {score: 4,  max: 5,  stars: 4}
      org_logic:           {score: 3,  max: 5,  stars: 3}
      reusability:         {score: 8,  max: 10, stars: 4}
      documentation:       {score: 3,  max: 10, stars: 2}   # hard-capped, §3.10

    profile: >
      Strong on conformance, structure and modifiability; weak on working-ness
      and documentation. The judge's own summary — "finished components,
      unfinished seams."

    decisive_defect: >
      WIN BY FLEEING. run_combat returns one boolean for two outcomes, and its
      own docstring admits it ("Returns True if the player survives (by
      defeating the monster or fleeing)"); initiate_combat reads it as victory.
      Six commands from a cold start — no weapon, no armour, no amulet, no NPC
      contact — print "=== VICTORY ===". Fleeing a regular monster also deletes
      it from the world and records it as a corpse. This nullifies the
      two-phase boss, the hidden weakness item and both NPC hint chains, i.e.
      every part of the design the artifact got right.

    strengths: >
      NOTHING ORPHANED — every room, item, NPC and monster authored in YAML is
      reachable in play. That is the failure mode which decided most prior
      panels and this artifact does not have it. Modification probe landed all
      three tasks first try, with a new room + item needing ZERO Python edits.

    unmet_requirements: [29, 39, 44, 51]   # 2 regular monsters not 3; no restart
                                           # after death; 7 rooms not 8; dialogue
                                           # is a flat list, not branching

  observed:
    run: tier_20260729-010118 arm 4 (2026-07-29)
    stage: game_challenge_tier · top_phase quality · structural_mode batch · 2h wall
    boot_s: 41
    exit: rc=0 at the full 120min backstop, mission parked `paused`
    goals: 28/36
    syntax: 7 py_ok / 0 py_fail
    degeneration: 0
    artifact: 17 files, staged clean (identifier scan passed)
    shutdown: released the server in ~1s at the backstop — bounded generations
              hand over cleanly, unlike an abandoned one
    note: >
      Counters vs play, again. This arm led the batch on goals (28/36 vs 6/37)
      and shipped zero syntax failures, and still lands mid-band because the
      thing it built can be won by running away. Goal counters have inverted
      against blind play in four consecutive rounds; treat them as progress
      telemetry, never as the instrument.
    prior_contrast: >
      On 2026-07-27 this model's decisive defect was the INVERSE — no win
      condition existed anywhere in the tree while the defeat path shipped
      complete. The win path now exists and fires too easily. Same seam, opposite
      failure; worth watching whether that asymmetry recurs.
