# ── VISION-BENCH VARIANT (2026-08-23) ────────────────────────────────
# Identical to qwen3.8-27b.yaml except the TEXT n_ctx is 262144 -> 32768.
#
# WHY: loading this model as a HOT SECONDARY alongside muse for the VL
# re-measurement, the residency governor refused with
#   "qwen3.8-27b needs 89.2 GB on MTL0; 27.7 GB already hot there against a
#    105.3 GB budget"
# — 68 GB of that is TEXT KV at the 262144 ceiling (65536 B/tok measured),
# and a figure-transcription bench never touches the text path. The vision
# path has its own vision_n_ctx. Trimming the unused context is what makes
# both candidates resident at once, which is the point: routed per request
# with nothing drained between them, so neither gets a cold-cache advantage.
#
# NOT a tuning change. Do not use this config for text work — 262144 is the
# probe-verified ceiling and belongs to the canonical config.
#
# ── Qwen 3.8 27B — takes the 3.6-27B slot (2026-08-17) ──────────────
# Replaces llmvp/configs/archive/qwen3.6-27b.yaml, the greenfield Tier-1
# UNANIMOUS winner (2026-07-24, two independent Opus judges, aggregate 48.0 vs
# step37 43.0 vs gemma 30.5) and the only winnable qwen artifact ever produced.
# That is the bar this checkpoint inherits, and the reason the league below is
# unchanged: a like-for-like slot swap is only readable if the league is.
#
# WHAT IS ACTUALLY NEW (read from the GGUF headers + embedded template, all
# verifiable without a boot — dev/gguf_geometry.py, dev/qwen38_chat_template.jinja):
#
#   arch=qwen35, 65 blocks (64 + 1 MTP), n_head 24, n_kv_head 4, head_dim 256,
#   trained ctx 262144, rope_freq_base 1e7, vocab 248320, Q6_K 22.9 GB decimal.
#
#   1. A REAL DEPTH DIAL. 3.6 had binary think-on/off. 3.8 adds an independent
#      three-level reasoning_effort (xhigh default / medium / low) rendered as
#      a sentence atop the system message, and aliases high -> xhigh in its own
#      template. medium emits NOTHING — it is the neutral baseline. low is
#      SHALLOW, not off. This needs formats/qwen38.yaml; putting it in
#      formats/qwen.yaml would corrupt 3.5/3.6 renders. Byte-parity across all
#      four canonical levels is pinned by
#      test_qwen38_rendering_matches_official_template.
#
#   2. MTP / nextn is PRESENT AND BOUND. qwen35.nextn_predict_layers=1, tensors
#      at blk.64.nextn.*, and — unlike the EAGLE-3 and DeepSeek-DSpark dead
#      ends — llama-cpp-python DOES export the primitives
#      (llama_model_n_layer_nextn, llama_set_nextn_layer_offset,
#      llama_get_embeddings_nextn / _set_). LM Studio reports ~50% acceptance
#      (operator). NOT ENABLED HERE: the primitives existing is not the same as
#      a working draft loop through our backend, and Metal speculative has been
#      net-negative before. `speculative` stays false until measured on this
#      machine. See the OWED PROBES block.
#
#   3. MULTIMODAL. Vision tower (qwen3_5_vision) + mmproj-F16.gguf ship beside
#      the weights, image/video pad tokens are in the template. Serving it is
#      the /v1/vision path's business, not this config's; recorded so nobody
#      re-derives "text-only" from the config alone.
#
#   4. STILL GDN-HYBRID, so the loop posture carries over unchanged. layer_types
#      is 3x linear_attention + 1x full_attention repeating
#      (full_attention_interval 4), and the GGUF carries ssm.* keys. The
#      paragraph-ORBIT risk is a family trait of this substrate — temp floors do
#      not cure it, they only hold the line — and it also means this config
#      cannot host the batched swarm substrate.
#
# ── PROBE RESULTS (2026-08-17, dev/qwen38_dial_probe.py, n=2/arm) ────
#   b) GRAPH SPLITS: 2 (clean; the DeepSeek pathology was 44-on-43-layers).
#      b10355 genuinely supports qwen35 on Metal. PASSED.
#   c) EXTRACTION: 12/12 completions well-formed (<think>...</think>\n\n
#      content <|im_end|>, correct EOG), 12/12 non-empty extraction, and
#      12/12 CORRECT on a multi-phase rate problem. No muse-style marker
#      echo, no empty-block class. PASSED.
#   d) THE DIAL MOVES — with a persona caveat that matters for routing:
#        neutral persona: low 772/764 < medium 1279/991 < xhigh 1517/1184
#          (monotonic BOTH runs — a real working dial, ~1.7x spread)
#        SOUL persona:    low 706/524 | medium 1003/1126 | xhigh 688/898
#      `low` separates reliably under BOTH personas. Under SOUL the
#      medium/xhigh order FLIPPED across runs and total depth compressed
#      ~40% vs neutral — a DAMPENER, not the gemma-style veto. Routing
#      implication: low-vs-high is trustworthy in production; treat
#      medium-vs-xhigh as unproven under the agent persona (n=2).
#   e) MTP: resolved WITHOUT a boot — the binding exports the nextn
#      primitives (n_layer_nextn, set/get_embeddings_nextn[_ith]) but has
#      NO draft-loop integration (LlamaDraftModel is n-gram only). Wiring
#      MTP = build the loop ourselves (enable nextn embeddings, project,
#      draft, batch-verify): a real engineering task with Metal-regression
#      risk, NOT a config flag. LM Studio's ~50% acceptance is theirs.
#
# ── PROBE a) CONTEXT CEILING — retired 2026-08-17 ────────────────────
# ctx_probe_20260817-164957: rung 262144 PASSED (load + 3/3 decode,
# peak wired 44.2 GB), probe_verified_* written by the probe itself, and
# kv_bytes_per_token_measured=65536 promoted from derived to MEASURED —
# the probe's own summary line reads "KV 64 KiB/tok measured". All five
# onboarding probes are now closed: a (this), b/c/d (probe-results block
# above), e (resolved static — no draft loop in the binding).
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 262144
  max_aliases: 50
  introspection_enabled: true

model:
  name: "qwen3.8-27b"
  family: "qwen38"  # NOT "qwen" — 3.8 added a depth dial 3.5/3.6 do not have
  path: /Users/lah-rb/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q6_K.gguf
  # Full trained range, PROBE-VERIFIED (ctx_probe_20260817-164957): the
  # 262144 rung loaded and decoded 3/3 with peak wired 44.2 GB. Measured KV
  # is 65536 B/tok (64 KiB) — a 4.06x overshoot by the header formula, same
  # as 3.6 measured: full_attention_interval 4 means only 16 of 64 layers
  # hold a growing cache. At this ceiling: 22.9 GB weights + ~17.2 GB KV.
  n_ctx: 32768
  kv_bytes_per_token_measured: 65536
  probe_verified_weights_bytes: 22884408288
  probe_verified_n_ctx: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  # ── THINKING LEVERS ────────────────────────────────────────────────
  # Always-on thinking with a depth dial (the step-3.7 shape), NOT a
  # think/no-think switch. The router supplies the level per step; `on` keeps
  # the <think> opener prefilled on every turn and lets the effort sentence do
  # the work. Unrouted calls fall to the neutral medium baseline.
  thinking_available: true
  thinking: "on"
  # Native four-tier support: low / medium / high / xhigh, with high and xhigh
  # collapsing onto the same sentence because the OFFICIAL template aliases
  # them. No clamp ladder needed — this family answers every canonical name.
  # Kept from the 3.6 slot so the swap reads like-for-like. NOTE this makes
  # resident_strip_reasoning inert either way (no resident session to strip).
  session_full_replay: true
  # ── STEP 3c: THE MULTI-TURN THINKING CONVENTION FLIPPED IN 3.8 ─────
  # Read from the assistant-history branch, which is the only place that ever
  # says. The default INVERTED between checkpoints:
  #   3.6: (preserve_thinking is defined and preserve_thinking is true)
  #        or (loop.index0 > ns.last_query_index)   -> last-turn-only
  #   3.8:  preserve_thinking is undefined or ... is true or ...
  #                                                 -> ALL turns, by default
  # So 3.8 is trained to SEE its own prior reasoning: the canonical history
  # keeps it, and stripping would put a resident session out of distribution —
  # the inverse of the muse-glimmer verdict. If this config is ever moved onto
  # resident_seq_cache, `resident_strip_reasoning` must stay FALSE.
  # (It renders '<think>\n\n</think>\n\n' for a turn with no reasoning, i.e.
  # the same empty-block shape as the thinking-off prefill — consistent.)
  resident_strip_reasoning: false
  # MTP present and bound, but unmeasured through our backend. See OWED PROBES.
  speculative: false

  # ── VISION (wired 2026-08-23) ──────────────────────────────────────
  # The vision tower (qwen3_5_vision) and mmproj-F16.gguf have shipped beside
  # these weights since intake and were never wired — the intake note said
  # vision was "the /v1/vision path's business" and then nobody gave that path
  # anything to serve. LAZY: nothing is allocated until the first vision
  # request, and the text path never touches it.
  #
  # vision_n_ctx is held at 32768 rather than the text ceiling: a figure
  # transcription is one image and one answer, and the vision context holds
  # its own KV for the process lifetime once built.
  mmproj_path: /Users/lah-rb/.lmstudio/models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
  vision_n_ctx: 8192
  vision_image_roots:
    - "~/ouroboros-runs"
    - "~/corpora"

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 131072
  # GDN-hybrid loop posture, carried over from 3.6 unchanged: same substrate,
  # same paragraph-orbit exposure. The floors bound the damage; they do not
  # cure it.
  temperature_default: 0.7
  temperature_floor: 0.7
  session_temp_floor: 0.7
  top_p: 0.95
  top_k: 20
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.0
  penalty_last_n: 2048
  # DRY stays REMOVED (2026-07-22 isolation test): it converted the catchable
  # coherent orbit into an uncatchable noise-slot structural loop that blinds
  # the distinct-ratio guard.
  degen_retry_enabled: true
  degen_retry_temperature: 1.0
  degen_retry_presence_penalty: 1.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/qwen3.8-27b.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

