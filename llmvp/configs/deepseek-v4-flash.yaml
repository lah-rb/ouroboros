# DeepSeek-V4-Flash-0731 — unsloth UD-IQ3_XXS. INTAKE 2026-08-03.
#
# The largest weights the fleet has ever carried (104.2 GB across 4 shards)
# and the first genuinely NEW architecture since onboarding began:
# `general.architecture = deepseek4`, with hyper-connections, a sparse
# attention indexer, and per-layer KV compression. Family spec derived and
# golden-tested against the GGUF's own template before any load —
# formats/deepseek4.yaml, template banked at dev/deepseek4_chat_template.jinja.
#
# ── ARCH SUPPORT VERIFIED BEFORE DOWNLOAD-TO-BOOT (the laguna lesson) ─
# Our llama.cpp carried `deepseek4` even at b10131 (now b10243). It ships three
# loader preconditions as literal abort strings; all three were checked
# against this file's header rather than discovered at boot:
#   1. "compress_ratios is shorter than block_count" — 46 >= 43   PASS
#   2. "only supports compression ratios 0, 4, and 128" — {0,4,128} PASS
#   3. "expects sqrtsoftplus MoE scoring" — expert_gating_func=4   PASS
# (Contrast laguna, which sat undeployable for weeks because the arch was
# absent from the build and nobody read the header first.)
#
# ── KV GEOMETRY (computed from headers, BEFORE any load) ─────────────
#   43 layers · k_len 512 · v_len 512 · kv_heads 1 (MLA-style latent)
#   -> (512+512) x 1 x 2B = 2 KiB/layer/token x 43 = 86 KiB/token
#   weights 104,207,848,032 B = 104.2 GB (4 shards, measured on disk)
#
#     n_ctx     KV GB   weights+KV    vs 137.4 GB physical
#      32768      2.9        107.1    safe
#      65536      5.8        110.0    (the first-contact setting)
#     196608     17.3        121.5    <- THIS CONFIG (formula; real KV
#                                     is ~1.3 GB, see the measurement below)
#     131072     11.5        115.8    reachable (cf. the 116.3 GB laguna
#                                     bartowski run, which held)
#     262144     23.1        127.3    over the practical ceiling
#
#   ⚠️ MEASURED 2026-08-03 (--probe-context): the formula is a 12x
#   OVER-ESTIMATE. Real KV is ~7 KiB/token, not 86 — at n_ctx 198,656 the
#   entire cache is 1,340 MiB. The prediction above was right in direction
#   and badly wrong in size: compress_ratios gives most layers a 4x or 128x
#   cache and the 128-token sliding window with a 512-way indexer means
#   almost nothing is held at full width.
#
#   MEASURED CEILING: probe_verified_n_ctx = 203,776 (from a 178,176 start,
#   +14.4%). Marked GUARD-BOUND by the probe: every failing rung was an
#   ARITHMETIC refusal that never booted, so 203,776 is a LOWER BOUND on the
#   hardware and says nothing about the band above it.
#
#   CONTEXT IS NOT THE BINDING CONSTRAINT — THE WEIGHTS ARE. Peak wired at
#   198,656 was 122.8 GB of which only 1.3 GB is KV: 104.2 GB of weights
#   plus ~17 GB of runtime overhead (compute buffers, the sparse indexer,
#   hyper-connection state). Buying context here is nearly free; the machine
#   is full before the cache matters.
#
#   RAISED 65,536 -> 196,608 on 2026-08-03 (operator: "that number is not
#   even close to the measured max"). 65,536 was first-contact caution —
#   exactly rope original_context_length, so YaRN applied no stretch — and
#   it was never revised after the probe. The caution does not survive the
#   measurement: KV here is ~7 KiB/token, so peak barely moves across the
#   whole range (122.8 GB at n_ctx 198,656, of which only 1.3 GB is cache).
#   The weights dominate; context is nearly free on this model, which makes
#   65,536 pure waste rather than prudence.
#   196,608 sits under the verified 203,776 with a small margin, and the
#   probe already generated 3/3 at 178k/188k/198k/203k — so the YaRN stretch
#   (3x from the 65,536 original) is exercised, not assumed.

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 196608
  max_aliases: 50
  introspection_enabled: true

model:
  name: "deepseek-v4-flash"
  family: "deepseek4"
  path: /Users/lah-rb/.lmstudio/models/unsloth/DeepSeek-V4-Flash-0731-GGUF/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf
  n_ctx: 196608
  model_max_context: 1048576
  probe_verified_weights_bytes: 104207848032
  # MEASURED 2026-08-03 (--probe-context, b10243). GUARD-BOUND: a lower
  # bound, since every failing rung was an arithmetic refusal.
  probe_verified_n_ctx: 203776
  # Kept at 118 even though n_ctx is now 196,608: the preflight is SKIPPED
  # while n_ctx <= the probed ceiling, and the budget only re-arms if that
  # verification is ever invalidated (a re-quant, per the staleness guard).
  kv_preflight_gb: 118
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048

  # ── THINKING LEVERS ───────────────────────────────────────────
  # Template default is enable_thinking=FALSE, and suppression is the
  # close-only prefill (laguna's third form). per_request so the fleet
  # routing rule applies: none/low -> the disabled form, medium/high ->
  # the opener, with high/max additionally prepending the effort paragraph.
  thinking_available: true
  thinking: "per_request"

  # FIRST CONTACT = SINGLE STREAM. Novel attention (hyper-connections,
  # sparse indexer, per-layer compression) has never met our batched
  # engine, and batched additionally REQUIRES swa_full — which on a model
  # whose sliding_window is 128 would inflate KV toward the naive 86
  # KiB/token upper bound. Prove it loads and decodes on the pool path
  # first, then evaluate batched with a measured KV figure.
  # Probe done; batched still deferred — it REQUIRES swa_full, which on a
  # 128-token sliding window would inflate KV toward the 86 KiB/token
  # upper bound and throw away the 12x the compression buys.
  decode_mode_note: "pool; batched deferred — swa_full would forfeit the KV win"
  swa_full: false
  kv_unified: false
  session_full_replay: true
  resident_seq_cache: false
  flow_kv_cache: false

prompt:
  persona_file: "./knowledge/SOUL.md"
  system_prompt: "You are a helpful assistant."

generation:
  max_tokens_default: 196608
  # Vendor sampling not yet read from the model card — these are the
  # cautious DeepSeek-family defaults. CONFIRM before scoring anything.
  temperature_default: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  repeat_penalty: 1.0

knowledge:
  # MUST be generated for this model — knowledge is PRE-TOKENIZED and this
  # is a 129,280-entry gpt2-style vocab (pre: joyai-llm). Feeding another
  # family's tokens.bin is silent garbage, not an error.
  tokens_bin: ./data/deepseek-v4-flash.tokens.bin
  token_limit: 32768

resources:
  decode_mode: pool
  cpu_threads: 16

logging:
  enabled: true
  directory: ./logs

# ── TIER (doc-only) ──────────────────────────────────────────────────
tier:
  league: contemplator  # LOAD-BEARING — agent/tier/runner.py:config_league
  status: not_yet_run  # history: llmvp/configs/archive/TIER_JUDGEMENTS.md
