# ── GREENFIELD TIER 3 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# Respectable, largely compatible — but SLOW (42 tok/s cold prefill, ~6-7
# tok/s decode; ~5 min per functional exchange at mission-scale prompts).
# Diagnosis quality was 2-for-2 verbatim-correct; eliminated on the one seam
# bug (str vs Command) it never got clock to diagnose. Effective window was
# ~55 min of its 2h (watchdog doom loop, since fixed: expectedEvalSeconds).
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 147456
  max_aliases: 50
  introspection_enabled: true

model:
  name: "mistral-medium-3.5-128b"
  # arch=mistral3 (verified from GGUF metadata). The tekken schema covers the
  # Mistral 3.x line as well as Small 4 — same [INST]/[SYSTEM_PROMPT] framing.
  family: "tekken"
  # DENSE 128B, 88 blocks, no expert_count — the contrast arm against
  # Small-4's 119B/128-expert MoE. IQ4_XS, ~67.1GB across 3 shards (shard 1 is
  # a ~7.9MB metadata-only split). A 10GB mmproj sits alongside (this model is
  # multimodal); we do NOT wire vision — text only for now.
  path: /Users/lah-rb/.lmstudio/models/unsloth/Mistral-Medium-3.5-128B-GGUF/Mistral-Medium-3.5-128B-IQ4_XS-00001-of-00003.gguf
  # Native context is 262144. Held at 131072 to match small-4 for
  # comparability AND because this is DENSE with 88 blocks, so its KV is far
  # heavier per token than the MoE — 67GB of weights plus a deep-layer KV has
  # to stay under the REAL 113GB wired limit (iogpu.wired_limit_mb; 116 was an unchecked assumption). Raise only with memory headroom
  # measured, not assumed.
  # RAISED 131072 -> 147456 on 2026-07-29 from the measured ceiling
  # (probe_verified_n_ctx below). KV 352 KiB/token x 147456 = 53.2GB
  # + 67.1GB weights = 120.3GB resident at boot.
  n_ctx: 147456
  probe_verified_weights_bytes: 67124438432
  probe_verified_n_ctx: 147456
  n_gpu_layers: -1
  seed: -1
  verbose: false
  # FALSE on purpose. The chat template gates reasoning behind
  #   [MODEL_SETTINGS]{"reasoning_effort": "none"|"high"}[/MODEL_SETTINGS]
  # which DEFAULTS to "none", and our renderer does not emit that block at
  # all — so the model cannot think regardless of what this flag says.
  # Declaring true would only arm the FSM's [THINK] handling for tags that
  # never arrive (and the unclosed-[THINK] swallow trap). Flip to true only
  # together with actually rendering the MODEL_SETTINGS block.
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # per_request (operator), WITH the head swap wired (the dial is head-borne:
  # [MODEL_SETTINGS] reasoning_effort in the static head). Parity is natural —
  # the "none" and "high" heads both tokenize to 12 tokens (single-token level
  # words in the tekken vocab), so no padding trick is needed; the splice's
  # equal-length check passes as-is.
  thinking_available: true
  thinking: "per_request"
  # The resting head level: default renders reasoning_effort:none, and only
  # the 'high' head gets pinned on the reasoning band (medium collapses onto
  # none). Requires resident_seq_cache (on, above... below).
  thinking_mode: low
  reasoning_head_swap: true
  # Re-prefill sessions from history rather than per-turn KV surgery. This is
  # the default (config.py session_full_replay: bool = True) — stated
  # explicitly so the strategy is visible at a glance.
  session_full_replay: true
  # ADDED 2026-07-30 per run cells_20260729-232251 (dev/caching/EXPERIMENT.md §Results): F1 measured resident flat
  # (needles intact, 73,728/seq). First turn is slow (39.1s prefill in the
  # sweep) but every later turn is ~1.1s — the dense prefill-bound profile
  # (boss run: 82% of wall was prefill) is exactly what resident relieves.
  resident_seq_cache: true
  # ADDED 2026-07-30: the stateless flow cache (M9 seq-ops band). Measured
  # on glm at realistic head sizes: HIT saves 3.51s/call = 49% of prefill
  # (corrected pilot, 11/11 hits). The 2026-06 ban hit the M8 save_state
  # BLOB implementation; this band shares none of that mechanism. Under
  # kv_unified the band divides nothing.
  flow_kv_cache: true
  kv_unified: true
  # Verified live 2026-07-22 on a trivial prompt. REQUIRES BOS: character salad without it, correct with it.
  # Both official templates specify <s>; this follows the evidence.
  template_bos: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 147456
  temperature_default: 0.5
  top_p: 0.95
  top_k: 0
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.05
  # Floors are standard practice at onboarding: Ouroboros scales temperature
  # DOWN per step (judge t*0.1, probe/provision t*0.2), so an unfloored 0.5
  # base reaches ~0.05-0.10 on some steps.
  temperature_floor: 0.4
  session_temp_floor: 0.5
  streaming_default: true

knowledge:
  tokens_bin: "./data/mistral-medium-3.5-128b.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  league: contemplator  # measured cyc/h — see dev/blind_panel/LADDER.md
  status: recorded
  rubric: TIER_RUBRIC v1.2
  stars: 3                 # 41-60 band
  tier: 2                  # median 49, below the >=50 line
  expectation:
    registered: 2026-07-29
    tier: "2"
    stars: null
    basis: experience
    outcome: hit
    why: >
      A dense, competent model that is extremely slow. Expected tier 2 on
      throughput grounds: limited revisions within the window, and a
      correspondingly low goal count.
    outcome_note: >
      HIT on the placement, WRONG on the mechanism. Tier 2 was predicted from
      SPEED — and speed was indeed the fleet's worst (~6 tok/s, one generation
      ran 24 minutes). But throughput is not what cost it: the arm produced 12
      files with ZERO syntax failures and 12/37 goals, a clear improvement on
      its smoke run. It lands at tier 2 because the thing it built cannot be
      played, not because it built too little.

  judged:
    run: tier_20260731-050209 arm10 · staged/arm10
    judge_model: claude-opus-5[1m]
    votes: [45, 49, 49]
    total: 49              # MEDIAN of three independent blind judgements
    record: dev/blind_panel/RESULTS_tier_2026-07-31.md
    run_shape: 120 min (backstop) · 12 files · 7 py_ok · 0 py_fail · 0 degen · 12/37 goals

    # Judges 2 and 3 independently produced IDENTICAL §3.1 arithmetic
    # (0.343672 -> 7/20) from separately constructed ledgers. Judge 1 billed the
    # seam at 5 rather than 7; that one dimension is the whole 45-vs-49 spread.
    dimensions:
      no_broken_functions: {score: 7, max: 20, stars: 2}
      robustness:          {score: 5, max: 10, stars: 3}
      ux:                  {score: 5, max: 10, stars: 3}
      conformance:         {score: 9, max: 10, stars: 5}   # 46/53
      ambition:            {score: 3, max: 10, stars: 2}
      creativity:          {score: 5, max: 10, stars: 3}
      org_project:         {score: 4, max: 5,  stars: 4}
      org_logic:           {score: 2, max: 5,  stars: 2}
      reusability:         {score: 7, max: 10, stars: 4}
      documentation:       {score: 2, max: 10, stars: 1}

    decisive_defect: >
      THE ROOM-GATE / ATTACK DEADLOCK. Movement refuses entry to any room whose
      monster is not yet defeated; `attack` only engages a monster in the room
      you are STANDING IN; and world.yaml places every monster INSIDE the room
      it guards. The two conditions are mutually exclusive, so the game
      announces "A Goblin blocks the way!" and then answers "There is nothing to
      attack here." No phrasing opens it — judges tried 11+ attack forms, every
      direction in long, short and bare-word form, with and without the weapon.
      Sealed behind it: all three monsters, the two-phase boss, the weakness
      mechanic, the victory screen, the defeat screen, the armour, and FIVE of
      the eight authored rooms. What ships is a three-room walking simulator.

    the_second_cause: >
      Both rejudges disclosed a SECOND, independent fatal defect hidden behind
      the seam: `combat.py` references `EquipmentSlot` and never imports it, so
      `monster_turn()` raises NameError unconditionally. Verified by diagnosis
      (calling it directly; artifact untouched). Repairing the movement seam
      alone would NOT produce a working fight — every combat would crash the
      process on the monster's first counter-attack. "Monsters fight back" is
      dead on arrival, not merely unreachable.

    weakness_item_inversion: >
      Fifth distinct miswiring of this mechanic in the sweep. Judge 3 forced
      entry by hand-writing a save.json and using the artifact's OWN `load`
      command (diagnosis through a supported interface, no repair): there,
      `use silver arrow` INSTANT-KILLS the 100 HP two-phase boss in one command
      taking zero damage, while the honest route tracebacks on exchange one. The
      weakness item is not merely overpowered — it is the ONLY path that works.

    not_a_false_victory: >
      Worth keeping distinct from the 2026-07-29 gpt-oss case. The victory
      screen here is CORRECTLY GUARDED — it fires only on a genuine final_boss
      defeat. The failure is the inverse: a terminal state written properly and
      made completely unreachable. Those score similarly and are opposite
      defects.

    unmet_requirements: [23, 29, 32, 39, 42, 45, 51]  # status omits location;
                                                      # 2 regular monsters not 3;
                                                      # `behavior` authored on all
                                                      # three and never read
                                                      # anywhere; no restart on
                                                      # defeat; save omits room
                                                      # state; 4 items not 5;
                                                      # dialogue linear, not
                                                      # branching

    also_broken_in_play: >
      `status`/`inventory`/`inv`/`stats` all CRASH the process (Narrator.
      show_status called with 3 args, takes 4) — so health, attack, defense and
      inventory are NEVER observable at any point in play. `save` crashes
      whenever anything is equipped (EquipmentSlot enum keys are not
      JSON-serialisable) and leaves a truncated file that the next `load`
      reports as "No saved game found". Unrecognised input falls through to
      LOOK, so a typo is indistinguishable from a valid command.

