# Poolside laguna in THINKING mode — the vendor's default and, per their
# 2.1 release notes, substantially stronger on our exact workload:
#   DeepSWE 16.5% -> 40.4%   Terminal-Bench 2.1 60.4% -> 70.2%
#   SWE-Bench Multilingual 71% -> 79%   SWE-Bench Pro 53% -> 59%
#
# Every laguna result we hold was measured with thinking OFF, i.e. in the
# weak mode. `thinking: false` was adopted after the UNSLOTH build produced
# two >100k-char pure-CoT runaways — but that is the 3-bit quant with known
# pathologies, and the vendor states the model self-budgets test-time compute
# and "may think for long sequences before making progress".
#
# This config pairs thinking with the quant that TERMINATES reliably
# (poolside's longest generation across a 2h run was 15,146 tokens), so the
# mode is tested independently of APEX's heavy-tail variance.
#
# Laguna-S-2.1, POOLSIDE first-party GGUF — the quant hypothesis.
#
# WHY THIS EXISTS. The unsloth build we tested pushes 92 expert tensors to
# IQ3_S — THREE-BIT — and that is exactly the regime where repetition loops and
# failure to emit stop tokens appear. Our laguna runs are dominated by precisely
# those symptoms: 51% of the 2h tier run inside long generations, two hitting
# the 32k cap and returning truncated output (dev/TIER_RUN_2026-07-27.md), plus
# pure-CoT runaways of 125-137k chars that never emit an answer.
#
# TENSOR COMPOSITION (read from the GGUF headers, 2026-07-27):
#
#   unsloth UD-IQ4_XS  57.6 GB   Q8_0 x385  F32 x287  IQ3_S x92   IQ4_XS x47
#   poolside Q4_K_M    96.0 GB   Q8_0 x386  F32 x287  Q4_K  x117  BF16   x24
#
# Same 814 tensors, same arch, same dense/attention precision. The whole 1.67x
# size difference is the EXPERTS: unsloth quantises 92 of them to 3-bit, while
# poolside holds nothing below 4.5-bit and keeps 24 at full BF16. "Q4_K_M" is a
# misleading name here — the file is mostly 8-bit.
#
# THE TRADE — 2x LESS CONTEXT (65536 vs the unsloth build's 131072). 96 GB of weights against a 113 GB wired limit:
#
#   n_ctx    KV GB   total    verdict
#    16384     3.2    99.3    OK
#    32768     6.4   102.5    OK  (gpt-oss runs stable at 100.6)
#    49152     9.7   105.7    OK  <- FALLBACK
#    65536    12.9   108.9    OK  <- THIS CONFIG (Luke: ~10GB more headroom)
#    98304    19.3   115.4    over the wired limit
#   131072    25.8   121.8    over — the unsloth context is unreachable here
#
# UNVALIDATED. Nothing below has been run. Before trusting it: boot at this
# n_ctx, then re-run dev/laguna/sampling_sweep.py and compare against
# dev/laguna/sweep_results.json arm C (the unsloth baseline at identical
# sampling) — that isolates the QUANT as the only changed variable.
#
# THE FOLLOW-UP THAT MATTERS MOST: thinking is false here to match arm C for a
# controlled comparison, but the real prize is a `thinking: true` variant. On
# unsloth, thinking-on was catastrophic (zero files in 22 minutes, two >100k
# pure-CoT runaways). If the better quant restores termination, we get laguna's
# reasoning back instead of having to suppress it.

app:
  host: 0.0.0.0
  port: 8008
  log_level: info
  cors_origins:
  - '*'
  backend_timeout: 180
  openai_shim: true
graphql:
  max_query_depth: 10
  max_tokens: 65536   # must not bind before generation.max_tokens_default
  max_aliases: 50
  introspection_enabled: true
model:
  name: Laguna-S-2.1-poolside-think
  family: laguna
  path: /Users/lah-rb/.lmstudio/models/poolside/Laguna-S-2.1-GGUF/laguna-s-2.1-Q4_K_M.gguf
  # 65536 on Luke's read that there is ~10GB more headroom than the
  # conservative estimate (unlike step-3.7, which is genuinely tight at 32k).
  # 96.0GB weights + 12.9GB KV = 108.9GB against the 113GB wired limit.
  # Fallback if it will not boot or wires unstable: 49152 = 105.7GB.
  n_ctx: 65536
  # 108.9GB computed at this n_ctx; guard set above it, not shaved to fit.
  kv_preflight_gb: 112
  model_max_context: 1048576
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048
  thinking: true
  swa_full: true
  kv_unified: true
  flow_kv_cache: false
  session_full_replay: true
  resident_seq_cache: true
  context_refresh_drain_s: 300
prompt:
  persona_file: ./knowledge/SOUL.md
generation:
  # NO ARTIFICIAL CAP: equal to n_ctx, so the context window is the only
  # limit. The 24576 cap was set to bound runaway damage, but it was cutting
  # LEGITIMATE work — the batch structural step declared 12 files and was
  # severed mid-fence inside combat.py, losing two files and leaving a stale
  # earlier pass in place. Truncation was being read as "10/10 declared files
  # written" because the slice counts what survived the cut, not what the model
  # set out to write. llama.cpp still bounds a single generation by the space
  # actually left in the window after the prompt.
  max_tokens_default: 65536
  temperature_default: 1.0
  top_p: 1.0
  top_k: 20              # vendor generation_config.json; NOT 0 (see unsloth cfg)
  min_p: 0.0
  presence_penalty: 0.0
  repeat_penalty: 1.0    # penalties truncate code output — sweep arm B
  # 25 = <tool_call>: a single token; laguna emits it unprompted in 20-40% of
  # turns and we do not support per-model tool protocols. Sweep arm C: 0/4 tool
  # calls, 100% usable output.
  #
  # 19 = </think>: banned only because thinking is OFF here. The close-only
  # prefill (formats/laguna.yaml prefill_closed_close_only) ends the prompt with
  # a bare </think> to declare reasoning finished, and laguna reads that as a
  # separator to REPRODUCE — it emitted </think> 64 times in one 2048-token
  # generation, each cycle restating the same intent, until the server's
  # long-cycle detector killed the stream (ratio 0.0194, period ~158B). With
  # thinking off the tag has no legitimate use, so banning it removes the
  # punctuation the loop was built on. Do NOT carry this to a thinking:true
  # config — there </think> is load-bearing.
  # thinking is ON, so </think> (19) is LOAD-BEARING and must not be banned.
  logit_bias: {25: -100.0}
  session_temp_floor: 0.35
  streaming_default: true
knowledge:
  # Rebuilt automatically when stale — same tokenizer as the unsloth build, but
  # keyed per config file, so it regenerates on first boot.
  tokens_bin: ./data/laguna-s-2.1-poolside.tokens.bin
  token_limit: 32768
resources:
  decode_mode: batched
  cpu_threads: 15
  jit_concurrency_limit: null
tools:
  enabled: false
  max_iterations: 3
logging:
  enabled: true
  directory: ./logs
