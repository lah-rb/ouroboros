# GAME-AB config (BATCHED): gpt-oss-120b-a5 for the greenfield-mission
# reasoning A/B spike — TWO missions run in PARALLEL (arm A adaptive, arm B
# baseline), each pinning a session seat, with a spare seat for stateless
# completions. Single default persona; reasoning_head_swap drives the router
# (turn-0 install + mid-session SPLICE + per-completion swap, all batched-wired
# 2026-07-15). Clone of the tau shape (the known-good W=3 batched config).

app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180
  openai_shim: true

graphql:
  max_query_depth: 10
  max_tokens: 131072
  max_aliases: 50
  introspection_enabled: true

model:
  name: "gpt-oss-120b-a5"
  family: "harmony"
  path: /Users/lah-rb/.lmstudio/models/unsloth/gpt-oss-120b-GGUF/gpt-oss-120b-F16.gguf
  # 32k for BOTH duo slots — Metal wired working-set math (measured via ggml
  # log forwarding 2026-07-10): weights ~61G + per-context swa_full KV
  # 9.2G@131k → 2×131k peaks ~88G wired; graph transients blow the ~96G
  # ceiling → command-buffer OOM (kIOGPUCommandBufferCallbackErrorOutOfMemory)
  # → Metal error latch kills the context (llama_decode -3 until rebuilt).
  # At 32k per-context KV is ~2.3G → ~66G floor, comfortable headroom.
  # τ conversations are short; raise only alongside iogpu.wired_limit_mb.
  # UNIFIED cell pool: in batched mode n_ctx is SHARED by all working seats
  # (kv_unified) — budget the SUM of concurrent streams. 65536 (the 2x32k
  # duo equivalent) exhausted under TWO concurrent game missions doing
  # ~26k-token whole-file rewrites (1,002 stream evictions, both arms spun
  # on "KV cell pool exhausted" for 7.5h — 2026-07-16 bossgame A/B). 131072
  # = production a5's single-context KV footprint, known-good on this box.
  n_ctx: 131072
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto
  n_batch: 2048  # 512 was A/B'd for the duo (transient-buffer theory) and made
                 # the shared slot FAIL DETERMINISTICALLY at its static boundary
                 # — 2048 + n_ctx 32768 is the best-known duo shape (57/60 green)
  thinking: true
  thinking_mode: medium
  swa_full: true
  kv_unified: true
  flow_kv_cache: false
  session_full_replay: true
  resident_seq_cache: true
  reasoning_head_swap: true

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 131072
  temperature_default: 1.0
  top_p: 1.0
  top_k: 0
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.05
  session_temp_floor: 0.35
  streaming_default: true

knowledge:
  tokens_bin: "./data/gpt-oss-120b-a5.tokens.bin"
  token_limit: 32768

resources:
  decode_mode: "batched"
  cpu_threads: 15
  max_concurrent_requests: 3  # W: three working seats, ONE context
  jit_concurrency_limit: null
  # personas warmed as pinned heads: default (operator) + user_sim + tau_boss

# single default persona — both A/B missions are plain operators; W=3 keeps a
# spare seat so stateless completions never deadlock behind two pinned sessions.

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
