# PaddleOCR-VL-1.6 on the Apple Silicon fleet — the per-machine variant.
#
# ONLY THE DEVICE KEYS DIFFER. Everything else (family, the vision-only
# entry, generation defaults, the 32k vision context) is inherited from
# paddle-ocr-vl.yaml, whose device block describes the CUDA box (3090 + 3060:
# main_gpu 1, projector on CUDA1, a pool of two contexts).
#
# `model.name` IS RESTATED ON PURPOSE. LLMVP's visionCompletion reports
# `visionModel = mcfg.name`, and the OCR tool refuses an answer whose
# visionModel differs from the model it asked for (STRICT routing, both
# ends). A variant that omitted the name would route fine and then fail
# every crop with "was served by 'paddle-ocr-vl'".
#
# vision_pool_size 1: multi-context simultaneous decode on Metal is a closed
# dead end (memory: the batched single-context engine is what scales there).
# Widen only by measurement on this host.
#
# Weights: STATED EXPLICITLY (2026-09-06), not left to the LLMVP_MODELS_ROOT
# basename redirect. Per-machine paths belong in the per-machine file — the
# rule muse-glimmer-30b-cuda records — and the redirect could not have worked
# here anyway: it requires the local files to keep the base yaml's basenames,
# and this host's are `PaddleOCR-VL-1.6-Q8_0.gguf` (dash, not dot) and
# `-mmproj` (not `-GGUF-mmproj`).
#
# NOT YET SERVEABLE ON THIS HOST. Both paths below are the repo's canonical
# location and are symlinks that currently DANGLE — their targets
# (.lmstudio/models/{mradermacher,PaddlePaddle}/PaddleOCR-VL-1.6-GGUF/) do
# not exist on this machine; the 1.6 weights have never been fetched here.
# Stated anyway because this is where they belong and the tooling already
# expects those basenames: fetch the Q8_0 + mmproj into the symlink targets
# (or repoint the links) and this config serves with no further edit. A KV
# preflight failure naming these paths is the correct, loud symptom — the
# redirect's silent no-resolution was the wrong one.
extends: paddle-ocr-vl

model:
  name: paddle-ocr-vl-mac
  path: /Users/lah-rb/Repos/ouroboros/tools/pdf_extract/models/PaddleOCR-VL-1.6-Q8_0.gguf
  mmproj_path: /Users/lah-rb/Repos/ouroboros/tools/pdf_extract/models/PaddleOCR-VL-1.6-mmproj.gguf
  main_gpu: 0
  split_mode: none
  vision_projector_device: null   # mtmd default device (Metal)
  vision_pool_size: 1
