app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 131072
  max_aliases: 50
  introspection_enabled: true

model:
  name: "mistral-small-4-119b-a6"
  family: "tekken"
  path: /Users/lah-rb/.lmstudio/models/unsloth/Mistral-Small-4-119B-2603-GGUF/Mistral-Small-4-119B-2603-MXFP4_MOE-00001-of-00003.gguf
  n_ctx: 131072
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  thinking: true   # true is implicitly high
                   # tekken is binary — no [THINK] injected when false

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 131072
  temperature_default: 0.5
  top_p: 0.95
  top_k: 0
  min_p: 0.00
  presence_penalty: 0.0
  repeat_penalty: 1.05
  streaming_default: true

knowledge:
  tokens_bin: "./data/mistral-small-4-119b-a6.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
