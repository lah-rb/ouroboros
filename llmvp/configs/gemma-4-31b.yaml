app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 32768
  max_aliases: 50
  introspection_enabled: true

model:
  name: "gemma-4-31b"
  family: "gemma"
  # Gemma-4 produces its own <|channel>thought reasoning preamble; do NOT
  # inject a thinking opener into the generation prompt.
  thinking: false
  path: /Users/lah-rb/.lmstudio/models/lmstudio-community/gemma-4-31B-it-QAT-GGUF/gemma-4-31B-it-QAT-Q4_0.gguf
  n_ctx: 32768
  n_gpu_layers: -1   
  seed: -1
  verbose: false
  flash_attention: true
  batch_size: 512

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 32768
  temperature_default: 1.0
  top_p: 0.95
  top_k: 64
  #min_p: 0.00
  #presence_penalty: 0.0
  repeat_penalty: 1.0
  streaming_default: true

knowledge:
  tokens_bin: "./data/gemma-4-31b.tokens.bin"
  token_limit: 32768

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null  

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"
