# ── GREENFIELD TIER 1 (blind panel 2026-07-23; /tmp/blindpanel4/FINAL_ANALYSIS.md) ──
# 2nd of 8, winnable end-to-end (weakness 2x + phase-rage verified live) — and
# achieved with thinking effectively OFF (the run predates the medium→<|think|>
# remap; both adaptive arms rendered padding). Artifact flaws: mid-fight heal
# attacked instead, persistence import fell back to a silent no-op + degraded
# parser. Expect headroom with thinking ON.
app:
  host: "0.0.0.0"
  port: 8008
  log_level: "info"
  cors_origins: ["*"]
  backend_timeout: 180

graphql:
  max_query_depth: 10
  max_tokens: 113664
  max_aliases: 50
  introspection_enabled: true

model:
  name: "gemma-4-31b"
  family: "gemma"
  # STRATEGY: S2 (`cache_strategy: resident` at the foot of this file).
  # resident_seq_cache / session_full_replay / kv_unified / decode_mode are
  # IMPLIED by it and deliberately not restated here.
  # RESIDENT cache economics (dev/CACHE_STATE.md matrix): SWA dense —
  # measured full-stack 2026-07-02 (resident-live 37/46 tok turns, hot
  # snapshot forks 1.2s).
  # Per-turn adaptive reasoning via the head swap. Gemma-4 is BIMODAL — the
  # levels map in formats/gemma.yaml renders high -> <|think|> and low/medium
  # -> a token-length-MATCHED padding, so the mid-session splice stays legal
  # (it refuses unequal heads). Requires resident_seq_cache, above.
  reasoning_head_swap: true
  # TRUE is load-bearing for the reasoning toggle: formats/gemma.yaml maps
  # medium/high -> <|think|> (thinking-ON default; router's low pads it out).
  # thinking:false would prefill the already-CLOSED empty thought channel in
  # every generation prompt (prefill_closed_when_disabled), structurally
  # foreclosing reasoning and cancelling the <|think|> head — so the flag must
  # track the DEFAULT level's state. With true we prefill the OPEN
  # `<|channel>thought\n` opener; in the padded-off state the model just
  # closes it immediately (it self-emits the empty channel anyway —
  # dev/gemma_pad_probe.py).
  # ── THINKING LEVERS (2026-08-03 routing redesign) ─────────────
  # per_request default (operator): unrouted -> padded head + pre-closed channel (resting off); medium/high -> <|think|> + model opens its channel. 31b's head-swap serves the per-level heads
  thinking_available: true
  thinking: "per_request"
  # RESTING HEAD = medium (2026-08-03 matrix finding): with the resting level
  # unset, per_request warmed the static head in the OFF padding — on 26b
  # (no head-swap) that killed per-request thinking outright, and on 31b it
  # was the fallback that turned the deduped `high` request silently off.
  # medium rests the head at <|think|> (the validated pre-redesign posture);
  # low requests still suppress via the padding head-swap (31b) and the
  # pre-closed genprompt (both).
  thinking_mode: medium
  path: /Users/lah-rb/.lmstudio/models/lmstudio-community/gemma-4-31B-it-QAT-GGUF/gemma-4-31B-it-QAT-Q4_0.gguf
  # Full native context (Luke 2026-07-24): the old 65536 cap guarded a
  # semi-broken early release that blew up memory at full context without
  # warning — not observed with the QAT GGUF on the current llama-cpp bin,
  # so corrected to the model max.
  # GEOMETRY — MEASURED (2026-07-25 pressure ladder, dev/context_pressure_probe.py):
  # loaded peak ≈ 24GB + 0.87MB/token of n_ctx (linear across 32k/48k/64k
  # rungs; fill rides free inside the boot commitment; stable decode at 84%%
  # fill every rung). That is HALF the swa_full formula — the theory-based
  # KV preflight over-predicts ~2x for gemma-4, so boots need
  # OURO_KV_PREFLIGHT_GB=112 above 49152. Sweet spot 65536 = 81GB peak
  # (~32GB margin); tight ceiling ~81920; 98304+ breaches; 262144 = the
  # reboot-#3 death either way. Window-boundary session canary still
  # pending before deep-session workloads at this size.
  # RETURNED 113664 -> 65536 on 2026-08-03 (operator): gemma has no reason
  # to carry a bespoke context-limiting strategy now that it runs the S2
  # path (pool + resident + swa_full + kv_unified) and gets every feature
  # from it. The 113664 ceiling was a 2026-07-29 special case that sat
  # 116.2GB deep on a 137.4GB machine — no margin, and it stopped booting
  # the moment the quant changed. 65536 is this config's OWN documented
  # sweet spot (81GB peak, ~32GB margin) and the fleet's common setting.
  n_ctx: 65536
  # RE-STAMPED for the lmstudio-community QAT-Q4_0 (the operator repoint;
  # the unsloth UD-Q4_K_XL this used to describe is deleted).
  probe_verified_weights_bytes: 17651001280
  # RE-PROBED 2026-08-03 on the QAT-Q4_0 + b10243 -> 112,640, and the old
  # 113,664 turns out to have been genuinely (if marginally) too high: the
  # ladder FAILED at 116,736 with a real llama.cpp decode code — caught by
  # the guard, hardware-bound rather than arithmetic-refused — and the
  # probe measured 6.4GB of overhead above the formula. So the staleness
  # guard was not merely bureaucratic; restoring 113,664 would have been a
  # boot failure waiting to happen.
  #
  # THE CEILING IS NOT THE SETTING. n_ctx stays at the operator's 65,536.
  # Every 100k+ rung the probe passed peaked at ~123GB — 106,496 at 122.9,
  # 111,616 at 122.8, 112,640 at 123.7 — i.e. ~14GB of headroom on a
  # 137.4GB machine, and all three cost about the same because KV
  # dominates. That is the margin the operator rejected when returning
  # this config to 65,536 (~81GB peak, ~32GB spare), and today's step37
  # smoke is the cautionary case: it ran AT its verified ceiling and
  # OOM'd the moment the binary changed. The probe also does not exercise
  # the resident bands (snapshots, flow, reasoning heads) that S2 adds on
  # top. 112,640 is available if a workload ever needs it.
  probe_verified_n_ctx: 112640
  # The theory-based preflight assumes every layer carries a full-size cache
  # and so over-predicts ~2x for gemma-4 (formula ~1.72MB/token vs the 0.87
  # MEASURED above). At 65536 it computes 130.4GB against a 100GB default and
  # REFUSES a config that is stable in practice at ~81GB peak. Carrying the
  # documented budget here rather than in OURO_KV_PREFLIGHT_GB means every
  # launch site gets it — an unattended batch that did not know to export the
  # env var lost this arm outright (overnight tier run, 2026-07-27).
  kv_preflight_gb: 112
  # RE-MEASURED 2026-08-03 by --probe-context on the QAT-Q4_0 + b10243:
  # 880 KiB/token = 901,120 B, slightly ABOVE the 870,000 that
  # dev/context_pressure_probe.py measured on 2026-07-25 (old quant, old
  # binary). Taking the higher figure: it is the fresher measurement and
  # the conservative direction for a preflight whose job is refusing an
  # allocation that would hard-reboot the machine.
  kv_bytes_per_token_measured: 901120
  # The trained per-stream range (the swarm/model context split): the
  # stream limit is min(n_ctx, this) = 32768 here.
  model_max_context: 262144
  n_gpu_layers: -1
  seed: -1
  verbose: false
  flash_attn_type: auto   # REAL knob (old flash_attention: true was a silent no-op)
  n_batch: 2048           # REAL knob (old batch_size: 512 was a silent no-op)
  # swa_full is ARCHITECTURE-determined, never strategy-determined — the
  # canned strategies deliberately leave it alone (FEATURE_MATRIX §1).
  # gemma-4 is interleaved-SWA, and CORPUS.md:298 scopes the requirement
  # exactly: resident corrupts at the window boundary on SWA models, so
  # TRUE is mandatory here. (glm/MLA and hy3/dense run resident with it
  # false and are correct; they are not windowed.) It is also what makes
  # the KV lavish — 0.87 MB/token measured — which is the price of the
  # resident feature set on this model, paid deliberately.
  swa_full: true
  # ON 2026-07-30. The "off" verdict above was about M8 — the save_state BLOB
  # implementation, whose churn corrupted deep-session KV (the gpt-oss `code -3`
  # class). That path was DELETED 2026-07-30; the flow cache is now M9 seq-ops
  # only (pin a prefix on a band seq, memory_seq_cp it onto the working seq),
  # which shares none of that mechanism. This config is S2 (pool + resident +
  # swa_full + kv_unified), so the band is available and divides nothing.
  #
  # Payout is INHERITED, not measured here: 3.51s/call = 49% of prefill on glm,
  # 11/11 hits (the only model the corrected pilot covers). Cost is 8 seq ids,
  # which under kv_unified cost ids and not window. Enabling on inherited
  # evidence is the same call already made for the other seven configs — worth
  # stating plainly rather than implying a per-model measurement exists.
  flow_kv_cache: true
  # (session_full_replay + kv_unified are implied by cache_strategy: resident.)

prompt:
  persona_file: "./knowledge/SOUL.md"

generation:
  max_tokens_default: 113664
  # THE GEMMA TEAM'S CANONICAL INFERENCE CONFIG, all four values:
  #   temperature 1.0 · top_k 64 · top_p 0.95 · min_p 0.0
  # (vendor guidance via the unsloth gemma-4 model cards, checked 2026-07-31.)
  temperature_default: 1.0
  top_p: 0.95
  top_k: 64
  # ADDED 2026-07-31. It was absent, so the loader supplied 0.05 and this model
  # ran off-vendor for its whole history. The sibling gemma-4-26b-a4b declared
  # it correctly and was ALSO overridden, by a separate bug — `gen.min_p or
  # 0.05` discarded the legitimate zero. Both are fixed; this line is what makes
  # the setting explicit rather than inherited from a default that happens to
  # agree.
  min_p: 0.0
  # NEUTRAL, and canonical: vendor guidance specifies no repetition penalty for
  # gemma-4. 1.15-1.25 appears only as REMEDIAL advice once repetition is
  # actually observed.
  #
  # THIS MODEL HAS NOW BEEN OBSERVED TO JAM: tier_20260730-220500 arm 7 aborted
  # on `run-length 48 of token 715` (a `/` run inside an identifier —
  # `void_//bane`, then `old_//////...`) at 1,169 tokens into its first
  # generation, at temperature 0.14. Token 715 had never appeared in any of the
  # 38 prior run-length captures on this machine.
  #
  # IF IT RECURS, bump this a tad — 1.05 first, 1.10 if that does not hold
  # (operator, 2026-07-31). Deliberately NOT pre-emptive: one occurrence is not
  # a pattern, penalties truncate code output, and this model is the only gemma
  # running reasoning_head_swap + thinking, so the cause may not be sampling at
  # all. Change one thing and re-measure.
  repeat_penalty: 1.0
  # Deep session turns are repetition attractors (gemma-4 token loops are
  # the documented degenerate-purge case); floor sampling from turn 3 on.
  session_temp_floor: 0.35
  streaming_default: true

knowledge:
  tokens_bin: "./data/gemma-4-31b.tokens.bin"
  token_limit: 32768

# ── CANNED CACHE STRATEGY (2026-08-03) ───────────────────────────────
# This config hand-spelled resident/full_replay/kv_unified/decode_mode
# across two sections; the fleet's answer is one named strategy that
# expands to them (core/config.py CACHE_STRATEGIES, FEATURE_MATRIX §1):
#
#   replay   = S1  pool + full_replay
#   resident = S2  pool + resident + kv_unified   <- THIS CONFIG
#   batched  = S3  batched + resident + kv_unified
#
# S2 is the feature optimum and keeps everything this config depends on —
# most importantly the REASONING HEAD SWAP, whose gate is
# `_reasoning_head_swap and _resident_active` (llama_cpp_backend.py:2057),
# with no swa_full term. S1 was briefly considered to shed the swa_full KV
# and is WRONG here: head-swap is inert without resident, and gemma's
# enabled branch emits nothing in the generation prompt
# (open_tag_prefill_when_enabled: false), so the system head is the ONLY
# per-level signal at medium/high — losing it would collapse the dial from
# three states to two.
cache_strategy: resident

resources:
  cpu_threads: 15
  max_concurrent_requests: 1
  jit_concurrency_limit: null

tools:
  enabled: false
  max_iterations: 3

logging:
  enabled: true
  directory: "./logs"

# ── TIER EXPECTATION (doc-only; see DOC_ONLY_KEYS in core/config.py) ─
# PRE-REGISTERED under TIER_RUBRIC v1.1 §6: written before the run, never
# shown to a judge, never revised afterwards. Its job is not to be right —
# it is to make a SURPRISE legible, so an unexpected score prompts a look at
# the run before the number enters the ledger.
tier:
  # RE-MEASURED 2026-08-03, first think-LIVE production run (post-ec5d54c):
  # 27 cycles / 121min = 13.4 cyc/h — CONTEMPLATOR band. The grinder
  # register value was a non-think number (thinking was never activated
  # pre-fix). This arm ran under grinder protocol (2h wall) before the
  # re-measure existed; league change applies from the NEXT run. 10 degen
  # events this run — first thinking production sample, watch.
  league: contemplator  # re-measured think-live; was grinder (non-think artifact of the <|think|> bug)
  v2:
    status: placed
    rubric: TIER_RUBRIC v2
    epoch: "v2.0 (brief v2 / framework ec5d54c)"
    tier: 2               # lost to GUARDIAN 0-5; FLOOR flight pending (low vs near-boundary)
    judged:
      run: tier_20260802-043526
      staged: staged/arm01
      judge: "claude-opus-5 (blind subagent, flight packet)"
      flights:
        - opponent: GUARDIAN (gpt-oss anchor)
          result: "LOST 0-5 axes + overall, no self-flag"
          conformance: "31/47 SIGNIFICANTLY-DEVIATED (BOTH triggers: 16 unmet >= 10 AND no win path)"
          completability: "UNWINNABLE at room 1 of 9 — parser emits go/take, engine dispatches move/pickup; the whole authored world (9 CONNECTED rooms, 6 items, branching NPC trees both hinting the weakness) is inert behind the seam. drop/use/stats parse to actions with no handler"
          why_the_judge_preferred_guardian: >
            Working surface: the Guardian's 14 advertised verbs all work
            when invoked; this artifact offers ~15 of which 4 are live and 2
            of those inert — the go/take vs move/pickup seam locks the
            player in room 1 of 9. State: the Guardian's round-trip was
            exercised against a genuinely mutated world (location,
            inventory, equipment, per-room items) and restored exactly; this
            save is clean but vacuous — nothing can ever change — and its
            schema silently drops attack_power and max_health. Experience:
            the Guardian has an accurate help table, informative refusals,
            and narrated combat; this artifact has no help at all and its
            title screen advertises save/load while never naming the four
            verbs that actually work. Scope: a traversable world,
            equip-driven stat changes and verified persistence, vs richer
            authored data of which essentially none is reachable. Ambition:
            this artifact attempted more content (dialogue state machines, 9
            rooms, behaviour labels) but none survived contact; the Guardian
            attempted more mechanism and most of it survived.
          notes: "First think-LIVE run (36 thought emissions, 10 degen events, 13.4 cyc/h). Guardian tally converged for the 4TH independent judge (41/47, identical unmet set)"
        - opponent: FLOOR (devstral anchor)
          result: "LOST 3-2 axes (took state integrity + ambition), overall FLOOR, no self-flag — places BELOW the floor anchor: low tier 2"
          why_the_judge_preferred_floor: >
            The FLOOR took the three axes that ask what a player actually
            gets. Working surface: its 13-verb surface works bar two, while
            this artifact's movement and take are both dead on the
            action-name mismatch — nothing past look/inventory/save can be
            invoked and the player cannot leave room one. Scope: 4
            explorable rooms, two fightable monsters, a working equip chain
            (Attack 5→10, Defense 2→5), mid-combat healing and a terminal
            defeat, vs one room and zero fights. Experience: an accurate
            help that correctly advertises bare directions and a world you
            can walk, vs better prose with no help and no discoverable
            action that advances anything. This artifact took state
            integrity (save/load on command, restored a hand-written state
            exactly — the FLOOR's save/load isn't wired to any command) and
            ambition (the only fully-connected 9-room graph, four distinct
            behaviour labels, the weakness threaded through two dialogue
            graphs, and the only ambitious subsystem that survived anywhere
            in the flight: full-schema persistence). The judge's overall
            line: "A is a game that can be played; B is a title screen with
            a look command."
          notes: "The judge RESOLVED the '//' literal question: model-innate stylistic tic (title screen deliberately uses '// Type ...' decoration; the tic bled into parser alias literals) — extraction exonerated. Real strengths on record: the flight's only zero-traceback robustness, honest full-schema persistence (dialogue state + room deltas), the only fully-connected 9-room graph. All behind the one seam."
  # NOT A SETTLED SCORE. A run happened and produced a tier-3 gate failure, but
  # the rubric's own re-run rule applies — "re-run only when the failure looks
  # like a framework or config fault rather than the model" (§2) — and it does.
  # See rerun_owed below. Left as not_yet_run on purpose so nothing downstream
  # reads a framework-shaped tier 3 as this model's placement.
  status: not_yet_run
  expectation:
    registered: 2026-07-29
    tier: "1"
    stars: 4
    basis: experience
    why: >
      Strong tier 1 candidate in NON-THINKING mode, likely 4 stars. Its lavish KV
      architecture makes it expensive to run under swa_full for compatible
      features; the competent base buys most of what it needs without them. Open
      question: whether thinking on helps task performance or trades too much
      speed.

  # ── 2026-07-31 ARM: RAN, GATE-FAILED, NOT SCORED ────────────────────
  attempted:
    run: tier_20260731-050209 arm07 · staged/arm07
    judge_model: claude-opus-5[1m]
    rubric: TIER_RUBRIC v1.2
    tier3_gate: failed
    scored: false          # gate failure terminates judgment (§2, §9.2)
    shape: 121 min · 6 files · 5 py_ok · 1 py_fail · 2 degenerations · 4/33 goals

    what_the_judge_found: >
      TWO blockers, and the decisive one is not the syntax. `main.py` dies on
      import: `game_engine.py` carries FIVE syntax errors (lines 75/114/151/
      159/160), each a self-correction fragment left in place — a broken line
      immediately superseded by a working one, plus a `//` C-style comment.
      With those commented out in a diagnosis copy the program still exits at
      startup: `world.yaml` DOES NOT EXIST anywhere in the artifact, and
      world_loader reads it as the sole source of every room, item, NPC and
      monster. No amount of syntax repair produces a runnable game.

    why_a_rerun_is_owed: >
      Both failures are framework-shaped, and BOTH have since been fixed.
      1. world.yaml never reached disk: the scaffold parse floor rejected the
         write outright (ScannerError) and no repair path re-entered — one
         rejection, no retry, no data.
      2. The repair loop was denied its own successes. All 51 splice attempts
         targeted `GameEngine.process_command`, correctly. FOURTEEN of them
         REPAIRED it — the post-splice error line moved off 75 onto 140/152/
         153/155, which is where the two sibling helpers sit once the edited
         body shrinks. The gate parsed the WHOLE file, saw a residual error in
         a symbol the edit was never scoped to touch, and reverted. 37 later
         attempts then restarted from a file an earlier attempt had already
         partially fixed. Fixed 2026-07-31 (49fa9a0): an error OUTSIDE the
         spliced body no longer reverts an already-broken file.
      The residual symbols were also UNNAMEABLE — `def 8_world_rooms_get`,
      an identifier starting with a digit — so no symbol-scoped editor could
      ever have addressed them. Convergence needs the module-frame path; the
      gate fix is what lets a repair SURVIVE until one runs.

    what_is_NOT_excused: >
      The model really did emit malformed code — the digit-leading identifiers,
      the C-style comment and the self-correction residue are its own output,
      not pipeline damage. Verified: no channel markers reach the shipped files,
      the FSM strips gemma's thought preamble correctly (formats/gemma.yaml
      close_tag), and the capture shows an empty thought block, so `reasoning: 0`
      is accurate rather than a missed extraction. A rerun tests whether the
      repair loop can now recover from that, not whether the model was clean.

    rerun_owed: >
      OWED (operator, 2026-07-31) for an actual score. Needs the splice-gate fix
      (49fa9a0) and the critic-prompt exemplars (5852992) — though this model
      designs FLAT layouts and never hit the design gate, so the second matters
      only for its 26b siblings.
