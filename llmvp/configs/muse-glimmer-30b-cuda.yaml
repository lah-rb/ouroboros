# muse on the CUDA rig — the CUDA-machine view of muse-glimmer-30b.
# 2x RTX 3090 + NVLink since 2026-09-28 (a 3090 + 3060 before: see the history below).
#
# WHY A SEPARATE FILE. Two machines share this repo and a probe LEDGER IS A
# MEASUREMENT OF ONE MACHINE: the base config carries probe_verified_n_ctx
# 131072 from the M1 (run_id cells_20260811-221252, 116 GB unified), which on
# a 24 GB card accounts to ~25.6 GiB and cannot exist — yet the KV preflight
# reads it as "measured to load and decode on this machine". Probing the base
# here would clobber the M1's ledger with a CUDA ceiling: the same
# cross-machine bug in the other direction (see manager._rebind_working_
# directory for the working_directory instance of this class). Per-machine
# facts live in a per-machine file, selected by the untracked
# active_config.txt.
#
# BATCHED, 4 SEATS IN THE EXISTING CELL. Measured on this rig 2026-08-15
# (260 inference calls, scraper flow): median total context 5,382 tokens,
# p95 6,762, 1 of 260 over 8k. In batched mode n_ctx is the SHARED cell, so
# 4 seats inside the same 32768 the pool config already allocates cost ZERO
# additional KV — the single-seat window was 6x oversized for this flow.
# The curator flow reads whole markdowns and will need its own measurement
# before it gets seats.
extends: muse-glimmer-30b

model:
  # Path and n_ctx are stated here even though inheritance would supply them:
  # --probe-context reads the RAW child file (no inheritance resolution) and
  # needs both, and this machine's real path beats the base's /Users/… +
  # LLMVP_MODELS_ROOT basename redirect anyway.
  path: /home/lah-rb/models/muse-glimmer-30B-kquant-dynamic.gguf
  # In batched mode this is the SHARED cell across seats. Grown 32768 →
  # 65536 (2026-08-17) to admit the curate drain's whole-paper turns beside
  # the measured scraper lanes (median 5,382, p95 6,762/turn): one curator
  # seat needs doc (~30k) + answers, three sibling lanes ~20k p95 combined.
  # VRAM: +32,768 tok ≈ +1.66 GiB KV against 1.94 GiB measured free
  # (nvidia-smi, all buffers resident), funded by vision_n_ctx 16384 → 8192
  # (−0.42 GiB). NOT 91k: probe_verified_n_ctx was a TEXT-ONLY probe; at 91k
  # the resident vision KV + its 1.18 GiB compute buffer no longer fit and
  # figtext dies. Verified at boot + canaries, 2026-08-17.
  # ── 3060 LAYER-SPLIT (operator-directed overnight, 2026-08-22) ──────
  # Paddle down + OCR lane disabled: the 3060 hosts 18/52 muse layers.
  # Geometry (GGUF headers): 1 KB/token/layer KV, 0.32 GB weights/layer.
  # n_ctx is the SHARED CELL POOL, not a per-stream position budget — it
  # may exceed the trained 131,072 because no single stream approaches
  # it (operator note). Ladder: 196608 -> 180224 -> 163840 -> 147456;
  # this line records the rung that PROBED CLEAN.
  # ── SPLIT REVERTED (2026-08-22 late): paddle returns to CUDA1 for the
  # 404-PDF queue; muse whole on CUDA0 (operator: "curator lanes
  # exclusively on the 3090"). The split leg's full record + final
  # metrics live in ~/tools/ouroboros-ops/LAYER_SPLIT_EXPERIMENT.md —
  # [40,12]@131072 was the stable rung, 80.9 completions/h over 5.5 h,
  # zero faults. Re-apply it whenever paddle next drains.
  # 2026-09-15: back to 65,536 shared cells so paddle can hold CUDA1 for
  # local OCR (the state before 7ccd74d; that commit's split was safe only
  # while the ocr lane was disabled).
  # 2026-09-18 (operator approval): OCR and figtext queues are EMPTY, so
  # paddle is not loaded and the 3060 is free again — back to the
  # [40, 12]@131072 rung for the translation + review stretch. The mission
  # runs with OUROBOROS_DISABLE_LANES=ocr,figtext,figtext2,figtext3,figtext4
  # and OUROBOROS_SCRAPER_OVERLAP_PDFS=0, so nothing can request paddle onto
  # CUDA1 beside these layers, and the vision projector (CUDA1) stays idle —
  # the CUDA1 graph-realloc crash of 2026-09-09/10 needed live vision load.
  # Bring paddle back = the 2026-09-15 state above (65536, no split), when
  # new PDFs need OCR.
  # ── 2x RTX 3090 + NVLINK (2026-09-29) ──────────────────────────────
  # The 3060 is gone and a second 3090 took its slot (NV4 bridge, 52.8 GB/s,
  # both cards Gen4 x8). TENSOR split (tensor parallelism, llama.cpp's
  # replacement for the removed row mode) was chosen THROUGH LLMVP: this
  # config booted both ways, same canaries, wall seconds (layer -> tensor):
  #   8 seats, ~9k prompt + 256 gen each           78.4 -> 59.3
  #   one 67k prompt + 64 gen                       75.1 -> 57.0
  #   3 vision + 5 text (~9k) at once               49.3 -> 38.6
  #   curate 37k prompt + 256 gen, 1 / 2 at once    37.5 -> 29.8 / 75.7 -> 57.0
  # Tensor is 20-25 % faster on every shape and holds ~2 GB less per card
  # (peaks 16.7 / 18.8 GB vs 18.5 / 20.7 GB).
  # llama-batched-bench had called the curate shape for LAYER (23-31 % faster:
  # pipelined prefill, ~2,800 vs ~1,650 tok/s; ~/tmp/analysis/split_probe_2x3090/
  # llama/muse_shape_*). That bench gives each sequence its own windowed cache.
  # LLMVP serves every stream from ONE unified pool with full-size SWA caches,
  # and there the ranking inverts. The mechanism is not isolated; the served
  # numbers are what count.
  # Tensor mode is marked EXPERIMENTAL upstream. Fallback = split_mode: layer
  # (same tensor_split), the mode muse ran on for weeks.
  # PADDLE BESIDE IT (2026-09-29). paddle-ocr-vl now loads hot on CUDA0
  # (its config explains the card choice). The real OCR tool ran a 14-page
  # paper twice while these canaries ran, and nothing faulted:
  #   muse canaries   +0-10 % wall (8 seats 59.3 -> 63.5, 67k prompt 57.0 -> 59.9,
  #                   vision+text 38.6 -> 42.4, curate 29.8 -> 32.5 / 57.0 -> 56.8)
  #   OCR             ~80 s -> ~99 s per pass (+~20 %)
  #   peak memory     CUDA0 21,008 MiB, CUDA1 18,851 MiB (of 24,576 each)
  # Paddle's real cost on CUDA0 is ~4.2 GiB against the governor's 2.5 GiB
  # (compute buffers and the CUDA context are not priced).
  # BUT THE FIRST MISSION RUN WITH IT WEDGED (v50, 2026-09-29 19:49Z). Paddle
  # hot-loaded while 8 muse streams were decoding. Within ~40 s the batched
  # decode thread was spinning at 100 % CPU inside a CUDA sync: no tokens for
  # 10+ min, 8 seats held, GPU1 idle. Paddle kept serving on CUDA0 throughout,
  # SIGTERM could not stop the server, and the keeper never fired (OCR kept
  # GPU0 above its idle watts). The ladder had passed the same pairing three
  # times, so it is an intermittent race between tensor-parallel muse and a
  # second model in the same process. The same mission without the ocr lane
  # decodes normally.
  # So OUROBOROS_DISABLE_LANES=ocr STAYS while muse is tensor-split. Ways to
  # bring OCR back, all untested: paddle in its own process (extract_batch
  # --vl-backend llamacpp); muse on split_mode layer beside in-process paddle;
  # paddle on the remote 3060 box (llmvp_domains["ocr"]).
  # n_ctx 131072 -> 262144 (the SHARED cell pool; no stream exceeds
  # model_max_context 131072). KV at 52 KB/token: 6.5 -> 13.0 GiB, spread
  # over two 24 GiB cards beside ~19.7 GB of weights.
  # CEILING MEASURED 2026-09-29 (~/tmp/session_scratch_20260925/ctx_ladder.py;
  # results ~/tmp/analysis/ctx_ladder_2x3090/). Each rung ran with paddle hot
  # on CUDA0 (the real OCR tool, two passes) and the full canary set, then
  # filled ~92 % of the pool with real papers (3 streams of 102-112k tokens)
  # alongside 3 vision requests. Free MiB at the sampled peak:
  #   327,680   PASS   CUDA0 1,508   CUDA1 3,660
  #   360,448   PASS   CUDA0   620   CUDA1 2,770
  #   393,216   not run: +0.83 GiB a card puts CUDA0 ~250 MiB over
  # CUDA0 binds (it holds paddle, ~4.2 GiB real). muse has 2 KV heads, so the
  # tensor split cannot shift KV to CUDA1 unevenly. 327,680 keeps 1.5 GiB of
  # margin under peak load: 40,960 cells per seat on average, and every
  # stream is still capped at model_max_context 131072.
  n_ctx: 327680
  probe_verified_weights_bytes: 19653957984
  probe_verified_n_ctx: 91136
  # ── 3060 LAYER-SPLIT RE-APPLIED 20260906 by dev/expand_local_seat_on_figtext_drain.py:
  # paddle drained, figtext drained; the [40, 12]@131072 rung measured stable
  # 5.5 h / zero faults on 2026-08-22 (LAYER_SPLIT_EXPERIMENT.md). ocr lane is
  # disabled in the mission (OUROBOROS_DISABLE_LANES=ocr) so paddle is never
  # loaded onto CUDA1 beside these layers. Revert = the .bak beside this run's log.
  # [40, 12] was the 3090 + 3060 rung. Two equal cards: an even split.
  split_mode: tensor
  tensor_split: [1, 1]
  # The base declares vision_n_ctx 131072 — an M1 sizing (7 GB of lazy KV
  # against 123 GB) that on this card is a landmine: never built, costing
  # nothing, until one stray vision request tries to allocate 6.5 GiB into
  # ~3 GiB of free VRAM and kills the primary. Paddle owns page OCR here;
  # muse vision remains available for figure work at a window that fits.
  # 8192 = 0.42 GiB, ~5x a dense figure answer (figure work peaks ~1.6k
  # answer + split-panel image tokens; book pages ride paddle, not muse).
  # Halved from 16384 (2026-08-17) to fund the batched cell's growth to
  # 65536 for the curate drain.
  # Vision grows 8192 -> 24576 with the freed 3090 VRAM (the 8192 cap
  # existed only because the un-split 3090 could not hold more beside
  # the 65k text pool).
  # 8192 -> 24576 (2026-09-29): the grow the note above planned, now funded by
  # the second 24 GiB card (+0.85 GiB of vision KV).
  vision_n_ctx: 24576
  # ── BATCHED VISION LEG (2026-08-26, dev/BATCHED_VISION doc) ────────
  # Vision decodes as ordinary streams in the shared batched context;
  # the 8192x1 pool above stays resident as the automatic fallback.
  # P5 ramp: raise max_streams 1 -> 2 -> 3 watching figs/h, install p95
  # and vision_fallbacks in health.
  vision_batched: true
  # 2 -> 3 (P5 ramp step 1, 2026-08-26 21:40; 2-stream soak closed at
  # 415 figs/h, zero faults over 6 h).
  # 3 -> 4 (P5 ramp step 2, 2026-08-27 08:05; 3-stream leg held 510-600
  # figs/h with zero faults). Encode measured at 21-26% duty on the 3060
  # (ceiling ~4-5x away); the contended resource is 3090 decode
  # bandwidth, so expect +10-20% or flat — revert to 3 if flat.
  # 4 -> 3 (step-2 verdict, 2026-08-27 08:45): 41 min at 4 streams
  # measured 532 figs/h vs the 3-stream leg's 510-600 — FLAT, exactly
  # the decode-bandwidth prediction. Reverted per the pre-registered
  # rule; the extra concurrency only taxed per-figure latency and held
  # a 4th seat from the text lanes. The FOUR fig lanes stay: at server
  # cap 3 they keep the streams saturated through tool-overhead gaps.
  # 3090 decode bandwidth is the wall; the next real multiplier is a
  # second GPU.
  vision_batched_max_streams: 3
  # PROJECTOR ON THE 3060. GPU0 holds weights + the batched cell and has
  # ~2.9 GiB slack; the vision graph needs its KV (0.85 GiB) AND a compute
  # buffer (measured 1.18 GiB at reserve, 2026-08-16) — adding the ~1.3 GiB
  # mmproj on top OOM'd at ggml_gallocr_reserve and took the process down.
  # The projector is the one piece that relocates cleanly (the paddle knob):
  # image encode runs on CUDA1 beside paddle, bursty and small.
  # 2026-09-29: CUDA1 is now a 3090 holding half of muse's weights. It stays
  # there: the even split leaves both cards the same slack, and the CUDA1
  # graph-realloc crash of 2026-09-09/10 came from a 12 GiB card run to its edge.
  vision_projector_gpu: true
  vision_projector_device: "CUDA1"

  # ── REASONING FLAGS: PINNED TO MATCH THE BASE, NOT INHERITED ────────
  # The shared base turned both on (2026-08-16 port, bringing muse in
  # line with the lab's published expectations for the family) and this
  # file inherits by extends:, so a later base edit would move THIS
  # machine's behaviour on the next boot with no commit here to show it.
  # Both values are deliberately identical to the base — this is a pin,
  # not an override, and it should be updated to match whenever the base
  # legitimately changes. Operator ruling 2026-08-23: correct for the
  # scraper workflow too, and low-impact either way, since the curate
  # path is overwhelmingly stateless turns and never requests a
  # reasoning level (so the head-swap is inert for this workload).
  resident_strip_reasoning: true
  reasoning_head_swap: true

  # ── DFLASH SPECULATIVE DECODING (operator ruling 2026-10-02) ──────────
  # Muse's released drafter. Benched on this rig, tensor split: 59 -> 92-111
  # tok/s per stream (1.56-1.80x), +21% aggregate at 8 streams, pack quality
  # unchanged (dev/bench_spec_decode.py; dev/spec_dflash_smoke.py ran the
  # same loop through this binding). n_max 3 measured best. The drafter
  # loads with THIS placement (tensor split) and keeps a q8_0 KV of the
  # same 327,680 cells (~3.6 GB) beside its 1.6 GB of weights. A drafter
  # that fails to load leaves the server up on plain decoding.
  speculative_type: dflash
  speculative_draft_model: /home/lah-rb/models/dflash-kquant.gguf
  speculative_n_max: 3
  speculative_draft_cache_type: q8_0

resources:
  decode_mode: batched
  # 4 -> 5 (2026-08-21): the doubled translate lanes proved seats were
  # the binding constraint again — all 4 busy in 71% of capacity ticks,
  # occupancy p50 0.69/p90 0.91, and effective decode rose 42% (35.5 ->
  # 50.3 gen tok/s wall) when the idle seat was spent, at an 11%
  # per-stream tax. A 5th working seq shares the same unified 65,536-cell
  # pool (seq_cp static heads cost no new cells); admission's QUEUE
  # verdict remains the correctness backstop if entitlement outruns
  # cells. Judge by the same CapacitySample series that earned it.
  # 5 -> 6 with the ~3x cell pool: the 5th seat proved out within hours
  # (occupancy p50 0.69 -> saturated 71% of ticks); the grown pool feeds
  # a 6th. Admission's QUEUE verdict remains the backstop.
  # 6 -> 8 (2026-08-22 curation-finale): the final split leg ran 6
  # streams with seats exhausted 88% of ticks while cells sat at median
  # 35k free — seats, not cells, bound. Two more seats for the review
  # drain; the engine QUEUE verdict absorbs cell collisions.
  # 8 -> 6 with the pool back at 65,536 (2026-08-22): the 8th and 7th
  # seat were funded by the split's 131k cells; on the reverted pool the
  # proven plateau is 6 (see LAYER_SPLIT_EXPERIMENT.md close-out).
  # 6 -> 8 (2026-09-29): the 8-seat plateau was proven on the split's 131k pool
  # (2026-08-22, seats exhausted 88 % of ticks). The doubled 262k pool gives
  # each of 8 seats ~32k cells. Admission's QUEUE verdict remains the backstop.
  max_concurrent_requests: 8
