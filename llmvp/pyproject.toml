[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "LLMvp"
version = "0.1.0"
description = "LLMvp server: mmap static knowledge base, graphql api, and llama.cpp inference"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "starlette>=0.49.3",
    "uvicorn>=0.39.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "pydantic>=2.12.5",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.2.0",
    "rich>=14.3.2",
    "black>=26.3.1",
    "strawberry-graphql>=0.262.0",
    "websockets>=14.0",
    "llama-cpp-python",
    "numpy>=1.26.0",
    # GGUF metadata/tensor inspection (offline model forensics — arch, BOS
    # flags, chat-template tags — without hand-parsing the binary header).
    "gguf>=0.10.0",
]

[tool.uv.sources]
# 2026-07-02 advance (prev rev d37951799450b6461ac73160630371c9d1d36065 = 0.3.39):
# picks up the gemma4uv multimodal projector (unblocks gemma-4 vision via the
# fork's mtmd — one-runtime consolidation), Gemma 4 12B support, and
# ReasoningBudgetSampler (-1/0/N first-reasoning-block budget control — the
# adaptive-reasoning decision layer's actuation primitive). EAGLE-3 remains
# unbound (the new speculative work is NGram-class only).
# 0.3.44 / llama.cpp b10131 (was 8b38e72c = 0.3.40 / b9860). Bumped 2026-07-26
# for the `laguna` arch, which lands at b10087 and is absent from b9860.
# Validated in a throwaway venv first: 409/409 llmvp tests, and every
# internal LLMVP leans on (LlamaContext/LlamaBatch/memory_seq_cp/rm/keep,
# LLAMA_MAX_SEQ, llama_state_seq_get_size) still present. NOTE the MTP/nextn
# symbols went missing (binding declares, vendor no longer exports) — MTP was
# already NO-GO at 0-1% acceptance, but dev/mtp_spike.py will not run on this pin.
# 0.4.0-Milestone / llama.cpp b11058 (was 8a3bcbfb = 0.3.46 / b10355). Bumped
# 2026-09-20 for the `qwen4exp` arch (Qwen3.8 Flash Next) — a hybrid SSM +
# sparse-attention-indexer MoE that b10355 cannot load at all (the arch string
# is absent from libllama). Lands llama-memory-hybrid-idx, the indexer cache
# backing it.
# Validated in a throwaway venv first: 1119/1119 llmvp tests, and a signature
# dump of every internal LLMVP drives (LlamaContext/LlamaBatch/LlamaModel,
# memory_seq_cp/rm/add/pos_max, LLAMA_MAX_SEQ, llama_state_seq_*, the mtmd
# surface) diffed ADDITIVE-ONLY across the major bump — 62/62 present.
# THREE default changes ride along; only the third reaches us:
#   - dry_penalty_last_n 0 -> 64: inert, we only set it when dry_multiplier>0.
#   - a `presence_penalty` alias joins `present_penalty`: inert, we pass the
#     real kwarg (a would-be silent no-op going live — cf. the dead-kwarg class).
#   - load_mode MMAP -> AUTO, plus a new lazy_mode=AUTO (lazy for marked
#     tensors >4 GiB, requires mmap). We pass neither, so this DOES reach us —
#     and it is wanted here: qwen4exp's per_layer_token_embd is a 26.8 GiB
#     sparse PLE table, exactly the tensor lazy loading is for.
llama-cpp-python = { git = "https://github.com/JamePeng/llama-cpp-python.git", rev = "ea19e8d1" }

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.black]
# Defaults, stated explicitly so the standard is a decision rather than
# whatever the installed black happens to do. A future black changing its
# default line length would otherwise reformat the tree silently.
line-length = 88
target-version = ["py312"]
