[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-adventure"
version = "0.1.0"
description = "A text adventure game engine with YAML-driven world data, turn-based combat, and save/load support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Ouroboros Developer" }
]
dependencies = [
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.0"
]

[project.scripts]
text-adventure = "main:main"
