[project]
name = "text-adventure"
version = "0.1.0"
description = "A command‑line text adventure game with combat, inventory, NPCs and save/load support."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]

# Dependencies needed for the game runtime
dependencies = [
    "PyYAML>=6.0",          # For loading world.yaml
]

# Optional development dependencies (linters, formatters, etc.)
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=24.1.0",
]

# Define a console script entry point that runs the game.
[project.scripts]
text-adventure = "main:run"

# Build system configuration (using setuptools)
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
