[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-adventure-game"
version = "0.1.0"
description = "A turn‑based text adventure game with combat, NPCs, and save/load functionality."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"},
]

# Core runtime dependencies
dependencies = [
    "PyYAML>=6.0",
]

# Optional development dependencies (linters, formatters, etc.)
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "black>=23.0",
]

# Define a console script entry point for easy execution
[project.scripts]
text-adventure = "src.main:main"
